  - heading "20. Организация кэш-памяти, способы отображения основной памяти на кэш-память (назначение кэш-памяти, уровни кэш-памяти, факторы эффективности кэш-памяти, схемы вариантов отображения ОП на кэш-память и сравнение)." [level=2] [ref=e946]
  - paragraph [ref=e947]:
    - emphasis [ref=e948]: Нужны
    - emphasis [ref=e949]: схемы вариантов отображения
    - emphasis [ref=e950]: .
  - list [ref=e951]:
    - listitem [ref=e952]:
      - strong [ref=e953]: Назначение кэша
      - text: "— быстрая буферная память между ЦП и ОП, хранит часто используемые данные (принцип локальности: временна́я и пространственная)."
    - listitem [ref=e954]:
      - strong [ref=e955]: "Уровни:"
      - text: L1 (в ядре, самый быстрый, раздельный для команд/данных), L2, L3 (общий для ядер).
    - listitem [ref=e956]:
      - strong [ref=e957]: "Факторы эффективности:"
      - text: объём, скорость, процент попаданий (hit rate), стратегия отображения и замещения.
    - listitem [ref=e958]:
      - strong [ref=e959]: "Способы отображения ОП на кэш:"
      - list [ref=e960]:
        - listitem [ref=e961]:
          - strong [ref=e962]: Прямое (direct-mapped)
          - text: — блок ОП → строго в одну строку кэша (
          - code [ref=e963]: № = адрес mod N
          - text: ). Просто и быстро, но частые вытеснения (конфликты).
        - listitem [ref=e964]:
          - strong [ref=e965]: Полностью ассоциативное
          - text: — блок → в любую строку. Гибко, нет конфликтов, но дорогой поиск (сравнение всех тегов).
        - listitem [ref=e966]:
          - strong [ref=e967]: Множественно-ассоциативное (set-associative)
          - text: — кэш делится на наборы по K строк; блок → в любую строку своего набора.
          - strong [ref=e968]: Компромисс
          - text: ", применяется на практике (2-, 4-, 8-way)."
