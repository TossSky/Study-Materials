          - text: — копии блока в других кэшах помечаются недостоверными (бит достоверности → 0);
        - listitem [ref=e1924]:
          - strong [ref=e1925]: запись с обновлением (write update)
          - text: — запись дублируется во все кэши с копией (широковещательно);
        - listitem [ref=e1926]: разделяемая кэш-память; стандарт SCI.
    - listitem [ref=e1927]:
      - strong [ref=e1928]: "Аппаратные механизмы реализации:"
      - list [ref=e1929]:
        - listitem [ref=e1930]:
          - strong [ref=e1931]: Снупинг (наблюдение, snooping)
          - text: — контроллер каждого кэша следит за шиной; процессоры широковещательно шлют запросы, локальный контроллер аннулирует/обновляет свою копию.
        - listitem [ref=e1932]:
          - strong [ref=e1933]: Справочниковый (directory)
          - text: — централизованный справочник в ОП хранит, у кого какие копии (для больших систем без общей шины).
    - listitem [ref=e1934]:
      - text: Предшественник MESI —
      - strong [ref=e1935]: протокол однократной записи (write-once)
      - text: ": состояния I (Invalid) / V (Valid) / R (Reserved, однократное изменение, учтено в ОЗУ) / D (Dirty)."
    - listitem [ref=e1936]:
      - strong [ref=e1937]: Протокол MESI
      - text: "— 4 состояния строки кэша:"
      - list [ref=e1938]:
        - listitem [ref=e1939]:
          - strong [ref=e1940]: M (Modified)
          - text: — изменена, только здесь, не совпадает с ОП («грязная»).
        - listitem [ref=e1941]:
          - strong [ref=e1942]: E (Exclusive)
          - text: — только здесь, совпадает с ОП (чистая).
        - listitem [ref=e1943]:
          - strong [ref=e1944]: S (Shared)
          - text: — есть копии в других кэшах, совпадает с ОП.
        - listitem [ref=e1945]:
          - strong [ref=e1946]: I (Invalid)
          - text: — недействительна.
