      - strong [ref=e1231]: 2 линии
      - text: (SDA/SCL), адресация устройств, медленнее SPI, для датчиков.
  - heading "33. Система ввода-вывода, организация адресного пространства (способы подключения СВВ к ЦП и ОП, достоинства и недостатки совмещённого и выделенного адресного пространства)." [level=2] [ref=e1232]
