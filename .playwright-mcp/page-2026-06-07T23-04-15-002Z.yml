          - text: — знак (старший бит);
          - strong [ref=e459]: OF
          - text: — переполнение;
          - strong [ref=e460]: PF
          - text: — чётность;
          - strong [ref=e461]: AF
          - text: — вспомогательный перенос.
        - listitem [ref=e462]:
          - text: "Управляющие флаги:"
          - strong [ref=e463]: IF
          - text: (разрешение прерываний),
          - strong [ref=e464]: DF
          - text: (направление),
          - strong [ref=e465]: TF
          - text: (трассировка).
  - heading "8. Основные архитектуры системы команд (описание стековой, аккумуляторной, регистровой архитектуры системы команд и архитектура с выделенным доступом к памяти)." [level=2] [ref=e466]
  - list [ref=e467]:
    - listitem [ref=e468]:
      - strong [ref=e469]: Система команд
      - text: — полный перечень команд, которые способна выполнять машина.
      - strong [ref=e470]: Архитектура системы команд (АСК)
      - text: — совокупность средств,
      - strong [ref=e471]: видимых и доступных программисту
      - text: ". Характеристики АСК: вид/формат данных, место хранения данных, методы доступа, операции над данными, число операндов, способ определения адреса следующей команды, способ кодирования."
    - listitem [ref=e472]: "Хронология АСК: аккумуляторная (1950) → стековая (1963–66) → регистровая (1964) → с выделенным доступом к памяти → CISC (1977–80) → RISC (1987) → VLIW (конец 1990-х) → ROSC (безоперандная, 2001)."
    - listitem [ref=e473]:
      - strong [ref=e474]: "Архитектуры (по способу хранения операндов):"
      - list [ref=e475]:
        - listitem [ref=e476]:
          - strong [ref=e477]: Стековая
          - text: — операнды берутся с вершины стека, безадресные команды. Просто, но медленно (всё через стек).
        - listitem [ref=e478]:
          - strong [ref=e479]: Аккумуляторная
          - text: — один операнд в аккумуляторе, второй в памяти; результат в аккумулятор. Короткие команды, но много обращений к памяти.
        - listitem [ref=e480]:
          - strong [ref=e481]: Регистровая
          - text: "— операнды в регистрах общего назначения (РОН). Быстро, основа RISC. Подвиды: регистр-регистр и регистр-память."
        - listitem [ref=e482]:
          - strong [ref=e483]: С выделенным доступом к памяти (load/store)
          - text: — с памятью работают только команды
          - code [ref=e484]: load
          - text: /
          - code [ref=e485]: store
          - text: ", арифметика только над регистрами. Чистая RISC-модель."
  - heading "9. Основы построения CISC-, RISC- и VLIW-архитектур системы команд (принципы построения основных архитектур, схема процессора, сравнение функций устройства управления в CISC и RISC процессорах)." [level=2] [ref=e486]
  - paragraph [ref=e487]:
    - emphasis [ref=e488]: Нужна
    - emphasis [ref=e489]: схема процессора
    - emphasis [ref=e490]: и
    - emphasis [ref=e491]: сравнение УУ в CISC и RISC
    - emphasis [ref=e492]: .
  - list [ref=e493]:
    - listitem [ref=e494]:
      - strong [ref=e495]: CISC (Complex Instruction Set)
      - text: — много сложных команд разной длины, развитая адресация, команда может делать несколько действий. УУ
      - strong [ref=e496]: микропрограммное
      - text: "(сложное, медленное). Пример: x86."
    - listitem [ref=e497]:
      - strong [ref=e498]: RISC (Reduced Instruction Set)
      - text: — мало простых команд фиксированной длины, выполнение за 1 такт, много регистров, load/store. УУ
      - strong [ref=e499]: аппаратное (схемное)
      - text: "— быстрое. Конвейеризация. Пример: ARM, MIPS."
    - listitem [ref=e500]:
      - strong [ref=e501]: VLIW (Very Long Instruction Word)
      - text: — в одной длинной команде несколько операций, распараллеливание задаёт
      - strong [ref=e502]: компилятор
      - text: "(не процессор). Простое железо, сложный компилятор. Пример: Itanium, Эльбрус."
