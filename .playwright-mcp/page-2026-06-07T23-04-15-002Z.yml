      - list [ref=e157]:
        - listitem [ref=e158]:
          - strong [ref=e159]: непозиционные
          - text: — древние;
        - listitem [ref=e160]:
          - strong [ref=e161]: позиционные
          - text: — вес цифры зависит от позиции (2-, 8-, 10-, 16-ричная);
        - listitem [ref=e162]:
          - strong [ref=e163]: смешанные
          - text: — напр. римская.
    - listitem [ref=e164]:
      - strong [ref=e165]: Числа со знаком
      - text: "(n разрядов, старший — знаковый: 0 = «+», 1 = «−»):"
      - list [ref=e166]:
        - listitem [ref=e167]:
          - strong [ref=e168]: Прямой код
          - text: "— знак + модуль. Минус: два нуля (+0 и −0), сложно вычитать."
        - listitem [ref=e169]:
          - strong [ref=e170]: Обратный код
          - text: — для отрицательных инвертируются все разряды.
