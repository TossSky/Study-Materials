  - heading "10. Форматы команд и виды адресации (классификация команд процессора, примеры форматов команд x86, RISC-16, AVR)." [level=2] [ref=e546]
  - list [ref=e547]:
    - listitem [ref=e548]:
      - strong [ref=e549]: "Классификация команд:"
      - text: пересылки (load/store, mov), арифметико-логические, передачи управления (переходы, вызовы), ввода-вывода, системные.
    - listitem [ref=e550]:
      - strong [ref=e551]: Формат команды
      - text: "= код операции (КОП) + адресная часть. Число адресов: 0 (стек), 1 (аккумулятор), 2–3 (регистровые). Примеры:"
      - strong [ref=e552]: x86
      - text: — переменная длина;
      - strong [ref=e553]: RISC-16 / AVR
      - text: — фиксированная.
    - listitem [ref=e554]:
      - strong [ref=e555]: "Виды адресации:"
      - list [ref=e556]:
        - listitem [ref=e557]:
          - strong [ref=e558]: Прямая
          - text: — в команде сам адрес операнда.
        - listitem [ref=e559]:
          - strong [ref=e560]: Непосредственная
          - text: — операнд прямо в команде (константа).
        - listitem [ref=e561]:
          - strong [ref=e562]: Регистровая
          - text: — операнд в регистре.
        - listitem [ref=e563]:
          - strong [ref=e564]: Косвенная
          - text: — в команде адрес ячейки/регистра, где лежит адрес операнда.
        - listitem [ref=e565]:
          - strong [ref=e566]: Со смещением (базовая/индексная)
          - text: — адрес = базовый регистр + смещение.
        - listitem [ref=e567]:
          - strong [ref=e568]: Относительная
          - text: — адрес = PC + смещение (для переходов).
