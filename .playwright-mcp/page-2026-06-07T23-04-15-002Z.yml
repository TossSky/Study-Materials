    - listitem [ref=e1390]:
      - strong [ref=e1391]: "Алгоритм:"
      - text: сигнал → сохранить состояние (флаги, CS:IP) → по вектору найти обработчик → проверка привилегий → выполнить →
      - code [ref=e1392]: IRET
      - text: .
    - listitem [ref=e1393]:
      - strong [ref=e1394]: "Защита в процедурах прерываний:"
      - text: контроль уровня привилегий (кольца), шлюзы ограничивают точки входа в ядро.
  - heading "40. Чипсет ЭВМ (назначение, архитектура «северный мост – южный мост», пример схемы современного чипсета с указанием основных интерфейсов)." [level=2] [ref=e1395]
