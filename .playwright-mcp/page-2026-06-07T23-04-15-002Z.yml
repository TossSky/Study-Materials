  - heading "21. Порядок замещения строк в кэш-памяти, согласование ОП и кэш-памяти, дисковая кэш-память (перечень алгоритмов выбора замещаемой строки, краткое описание алгоритмов согласование содержимого ОП и кэш-памяти для однопроцессорных ЭВМ, характеристики дисковой кэш-памяти)." [level=2] [ref=e981]
  - list [ref=e982]:
    - listitem [ref=e983]:
      - strong [ref=e984]: "Алгоритмы замещения строки:"
      - list [ref=e985]:
        - listitem [ref=e986]:
          - strong [ref=e987]: LRU
          - text: (Least Recently Used) — вытесняем дольше всех неиспользуемую.
        - listitem [ref=e988]:
          - strong [ref=e989]: LFU
          - text: (Least Frequently Used) — реже всех используемую.
        - listitem [ref=e990]:
          - strong [ref=e991]: FIFO
          - text: — первую вошедшую.
        - listitem [ref=e992]:
          - strong [ref=e993]: Random
          - text: — случайную.
        - listitem [ref=e994]:
          - strong [ref=e995]: ARC
          - text: (Adaptive Replacement Cache) — комбинирует LRU+LFU (патент IBM).
    - listitem [ref=e996]:
      - strong [ref=e997]: "Алгоритмы согласования ОП↔кэш (однопроцессорные ЭВМ):"
      - list [ref=e998]:
        - listitem [ref=e999]:
          - strong [ref=e1000]: Сквозная запись (write-through)
          - text: — сразу в кэш и в ОП. Просто, но медленно.
        - listitem [ref=e1001]:
          - strong [ref=e1002]: Простой свопинг
          - text: — обратная запись блока в ОП при его вытеснении.
        - listitem [ref=e1003]:
          - strong [ref=e1004]: Свопинг с флагами
          - text: — в ОП переписывается только при установленном бите модификации (dirty). Быстрее.
        - listitem [ref=e1005]:
          - strong [ref=e1006]: Регистровый свопинг с флагами
          - text: — то же с буферным регистром для ускорения.
    - listitem [ref=e1007]:
      - strong [ref=e1008]: Дисковый кэш
      - text: — буфер в ОЗУ для часто запрашиваемых секторов диска; ускоряет дисковый ввод-вывод.
  - heading "22. Организация защиты памяти (назначение средств защиты памяти, краткое описание методов защиты памяти)." [level=2] [ref=e1009]
  - list [ref=e1010]:
    - listitem [ref=e1011]:
      - strong [ref=e1012]: "Назначение:"
      - text: не дать программе обратиться к чужой/системной памяти (изоляция, надёжность, безопасность).
    - listitem [ref=e1013]:
      - strong [ref=e1014]: "Методы (4):"
      - list [ref=e1015]:
        - listitem [ref=e1016]:
          - strong [ref=e1017]: Защита отдельных ячеек
          - text: — «разряд защиты» в ячейке запрещает запись в неё (для отладки программ).
        - listitem [ref=e1018]:
          - strong [ref=e1019]: Граничные регистры
          - text: — задают нижнюю и верхнюю границу области процесса.
        - listitem [ref=e1020]:
          - strong [ref=e1021]: Ключи защиты
          - text: — каждому блоку памяти и программе присвоен ключ; доступ при совпадении.
        - listitem [ref=e1022]:
          - strong [ref=e1023]: Кольца защиты (уровни привилегий 0–3)
          - text: — режим ядра vs пользователя; для страниц — биты доступа R/W/X.
  - heading "23. Концепция виртуальной памяти (схемы страничного, сегментного и сегментно-страничного распределения виртуальной памяти, страничная таблица, TLB)." [level=2] [ref=e1024]
  - paragraph [ref=e1025]:
    - emphasis [ref=e1026]: Нужны
    - emphasis [ref=e1027]: схемы страничного, сегментного, сегментно-страничного
    - emphasis [ref=e1028]: распределения.
  - list [ref=e1029]:
    - listitem [ref=e1030]:
      - strong [ref=e1031]: Виртуальная память
      - text: "— механизм: программа работает в логическом (виртуальном) адресном пространстве больше физического; трансляция вирт.→физ. адреса аппаратно (MMU), редко используемое выгружается на диск (swap)."
    - listitem [ref=e1032]:
      - strong [ref=e1033]: Страничное
      - text: — память делится на страницы фиксированного размера. Вирт. адрес = № страницы + смещение → через
      - strong [ref=e1034]: страничную таблицу
      - text: в физ. адрес.
    - listitem [ref=e1035]:
      - strong [ref=e1036]: Сегментное
      - text: "— деление на сегменты переменной длины (по смыслу: код, данные, стек). Адрес = № сегмента + смещение."
    - listitem [ref=e1037]:
      - strong [ref=e1038]: Сегментно-страничное
      - text: "— комбинация: сегменты делятся на страницы (x86). Гибкость сегментов + удобство страниц."
    - listitem [ref=e1039]:
      - strong [ref=e1040]: Страничная таблица
      - text: "— поля записи:"
      - strong [ref=e1041]: V
      - text: (присутствие страницы в ОП; V=0 →
      - strong [ref=e1042]: страничный сбой / page fault
      - text: ),
      - strong [ref=e1043]: R
      - text: (использование — для замещения),
      - strong [ref=e1044]: M
      - text: (модификация — для свопинга с флагами),
      - strong [ref=e1045]: A
      - text: "(права доступа: чтение/запись). Сокращение длины таблицы: многоуровневые таблицы, инвертированная таблица."
    - listitem [ref=e1046]:
      - text: "Характеристики:"
      - strong [ref=e1047]: страничная
      - text: → внутренняя фрагментация;
      - strong [ref=e1048]: сегментная
      - text: → внешняя фрагментация, но удобен разделяемый доступ к общим сегментам.
    - listitem [ref=e1049]:
      - strong [ref=e1050]: TLB (Translation Lookaside Buffer)
      - text: — кэш недавних трансляций адресов (8–4096 записей, полностью/множественно-ассоциативный), ускоряет MMU (без него — лишнее обращение к таблице на каждый доступ).
  - code [ref=e1052]: вирт. адрес ─► [TLB?] ─есть─► физ. адрес └─нет─► страничная таблица ─► физ. адрес (+ занести в TLB)
  - heading "24. Организация НЖМД, SSD, оптической памяти, магнитных лент (характеристики дисковой памяти, принципы организации SSD-памяти, принципы организации оптической памяти, назначение магнитных лент)." [level=2] [ref=e1053]
  - list [ref=e1054]:
    - listitem [ref=e1055]:
      - strong [ref=e1056]: НЖМД (HDD)
      - text: "— магнитные пластины, головки. Геометрия:"
      - strong [ref=e1057]: дорожки, секторы, цилиндры
      - text: ". Характеристики: ёмкость, скорость вращения (об/мин), время доступа (seek), интерфейс. Дёшево за ГБ, но механика — медленно."
    - listitem [ref=e1058]:
      - strong [ref=e1059]: SSD
      - text: "— флеш-память (NAND), нет механики. Быстрее, тише, надёжнее к ударам. Минус: ограниченный ресурс перезаписи ячеек →"
      - strong [ref=e1060]: контроллер с wear-leveling
      - text: (равномерный износ), TRIM. Чем больше параллельных каналов NAND, тем быстрее.
    - listitem [ref=e1061]:
      - strong [ref=e1062]: Оптика (CD/DVD/Blu-ray)
      - text: — данные = питы/лэнды на дорожке, читаются лазером. Спиральная дорожка от центра.
    - listitem [ref=e1063]:
      - strong [ref=e1064]: Магнитные ленты
      - text: — последовательный доступ, огромная ёмкость, дёшево →
      - strong [ref=e1065]: архивное резервное копирование
      - text: .
  - heading "25. Избыточные дисковые подсистемы (назначение, способы повышения производительности ЗУ, способы повышения надёжности ЗУ, схемы уровней RAID-массивов)." [level=2] [ref=e1066]
  - paragraph [ref=e1067]:
    - emphasis [ref=e1068]: Нужны
    - emphasis [ref=e1069]: схемы уровней RAID
    - emphasis [ref=e1070]: .
  - list [ref=e1071]:
    - listitem [ref=e1072]:
      - strong [ref=e1073]: Назначение RAID
      - text: — объединить диски для роста производительности и/или надёжности.
    - listitem [ref=e1074]:
      - strong [ref=e1075]: Производительность
      - text: —
      - strong [ref=e1076]: расслоение (stripe)
      - text: ": данные параллельно на несколько дисков."
    - listitem [ref=e1077]:
      - strong [ref=e1078]: "Надёжность (3 способа):"
      - strong [ref=e1079]: зеркалирование (mirror)
      - text: — избыточность 100%;
      - strong [ref=e1080]: код Хэмминга
      - text: — ~30%;
      - strong [ref=e1081]: контроль чётности (parity)
      - text: — ~20%.
    - listitem [ref=e1082]:
      - strong [ref=e1083]: "Уровни:"
      - list [ref=e1084]:
        - listitem [ref=e1085]:
          - strong [ref=e1086]: RAID 0
          - text: — striping, без избыточности. Быстро, но смерть 1 диска = потеря всего.
        - listitem [ref=e1087]:
          - strong [ref=e1088]: RAID 1
          - text: — mirroring (зеркало). Надёжно, но 50% ёмкости.
        - listitem [ref=e1089]:
          - strong [ref=e1090]: RAID 5
          - text: — striping + чётность по всем дискам. Переживает отказ 1 диска. Баланс.
        - listitem [ref=e1091]:
          - strong [ref=e1092]: RAID 6
          - text: — две чётности, переживает 2 диска.
        - listitem [ref=e1093]:
          - strong [ref=e1094]: RAID 10 (1+0)
          - text: — зеркало + страйп. Скорость и надёжность, дорого.
  - img [ref=e1096]:
    - generic [ref=e1102]: RAID
    - generic [ref=e1104]: RAID 0страйп (скорость)
    - generic [ref=e1106]: RAID 1зеркало
    - generic [ref=e1108]: RAID 5страйп + чётность
    - generic [ref=e1110]: RAID 62 чётности
    - generic [ref=e1112]: RAID 10зеркало + страйп
  - heading "26. Основы построения компьютерных шин (типы шин, иерархия шин, ША, ШД, ШУ, состав линий в ШУ)." [level=2] [ref=e1113]
  - list [ref=e1114]:
    - listitem [ref=e1115]:
      - strong [ref=e1116]: Шина (bus)
      - text: — набор линий для обмена между функциональными блоками (ЦП↔память, ЦП↔ВВ, память↔ВВ); «двунаправленный универсальный коммутатор».
    - listitem [ref=e1117]:
      - strong [ref=e1118]: "Функциональные типы:"
      - list [ref=e1119]:
        - listitem [ref=e1120]:
          - strong [ref=e1121]: ША (адреса)
          - text: —
          - strong [ref=e1122]: однонаправленная
          - text: ", разрядность задаёт объём адресуемой памяти ("
          - code [ref=e1123]: N=2ⁱ
          - text: );
        - listitem [ref=e1124]:
          - strong [ref=e1125]: ШД (данных)
          - text: —
          - strong [ref=e1126]: двунаправленная
          - text: ", последовательная или параллельная, ширина = слово;"
        - listitem [ref=e1127]:
          - strong [ref=e1128]: ШУ (управления)
          - text: — линии управляющей информации и состояния.
    - listitem [ref=e1129]:
      - strong [ref=e1130]: "Иерархия шин:"
      - text: системная (ЦП–память) → шина расширения → шина ввода/вывода (через адаптеры); архитектура с «пристройкой» (mezzanine). Чем ближе к ЦП, тем быстрее.
    - listitem [ref=e1131]:
      - strong [ref=e1132]: "Состав линий ШУ (7 групп):"
      - text: сигналы управления транзакциями (тип операции, кол-во передаваемых байт, тип адреса, тип протокола), информация состояния (статуса), арбитраж, прерывания, последовательные локальные сети, позиционный код, тактирование и синхронизация.
  - heading "27. Организация арбитража шины (схемы приоритетов, схемы арбитража, способы организации опроса)." [level=2] [ref=e1133]
  - paragraph [ref=e1134]:
    - emphasis [ref=e1135]: Нужны
    - emphasis [ref=e1136]: схемы приоритетов и арбитража
    - emphasis [ref=e1137]: .
  - list [ref=e1138]:
    - listitem [ref=e1139]:
      - strong [ref=e1140]: Арбитраж
      - text: — процедура допуска к управлению шиной только одного из ведущих (master).
      - strong [ref=e1141]: Арбитр
      - text: распределяет доступ (обычно на северном мосту).
    - listitem [ref=e1142]:
      - strong [ref=e1143]: "Схемы приоритетов:"
      - strong [ref=e1144]: статические
      - text: (фиксированные) и
      - strong [ref=e1145]: динамические
      - text: ". Динамические алгоритмы: простая циклическая смена, циклическая с учётом последнего запроса, по случайному закону, равных приоритетов, LRU (наиболее давнее использование)."
    - listitem [ref=e1146]:
      - strong [ref=e1147]: "Схемы арбитража:"
      - list [ref=e1148]:
        - listitem [ref=e1149]:
          - strong [ref=e1150]: Централизованная
          - text: "(один арбитр):"
          - list [ref=e1151]:
            - listitem [ref=e1152]:
              - strong [ref=e1153]: параллельная
              - text: — у каждого ведущего своя линия запроса/предоставления;
            - listitem [ref=e1154]:
              - strong [ref=e1155]: последовательная (цепочечная, daisy chain)
              - text: — сигнал разрешения идёт по цепочке, ближний к арбитру = высший приоритет.
        - listitem [ref=e1156]:
          - strong [ref=e1157]: Децентрализованная (распределённая)
          - text: — единого арбитра нет, у каждого ведущего свой контроллер шины.
    - listitem [ref=e1158]:
      - strong [ref=e1159]: "Способы организации опроса:"
      - strong [ref=e1160]: централизованный
      - text: (контроллер по очереди опрашивает ведущих, выставляя их адрес) и
      - strong [ref=e1161]: децентрализованный
      - text: (каждый ведущий сам формирует адрес следующего).
  - heading "28. Типы протоколов шин, синхронная и асинхронная передача данных (управление процессом передачи данных, схемы и принципы работы протоколов шин)." [level=2] [ref=e1162]
  - paragraph [ref=e1163]:
    - emphasis [ref=e1164]: Нужны
    - emphasis [ref=e1165]: схемы протоколов
    - emphasis [ref=e1166]: .
  - list [ref=e1167]:
    - listitem [ref=e1168]:
      - strong [ref=e1169]: Синхронная передача
      - text: — общий тактовый сигнал, события привязаны к фронтам такта. Быстро и просто, но все устройства на одной частоте, длина ограничена.
    - listitem [ref=e1170]:
      - strong [ref=e1171]: Асинхронная передача
      - text: — без общего такта, по
      - strong [ref=e1172]: квитированию (handshake)
      - text: ": запрос → готовность (request/acknowledge). Гибко (разные скорости устройств), но медленнее и сложнее."
  - code [ref=e1174]: "Синхронная: CLK ‾|_|‾|_|‾|_ данные привязаны к фронтам Асинхронная: REQ ──► устройство ──► ACK (рукопожатие)"
  - heading "29. Методы повышения эффективности шин, надёжность и отказоустойчивость шины (способы повышения эффективности шин, способы повышения надёжности шин)." [level=2] [ref=e1175]
  - list [ref=e1176]:
    - listitem [ref=e1177]:
      - strong [ref=e1178]: "Повышение эффективности (полосы):"
      - strong [ref=e1179]: отказ от мультиплексирования
      - text: ША/ШД, увеличение ширины ШД и тактовой частоты,
      - strong [ref=e1180]: блочные/пакетные транзакции (burst)
      - text: ","
      - strong [ref=e1181]: конвейеризация
      - text: и
      - strong [ref=e1182]: расщепление транзакций (split)
      - text: ", арбитраж с перекрытием и с удержанием шины, переход на"
      - strong [ref=e1183]: последовательные дифференциальные
      - text: линии (PCIe вместо PCI).
    - listitem [ref=e1184]:
      - strong [ref=e1185]: "Повышение надёжности:"
      - text: контроль чётности/ECC на шине, дублирование/резервные линии, экранирование, протоколы повтора при ошибке.
  - 'heading "30. Внутренние интерфейсы ЭВМ: EISA, LPC, PCI, PCI-E, AGP (основные характеристики)." [level=2] [ref=e1186]'
  - list [ref=e1187]:
    - listitem [ref=e1188]:
      - strong [ref=e1189]: EISA
      - text: — расширение ISA, 32-бит, для серверов (устаревший).
    - listitem [ref=e1190]:
      - strong [ref=e1191]: LPC (Low Pin Count)
      - text: — для низкоскоростной периферии (контроллеры клавиатуры, BIOS), заменил ISA.
    - listitem [ref=e1192]:
      - strong [ref=e1193]: PCI
      - text: — параллельная, 32/64-бит, 33/66 МГц, общая шина с арбитражем (устаревает).
    - listitem [ref=e1194]:
      - strong [ref=e1195]: PCI-E (PCI Express)
      - text: —
      - strong [ref=e1196]: последовательная
      - text: ", по «линиям» (lanes ×1…×16), независимые дифференциальные пары, point-to-point. Современный стандарт."
    - listitem [ref=e1197]:
      - strong [ref=e1198]: AGP
      - text: — выделенный интерфейс для видеокарт (между PCI и PCI-E исторически), вытеснен PCI-E.
