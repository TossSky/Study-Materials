      - strong [ref=e1312]: ПДП (DMA)
      - text: — обмен ПУ↔память
      - strong [ref=e1313]: без участия ЦП
      - text: ", через контроллер"
      - strong [ref=e1314]: КПДП (DMAC)
      - text: . ЦП освобождается, эффективно для больших блоков.
    - listitem [ref=e1315]:
      - strong [ref=e1316]: "Способы распределения шины между ЦП и КПДП:"
      - list [ref=e1317]:
        - listitem [ref=e1318]:
          - strong [ref=e1319]: С захватом цикла (cycle stealing)
          - text: — КПДП «крадёт» отдельные циклы шины.
        - listitem [ref=e1320]:
          - strong [ref=e1321]: Блочный (burst)
          - text: — КПДП захватывает шину на весь блок.
        - listitem [ref=e1322]:
          - strong [ref=e1323]: Прозрачный
          - text: — КПДП работает, когда ЦП не использует шину.
  - img [ref=e1325]:
