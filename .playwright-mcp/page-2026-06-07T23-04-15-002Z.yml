  - 'heading "32. Внешние интерфейсы для ввода/вывода: RS-232C, LPT (EPP, ECP), USB, SPI, I²C (основные характеристики)." [level=2] [ref=e1217]'
  - list [ref=e1218]:
    - listitem [ref=e1219]:
      - strong [ref=e1220]: RS-232C
      - text: — последовательный COM-порт, низкая скорость, для модемов/терминалов (устарел).
    - listitem [ref=e1221]:
