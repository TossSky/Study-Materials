  - heading "Конспект к экзамену по АСВТ (Семенов П.О.)" [level=1] [ref=e6]
  - blockquote [ref=e7]:
    - paragraph [ref=e8]:
      - strong [ref=e9]: Как пользоваться.
      - text: "Это 55 готовых ответов в формате, который требует препод: ключевые определения (жирным), краткие тезисы, схемы там, где в вопросе есть слово «схема». На билет 40 минут, 3 вопроса (начало / середина / конец курса). Сочинения не нужны — нужны ключевые моменты, выводы и схемки."
    - paragraph [ref=e10]:
      - strong [ref=e11]: "Правила оценки (со слов старосты):"
      - text: "- Не ответил вообще ни на один из 3 вопросов → выше тройки не поставят."
      - strong [ref=e12]: "Вывод: на каждый вопрос знай хоть что-то."
      - text: "- Описал смежное, а не то, что спросили → минимальный балл. Отвечай строго по теме. - Нет схемы там, где в вопросе слово «схема» → большой минус. В остальных — схемы по желанию. - Транзисторы в вентилях рисовать НЕ надо. Максимум один пример схемы вентиля/триггера — и то если есть время. - Семенов жёстко и много спрашивает"
      - strong [ref=e13]: параллельные вычисления (в. 44–55)
      - text: — это приоритет. -
      - strong [ref=e14]: "Процессоры (Intel/AMD):"
      - text: хронология ЦП + современные Intel и AMD, их особенности и отличия; конкретные старые модели зубрить не надо.
    - paragraph [ref=e15]: Дальше — по номерам списка 2026. Ключевые определения и термины — жирным.
  - separator [ref=e16]
  - list [ref=e18]:
    - listitem [ref=e19]:
      - link "Конспект к экзамену по АСВТ (Семенов П.О.)" [ref=e20] [cursor=pointer]:
        - /url: "#_1"
    - listitem [ref=e21]:
      - link "БЛОК 1. Начало курса (вопросы 1–18)" [ref=e22] [cursor=pointer]:
        - /url: "#1-118"
      - list [ref=e23]:
        - listitem [ref=e24]:
          - 'link "1. Представление информации в ЭВМ (понятие информации, виды систем счисления, способы представления чисел со знаком и примеры, способы представления вещественных чисел и примеры, методы кодирования информации: текст, графика, звук/видео)." [ref=e25] [cursor=pointer]':
            - /url: "#1"
        - listitem [ref=e26]:
          - 'link "2. Этапы развития вычислительной техники, классификация ВМ (этапы информатизации, поколения ЭВМ: элементная база, ключевые черты, классификация ВМ)." [ref=e27] [cursor=pointer]':
            - /url: "#2"
        - listitem [ref=e28]:
          - link "3. Назначение и характеристики элементарных узлов ЭВМ (вентили, триггеры, сумматоры, счётчики, компараторы, шифраторы/дешифраторы, мультиплексоры/демультиплексоры, ЦАП/АЦП – назначение и краткое описание всех узлов)." [ref=e29] [cursor=pointer]:
            - /url: "#3"
        - listitem [ref=e30]:
          - 'link "4. Специализированные интегральные схемы (схема ПЛМ, типы компонентов FPGA, принципы работы программируемых элементов FPGA: SRAM-based, antifuse, flash)." [ref=e31] [cursor=pointer]':
            - /url: "#4-fpga-fpga-sram-based-antifuse-flash"
        - listitem [ref=e32]:
          - link "5. Архитектуры ЭВМ и принципы фон Неймана (уровни детализации структуры ВМ, принципы фон-неймановской концепции, структура фон-неймановской ВМ, виды архитектур ЭВМ)." [ref=e33] [cursor=pointer]:
            - /url: "#5-"
        - listitem [ref=e34]:
          - link "6. Функциональные блоки ЦП (схема и назначение АЛУ, схема и назначение УУ, основные регистры ЦП)." [ref=e35] [cursor=pointer]:
            - /url: "#6"
        - listitem [ref=e36]:
          - link "7. Командный цикл процессора, регистр флагов и состояния (понятия команды, потока управления и исполнительного адреса, описание командного цикла, описание флагов в регистре флагов и состояний)." [ref=e37] [cursor=pointer]:
            - /url: "#7"
        - listitem [ref=e38]:
          - link "8. Основные архитектуры системы команд (описание стековой, аккумуляторной, регистровой архитектуры системы команд и архитектура с выделенным доступом к памяти)." [ref=e39] [cursor=pointer]:
            - /url: "#8"
        - listitem [ref=e40]:
          - link "9. Основы построения CISC-, RISC- и VLIW-архитектур системы команд (принципы построения основных архитектур, схема процессора, сравнение функций устройства управления в CISC и RISC процессорах)." [ref=e41] [cursor=pointer]:
            - /url: "#9-cisc-risc-vliw-cisc-risc"
        - listitem [ref=e42]:
          - link "10. Форматы команд и виды адресации (классификация команд процессора, примеры форматов команд x86, RISC-16, AVR)." [ref=e43] [cursor=pointer]:
            - /url: "#10-x86-risc-16-avr"
        - listitem [ref=e44]:
          - link "11. Понятия конвейерной, суперскалярной и векторной обработки (схема работы конвейера, показатели эффективности конвейера, схема суперскалярного ЦП, конфликты в конвейере, назначение MMX, 3DNow!, SSE, SSE2,…)." [ref=e45] [cursor=pointer]:
            - /url: "#11-mmx-3dnow-sse-sse2"
        - listitem [ref=e46]:
          - link "12. Технологии динамического исполнения (краткое описание средств динамического исполнения, технология многократного декодирование команд)." [ref=e47] [cursor=pointer]:
            - /url: "#12"
        - listitem [ref=e48]:
          - link "13. Основы микроархитектур процессоров (понятие микроархитектуры, технологические нормы, производительность, эксплуатационные характеристики МП, физические параметры МП, общая структура МП)." [ref=e49] [cursor=pointer]:
            - /url: "#13"
        - listitem [ref=e50]:
          - link "14. Микроархитектуры процессоров Intel (перечень поколений и характерные черты микропроцессоров, схема и характеристики какого-нибудь из последних МП)." [ref=e51] [cursor=pointer]:
            - /url: "#14-intel-"
        - listitem [ref=e52]:
          - link "15. Микроархитектуры процессоров AMD (перечень поколения и характерные черты микропроцессоров, схема и характеристики какого-нибудь из последних МП)." [ref=e53] [cursor=pointer]:
            - /url: "#15-amd-"
        - listitem [ref=e54]:
          - link "16. Основы построения компьютерной памяти (методы доступа к данным, характеристики памяти, иерархическая организация памяти, обнаружение и исправление ошибок)." [ref=e55] [cursor=pointer]:
            - /url: "#16"
        - listitem [ref=e56]:
          - link "17. Основная память, статические ОЗУ (структура ОП, характеристики, блочная организация ОП, запоминающий элемент в статическом ОЗУ, виды статических ОЗУ)." [ref=e57] [cursor=pointer]:
            - /url: "#17"
        - listitem [ref=e58]:
          - link "18. Динамические ОЗУ (виды динамических ОЗУ, запоминающий элемент, методы ускорения микросхемы, способы регенерации данных)." [ref=e59] [cursor=pointer]:
            - /url: "#18"
