  - heading "45. Метрики параллельных вычислений, закон Амдала (7 метрик с формулами и закон Амдала с выводами)." [level=2] [ref=e1536]
  - paragraph [ref=e1537]:
    - emphasis [ref=e1538]: Нужны
    - emphasis [ref=e1539]: 7 метрик с формулами
    - emphasis [ref=e1540]: и
    - emphasis [ref=e1541]: закон Амдала с выводами
    - emphasis [ref=e1542]: .
  - paragraph [ref=e1543]:
    - text: "Обозначения:"
    - code [ref=e1544]: T(1)=O(1)
    - text: — время/объём операций на 1 процессоре;
    - code [ref=e1545]: T(n)
    - text: ","
    - code [ref=e1546]: O(n)
    - text: — время и объём операций на n процессорах.
  - list [ref=e1547]:
    - listitem [ref=e1548]:
      - strong [ref=e1549]: Степень параллелизма
      - code [ref=e1550]: P(t)
      - text: — число процессоров, одновременно выполняющих программу в момент t (даёт
      - strong [ref=e1551]: профиль параллелизма
      - text: ).
    - listitem [ref=e1552]:
      - strong [ref=e1553]: Индекс параллелизма
      - code [ref=e1554]: PI(n) = O(n) / T(n)
      - text: — средняя скорость (операций в единицу времени).
    - listitem [ref=e1555]:
      - strong [ref=e1556]: Ускорение
      - code [ref=e1557]: S(n) = T(1) / T(n)
      - text: — во сколько раз быстрее. Идеал
      - code [ref=e1558]: S = n
      - text: .
    - listitem [ref=e1559]:
      - strong [ref=e1560]: Эффективность
      - code [ref=e1561]: E(n) = S(n)/n = T(1) / (n·T(n))
      - text: — доля ускорения на один процессор (0…1).
    - listitem [ref=e1562]:
      - strong [ref=e1563]: Утилизация
      - code [ref=e1564]: U(n) = O(n) / (n·T(n))
      - text: (= R·E).
    - listitem [ref=e1565]:
      - strong [ref=e1566]: Избыточность
      - code [ref=e1567]: R(n) = O(n) / O(1)
      - text: — во сколько раз больше операций.
    - listitem [ref=e1568]:
