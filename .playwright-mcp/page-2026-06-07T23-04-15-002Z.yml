  - heading "37. Каналы и процессоры ввода/вывода (принципы работы, схема, управляющие слова канала, БУВУ)." [level=2] [ref=e1339]
  - list [ref=e1340]:
    - listitem [ref=e1341]:
      - strong [ref=e1342]: Назначение
      - text: "— разгрузить ЦП: канал = специализированный процессор ВВ, выполняет"
      - strong [ref=e1343]: канальную программу
      - text: (управляющие слова канала, УСК).
    - listitem [ref=e1344]:
      - strong [ref=e1345]: "Режимы работы канала:"
      - list [ref=e1346]:
        - listitem [ref=e1347]:
          - strong [ref=e1348]: Мультиплексный
          - text: — несколько ВУ разделяют канал во времени (много медленных устройств, короткими сеансами; байт-/блок-мультиплексный).
        - listitem [ref=e1349]:
          - strong [ref=e1350]: Монопольный
          - text: — одно (быстрое) ВУ монополизирует канал до завершения канальной программы (диски).
    - listitem [ref=e1351]:
      - strong [ref=e1352]: БУВУ (блок управления внешними устройствами)
      - text: — управляет конкретным ПУ под командой канала.
  - heading "38. Организации системы прерываний. (способы организации системы прерываний, виды прерываний, аппаратные и программные средства системы прерываний)." [level=2] [ref=e1353]
  - list [ref=e1354]:
    - listitem [ref=e1355]:
      - strong [ref=e1356]: Прерывание
      - text: — приостановка текущей программы для реакции на событие, с переходом на обработчик и возвратом.
    - listitem [ref=e1357]:
      - strong [ref=e1358]: "Виды прерываний:"
      - list [ref=e1359]:
        - listitem [ref=e1360]:
          - strong [ref=e1361]: Аппаратные внешние
          - text: — от устройств (IRQ).
        - listitem [ref=e1362]:
          - strong [ref=e1363]: Внутренние (исключения)
          - text: "— ошибки ЦП. Три типа:"
          - strong [ref=e1364]: отказ (fault)
          - text: — обнаруживается до инструкции, после обработки возврат на
          - strong [ref=e1365]: ту же
          - text: "инструкцию (отказ страницы #PF, деление на 0 #DE);"
          - strong [ref=e1366]: ловушка (trap)
          - text: — после инструкции, возврат на
          - strong [ref=e1367]: следующую
          - text: "(#BP, #OF);"
          - strong [ref=e1368]: аварийное завершение (abort)
          - text: — нельзя точно установить инструкцию (#DF двойной отказ).
        - listitem [ref=e1369]:
          - strong [ref=e1370]: Программные
          - text: — команда
          - code [ref=e1371]: INT n
          - text: (системные вызовы).
    - listitem [ref=e1372]:
      - text: Внешние делятся на
      - strong [ref=e1373]: немаскируемые (NMI)
      - text: и
      - strong [ref=e1374]: маскируемые (INTR)
      - text: (маскируются флагом IF).
    - listitem [ref=e1375]:
      - strong [ref=e1376]: "Способы организации:"
      - text: опрос (polling), векторные прерывания, приоритеты.
    - listitem [ref=e1377]:
      - strong [ref=e1378]: "Средства:"
      - text: аппаратные — выводы ЦП (INTR/NMI/INTA),
      - strong [ref=e1379]: контроллер прерываний (8259A / APIC)
      - text: для приоритезации и маскирования; программные — таблица векторов, флаги IF/TF, команды
      - code [ref=e1380]: int/iret/cli/sti
      - text: .
  - heading "39. Прерываний в реальном и защищённом режимах, защита в процедурах прерываний (таблицы векторов прерываний, шлюзы прерываний, алгоритмы выполнения прерываний, средства защиты в процедурах прерываний)." [level=2] [ref=e1381]
  - list [ref=e1382]:
    - listitem [ref=e1383]:
      - strong [ref=e1384]: Реальный режим
      - text: —
      - strong [ref=e1385]: таблица векторов прерываний (IVT)
      - text: в начале памяти, каждый вектор = адрес обработчика (CS:IP).
    - listitem [ref=e1386]:
      - strong [ref=e1387]: Защищённый режим
      - text: —
      - strong [ref=e1388]: IDT (таблица дескрипторов прерываний)
      - text: из
      - strong [ref=e1389]: шлюзов (gates)
