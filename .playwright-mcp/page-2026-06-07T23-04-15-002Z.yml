            - /url: "#22"
        - listitem [ref=e71]:
          - link "23. Концепция виртуальной памяти (схемы страничного, сегментного и сегментно-страничного распределения виртуальной памяти, страничная таблица, TLB)." [ref=e72] [cursor=pointer]:
            - /url: "#23-tlb"
        - listitem [ref=e73]:
          - link "24. Организация НЖМД, SSD, оптической памяти, магнитных лент (характеристики дисковой памяти, принципы организации SSD-памяти, принципы организации оптической памяти, назначение магнитных лент)." [ref=e74] [cursor=pointer]:
            - /url: "#24-ssd-ssd-"
        - listitem [ref=e75]:
          - link "25. Избыточные дисковые подсистемы (назначение, способы повышения производительности ЗУ, способы повышения надёжности ЗУ, схемы уровней RAID-массивов)." [ref=e76] [cursor=pointer]:
            - /url: "#25-raid-"
        - listitem [ref=e77]:
          - link "26. Основы построения компьютерных шин (типы шин, иерархия шин, ША, ШД, ШУ, состав линий в ШУ)." [ref=e78] [cursor=pointer]:
            - /url: "#26"
        - listitem [ref=e79]:
