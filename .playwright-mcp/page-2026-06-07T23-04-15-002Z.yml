  - heading "3. Назначение и характеристики элементарных узлов ЭВМ (вентили, триггеры, сумматоры, счётчики, компараторы, шифраторы/дешифраторы, мультиплексоры/демультиплексоры, ЦАП/АЦП – назначение и краткое описание всех узлов)." [level=2] [ref=e263]
  - paragraph [ref=e264]:
    - emphasis [ref=e265]: Схему рисовать не требует — только назначение. Можно один пример (напр. вентиль).
  - list [ref=e266]:
    - listitem [ref=e267]:
      - strong [ref=e268]: Вентиль (логический элемент)
      - text: — реализует булеву функцию (И, ИЛИ, НЕ, И-НЕ, ИЛИ-НЕ, XOR). Базовый кирпич схемотехники.
    - listitem [ref=e269]:
      - strong [ref=e270]: Триггер
      - text: — элемент памяти на 1 бит, имеет 2 устойчивых состояния (RS, D, T, JK).
    - listitem [ref=e271]:
      - strong [ref=e272]: Сумматор
      - text: — сложение двоичных чисел (полусумматор, полный сумматор с переносом).
    - listitem [ref=e273]:
      - strong [ref=e274]: Счётчик
      - text: — подсчёт импульсов / хранение числа, +1 каждый такт (суммирующий, вычитающий, реверсивный).
    - listitem [ref=e275]:
      - strong [ref=e276]: Компаратор
      - text: — сравнение двух чисел (=, <, >).
    - listitem [ref=e277]:
      - strong [ref=e278]: Шифратор / дешифратор
      - text: "— преобразование кода: позиционный код ↔ двоичный (дешифратор активирует один выход по входному коду)."
    - listitem [ref=e279]:
      - strong [ref=e280]: Мультиплексор / демультиплексор
      - text: — MUX выбирает один из N входов на общий выход по адресу; DEMUX — наоборот, направляет вход на один из N выходов.
    - listitem [ref=e281]:
      - strong [ref=e282]: ЦАП / АЦП
      - text: "— преобразование цифра↔аналог: ЦАП цифровой код → напряжение, АЦП напряжение → цифровой код (дискретизация + квантование)."
