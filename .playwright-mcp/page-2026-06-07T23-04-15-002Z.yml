  - heading "12. Технологии динамического исполнения (краткое описание средств динамического исполнения, технология многократного декодирование команд)." [level=2] [ref=e697]
  - list [ref=e698]:
    - listitem [ref=e699]:
      - strong [ref=e700]: Динамическое исполнение
      - text: "— процессор сам меняет порядок и условия выполнения команд для загрузки конвейера. Средства:"
      - list [ref=e701]:
        - listitem [ref=e702]:
          - strong [ref=e703]: Предсказание переходов (branch prediction)
          - text: — угадывает направление ветвления, заранее грузит команды.
        - listitem [ref=e704]:
          - strong [ref=e705]: Спекулятивное (упреждающее) исполнение
          - text: — выполняет команды до того, как известно, нужны ли они; результат отбрасывается, если предсказание неверно.
        - listitem [ref=e706]:
          - strong [ref=e707]: Внеочередное исполнение (out-of-order)
          - text: — команды исполняются по готовности данных, а не по порядку.
        - listitem [ref=e708]:
          - strong [ref=e709]: Переименование регистров
          - text: — устраняет ложные зависимости по регистрам.
    - listitem [ref=e710]:
      - strong [ref=e711]: Многократное (множественное) декодирование команд
      - text: — несколько декодеров параллельно разбирают команды, преобразуя сложные CISC-команды в простые микрооперации (μops) для конвейера.
  - heading "13. Основы микроархитектур процессоров (понятие микроархитектуры, технологические нормы, производительность, эксплуатационные характеристики МП, физические параметры МП, общая структура МП)." [level=2] [ref=e712]
  - list [ref=e713]:
    - listitem [ref=e714]:
      - strong [ref=e715]: Микроархитектура
      - text: "— аппаратная организация и логическая структура микропроцессора: регистры, управляющие схемы, АЛУ, запоминающие устройства, информационные магистрали. Противопоставляется"
      - strong [ref=e716]: макроархитектуре
      - text: = система команд, типы данных, режимы адресации, принципы работы МП.
    - listitem [ref=e717]:
      - strong [ref=e718]: Технологический процесс (техпроцесс/нормы)
      - text: — размер элементов на кристалле (нм). Чем меньше, тем больше транзисторов и ниже энергопотребление.
    - listitem [ref=e719]:
      - strong [ref=e720]: Степень интеграции
      - text: — число элементов на кристалле.
    - listitem [ref=e721]:
      - strong [ref=e722]: "Производительность:"
      - text: тактовая частота ядра, частота системной шины, объём кэша (L1/L2/L3).
    - listitem [ref=e723]:
      - strong [ref=e724]: "Эксплуатационные характеристики:"
      - text: напряжение питания, потребляемая мощность, тепловыделение (TDP), макс. температура.
    - listitem [ref=e725]:
      - strong [ref=e726]: "Физические параметры:"
      - text: тип и размер корпуса, размер кристалла, число и форма выводов.
    - listitem [ref=e727]:
      - strong [ref=e728]: "Общая структура МП:"
      - text: ядро (АЛУ, регистры, кэш L1/L2) + контроллер памяти + шина/интерконнект между ядрами + периферийные блоки (графика, контроллеры ВВ).
