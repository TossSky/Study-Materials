      - strong [ref=e875]: Запоминающий элемент DRAM
      - text: —
      - strong [ref=e876]: 1 транзистор + 1 конденсатор
      - text: ". Бит = заряд конденсатора. Дёшево, высокая плотность → основная память. Минус: заряд утекает → нужна"
      - strong [ref=e877]: регенерация
      - text: .
    - listitem [ref=e878]:
      - strong [ref=e879]: "Способы регенерации (3, по лекции):"
      - strong [ref=e880]: ROR
      - text: (RAS Only Refresh — построчно),
      - strong [ref=e881]: CBR
      - text: (CAS before RAS — по внутреннему счётчику строк),
      - strong [ref=e882]: Self-Refresh
      - text: (авторегенерация в режиме энергосбережения).
    - listitem [ref=e883]:
      - strong [ref=e884]: "Методы ускорения:"
      - text: FPM, EDO,
      - strong [ref=e885]: SDRAM
      - text: (синхронная),
      - strong [ref=e886]: DDR/DDR2/3/4/5
      - text: (передача по обоим фронтам такта, удвоение/учетверение полосы).
  - separator [ref=e887]
