  - heading "36. Прямой доступ к памяти (схема подключения КПДП, способы распределения системной шины между ЦП и КПДП, примеры схем конфигураций систем ПДП)." [level=2] [ref=e1267]
  - paragraph [ref=e1268]:
    - emphasis [ref=e1269]: Нужна
    - emphasis [ref=e1270]: схема КПДП
    - emphasis [ref=e1271]: и
    - emphasis [ref=e1272]: конфигурации
    - emphasis [ref=e1273]: .
  - list [ref=e1274]:
    - listitem [ref=e1275]:
      - strong [ref=e1276]: ПДП (DMA)
      - text: — обмен ПУ↔память
      - strong [ref=e1277]: без участия ЦП
      - text: ", через контроллер"
      - strong [ref=e1278]: КПДП (DMAC)
      - text: . ЦП освобождается, эффективно для больших блоков.
    - listitem [ref=e1279]:
      - strong [ref=e1280]: "Способы распределения шины между ЦП и КПДП:"
      - list [ref=e1281]:
