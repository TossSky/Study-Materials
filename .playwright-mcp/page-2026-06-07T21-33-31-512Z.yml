  - heading "5. Архитектуры ЭВМ и принципы фон Неймана (уровни детализации структуры ВМ, принципы фон-неймановской концепции, структура фон-неймановской ВМ, виды архитектур ЭВМ)." [level=2] [ref=e301]
  - paragraph [ref=e302]:
    - emphasis [ref=e303]: Нужна
    - emphasis [ref=e304]: структура фон-неймановской ВМ
    - emphasis [ref=e305]: .
  - list [ref=e306]:
    - listitem [ref=e307]:
      - strong [ref=e308]: "Уровни детализации структуры ВМ (7, сверху вниз):"
      - text: языки высокого уровня → ассемблер → ОС → архитектура системы команд → микроархитектура → цифровой логический → физический (транзисторный).
    - listitem [ref=e309]:
      - strong [ref=e310]: "Принципы фон Неймана:"
      - list [ref=e311]:
        - listitem [ref=e312]:
          - strong [ref=e313]: Двоичное кодирование
          - text: данных и команд.
        - listitem [ref=e314]:
          - strong [ref=e315]: Программное управление
          - text: — программа из команд, выполняемых последовательно.
        - listitem [ref=e316]:
          - strong [ref=e317]: Однородность памяти
          - text: — команды и данные в одной памяти, неразличимы по виду (команду можно обрабатывать как данные).
        - listitem [ref=e318]:
          - strong [ref=e319]: Адресуемость памяти
          - text: — память из ячеек с адресами, доступ по адресу.
