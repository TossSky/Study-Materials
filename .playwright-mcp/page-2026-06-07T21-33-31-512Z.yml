  - heading "3. Назначение и характеристики элементарных узлов ЭВМ (вентили, триггеры, сумматоры, счётчики, компараторы, шифраторы/дешифраторы, мультиплексоры/демультиплексоры, ЦАП/АЦП – назначение и краткое описание всех узлов)." [level=2] [ref=e246]
  - paragraph [ref=e247]:
    - emphasis [ref=e248]: Схему рисовать не требует — только назначение. Можно один пример (напр. вентиль).
  - list [ref=e249]:
    - listitem [ref=e250]:
      - strong [ref=e251]: Вентиль (логический элемент)
      - text: — реализует булеву функцию (И, ИЛИ, НЕ, И-НЕ, ИЛИ-НЕ, XOR). Базовый кирпич схемотехники.
    - listitem [ref=e252]:
      - strong [ref=e253]: Триггер
      - text: — элемент памяти на 1 бит, имеет 2 устойчивых состояния (RS, D, T, JK).
    - listitem [ref=e254]:
      - strong [ref=e255]: Сумматор
      - text: — сложение двоичных чисел (полусумматор, полный сумматор с переносом).
    - listitem [ref=e256]:
      - strong [ref=e257]: Счётчик
      - text: — подсчёт импульсов / хранение числа, +1 каждый такт (суммирующий, вычитающий, реверсивный).
    - listitem [ref=e258]:
      - strong [ref=e259]: Компаратор
      - text: — сравнение двух чисел (=, <, >).
    - listitem [ref=e260]:
      - strong [ref=e261]: Шифратор / дешифратор
      - text: "— преобразование кода: позиционный код ↔ двоичный (дешифратор активирует один выход по входному коду)."
    - listitem [ref=e262]:
      - strong [ref=e263]: Мультиплексор / демультиплексор
      - text: — MUX выбирает один из N входов на общий выход по адресу; DEMUX — наоборот, направляет вход на один из N выходов.
    - listitem [ref=e264]:
      - strong [ref=e265]: ЦАП / АЦП
      - text: "— преобразование цифра↔аналог: ЦАП цифровой код → напряжение, АЦП напряжение → цифровой код (дискретизация + квантование)."
