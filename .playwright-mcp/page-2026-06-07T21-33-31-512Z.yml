  - heading "45. Метрики параллельных вычислений, закон Амдала (7 метрик с формулами и закон Амдала с выводами)." [level=2] [ref=e1495]
  - paragraph [ref=e1496]:
    - emphasis [ref=e1497]: Нужны
    - emphasis [ref=e1498]: 7 метрик с формулами
    - emphasis [ref=e1499]: и
    - emphasis [ref=e1500]: закон Амдала с выводами
    - emphasis [ref=e1501]: .
  - paragraph [ref=e1502]:
    - text: "Обозначения:"
    - code [ref=e1503]: T(1)=O(1)
    - text: — время/объём операций на 1 процессоре;
    - code [ref=e1504]: T(n)
    - text: ","
    - code [ref=e1505]: O(n)
    - text: — время и объём операций на n процессорах.
  - list [ref=e1506]:
    - listitem [ref=e1507]:
      - strong [ref=e1508]: Степень параллелизма
      - code [ref=e1509]: P(t)
      - text: — число процессоров, одновременно выполняющих программу в момент t (даёт
      - strong [ref=e1510]: профиль параллелизма
      - text: ).
    - listitem [ref=e1511]:
      - strong [ref=e1512]: Индекс параллелизма
      - code [ref=e1513]: PI(n) = O(n) / T(n)
      - text: — средняя скорость (операций в единицу времени).
    - listitem [ref=e1514]:
      - strong [ref=e1515]: Ускорение
      - code [ref=e1516]: S(n) = T(1) / T(n)
      - text: — во сколько раз быстрее. Идеал
      - code [ref=e1517]: S = n
      - text: .
    - listitem [ref=e1518]:
      - strong [ref=e1519]: Эффективность
      - code [ref=e1520]: E(n) = S(n)/n = T(1) / (n·T(n))
      - text: — доля ускорения на один процессор (0…1).
    - listitem [ref=e1521]:
      - strong [ref=e1522]: Утилизация
      - code [ref=e1523]: U(n) = O(n) / (n·T(n))
      - text: (= R·E).
    - listitem [ref=e1524]:
      - strong [ref=e1525]: Избыточность
      - code [ref=e1526]: R(n) = O(n) / O(1)
      - text: — во сколько раз больше операций.
    - listitem [ref=e1527]:
      - strong [ref=e1528]: Сжатие
      - code [ref=e1529]: C(n) = O(1) / O(n)
      - text: (величина, обратная избыточности).
    - listitem [ref=e1530]:
      - strong [ref=e1531]: Качество
      - code [ref=e1532]: Q(n) = T³(1) / (n·T²(n)·O(n)) = S·E·C
      - text: — обобщённый показатель.
  - paragraph [ref=e1533]:
    - strong [ref=e1534]: "Пример из лекции:"
    - code [ref=e1535]: n=8
    - text: ","
    - code [ref=e1536]: T(1)=O(1)=O(8)=93
    - text: ","
    - code [ref=e1537]: T(8)=25
    - text: →
    - code [ref=e1538]: S=PI=3.72
    - text: ;
    - code [ref=e1539]: E=U=0.465
    - text: ;
    - code [ref=e1540]: R=C=1
    - text: ;
    - code [ref=e1541]: Q=1.73
    - text: .
  - list [ref=e1542]:
    - listitem [ref=e1543]:
      - strong [ref=e1544]: Закон Амдала.
      - text: Если доля
      - strong [ref=e1545]: последовательного
      - text: кода
      - code [ref=e1546]: f
      - text: "(не распараллеливается), то максимальное ускорение:"
  - code [ref=e1548]: S(n) = 1 / ( f + (1 − f)/n ) ↓ при n → ∞ S_max = 1 / f
  - list [ref=e1549]:
    - listitem [ref=e1550]:
      - strong [ref=e1551]: "Вывод:"
      - text: ускорение ограничено последовательной частью. Если
      - code [ref=e1552]: f = 10%
      - text: ", то даже на ∞ процессорах"
      - code [ref=e1553]: S_max = 10
      - text: .
      - strong [ref=e1554]: "Главный смысл: распараллеливать бесполезно, пока велика последовательная доля"
      - text: — наращивание процессоров упирается в потолок
      - code [ref=e1555]: 1/f
      - text: .
