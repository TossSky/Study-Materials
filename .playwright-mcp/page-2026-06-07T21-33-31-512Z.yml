  - heading "21. Порядок замещения строк в кэш-памяти, согласование ОП и кэш-памяти, дисковая кэш-память (перечень алгоритмов выбора замещаемой строки, краткое описание алгоритмов согласование содержимого ОП и кэш-памяти для однопроцессорных ЭВМ, характеристики дисковой кэш-памяти)." [level=2] [ref=e956]
  - list [ref=e957]:
    - listitem [ref=e958]:
      - strong [ref=e959]: "Алгоритмы замещения строки:"
      - list [ref=e960]:
        - listitem [ref=e961]:
          - strong [ref=e962]: LRU
          - text: (Least Recently Used) — вытесняем дольше всех неиспользуемую.
        - listitem [ref=e963]:
          - strong [ref=e964]: LFU
          - text: (Least Frequently Used) — реже всех используемую.
        - listitem [ref=e965]:
          - strong [ref=e966]: FIFO
          - text: — первую вошедшую.
        - listitem [ref=e967]:
          - strong [ref=e968]: Random
          - text: — случайную.
        - listitem [ref=e969]:
          - strong [ref=e970]: ARC
          - text: (Adaptive Replacement Cache) — комбинирует LRU+LFU (патент IBM).
    - listitem [ref=e971]:
      - strong [ref=e972]: "Алгоритмы согласования ОП↔кэш (однопроцессорные ЭВМ, по лекции):"
      - list [ref=e973]:
        - listitem [ref=e974]:
          - strong [ref=e975]: Сквозная запись (write-through)
          - text: — сразу в кэш и в ОП. Просто, но медленно.
        - listitem [ref=e976]:
          - strong [ref=e977]: Простой свопинг
          - text: — обратная запись блока в ОП при его вытеснении.
        - listitem [ref=e978]:
          - strong [ref=e979]: Свопинг с флагами
          - text: — в ОП переписывается только при установленном бите модификации (dirty). Быстрее.
        - listitem [ref=e980]:
          - strong [ref=e981]: Регистровый свопинг с флагами
          - text: — то же с буферным регистром для ускорения.
    - listitem [ref=e982]:
      - strong [ref=e983]: Дисковый кэш
      - text: — буфер в ОЗУ для часто запрашиваемых секторов диска; ускоряет дисковый ввод-вывод.
  - heading "22. Организация защиты памяти (назначение средств защиты памяти, краткое описание методов защиты памяти)." [level=2] [ref=e984]
  - list [ref=e985]:
    - listitem [ref=e986]:
      - strong [ref=e987]: "Назначение:"
      - text: не дать программе обратиться к чужой/системной памяти (изоляция, надёжность, безопасность).
    - listitem [ref=e988]:
      - strong [ref=e989]: "Методы (4, по лекции):"
      - list [ref=e990]:
        - listitem [ref=e991]:
          - strong [ref=e992]: Защита отдельных ячеек
          - text: — «разряд защиты» в ячейке запрещает запись в неё (для отладки программ).
        - listitem [ref=e993]:
          - strong [ref=e994]: Граничные регистры
          - text: — задают нижнюю и верхнюю границу области процесса.
        - listitem [ref=e995]:
          - strong [ref=e996]: Ключи защиты
          - text: — каждому блоку памяти и программе присвоен ключ; доступ при совпадении.
        - listitem [ref=e997]:
          - strong [ref=e998]: Кольца защиты (уровни привилегий 0–3)
          - text: — режим ядра vs пользователя; для страниц — биты доступа R/W/X.
  - heading "23. Концепция виртуальной памяти (схемы страничного, сегментного и сегментно-страничного распределения виртуальной памяти, страничная таблица, TLB)." [level=2] [ref=e999]
  - paragraph [ref=e1000]:
    - emphasis [ref=e1001]: Нужны
    - emphasis [ref=e1002]: схемы страничного, сегментного, сегментно-страничного
    - emphasis [ref=e1003]: распределения.
  - list [ref=e1004]:
    - listitem [ref=e1005]:
      - strong [ref=e1006]: Виртуальная память
      - text: "— механизм: программа работает в логическом (виртуальном) адресном пространстве больше физического; трансляция вирт.→физ. адреса аппаратно (MMU), редко используемое выгружается на диск (swap)."
    - listitem [ref=e1007]:
      - strong [ref=e1008]: Страничное
      - text: — память делится на страницы фиксированного размера. Вирт. адрес = № страницы + смещение → через
      - strong [ref=e1009]: страничную таблицу
      - text: в физ. адрес.
    - listitem [ref=e1010]:
      - strong [ref=e1011]: Сегментное
      - text: "— деление на сегменты переменной длины (по смыслу: код, данные, стек). Адрес = № сегмента + смещение."
    - listitem [ref=e1012]:
      - strong [ref=e1013]: Сегментно-страничное
      - text: "— комбинация: сегменты делятся на страницы (x86). Гибкость сегментов + удобство страниц."
    - listitem [ref=e1014]:
      - strong [ref=e1015]: Страничная таблица
      - text: "— поля записи:"
      - strong [ref=e1016]: V
      - text: (присутствие страницы в ОП; V=0 →
      - strong [ref=e1017]: страничный сбой / page fault
      - text: ),
      - strong [ref=e1018]: R
      - text: (использование — для замещения),
      - strong [ref=e1019]: M
      - text: (модификация — для свопинга с флагами),
      - strong [ref=e1020]: A
      - text: "(права доступа: чтение/запись). Сокращение длины таблицы: многоуровневые таблицы, инвертированная таблица."
    - listitem [ref=e1021]:
      - text: "Характеристики:"
      - strong [ref=e1022]: страничная
      - text: → внутренняя фрагментация;
      - strong [ref=e1023]: сегментная
      - text: → внешняя фрагментация, но удобен разделяемый доступ к общим сегментам.
    - listitem [ref=e1024]:
      - strong [ref=e1025]: TLB (Translation Lookaside Buffer)
      - text: — кэш недавних трансляций адресов (8–4096 записей, полностью/множественно-ассоциативный), ускоряет MMU (без него — лишнее обращение к таблице на каждый доступ).
  - code [ref=e1027]: вирт. адрес ─► [TLB?] ─есть─► физ. адрес └─нет─► страничная таблица ─► физ. адрес (+ занести в TLB)
  - heading "24. Организация НЖМД, SSD, оптической памяти, магнитных лент (характеристики дисковой памяти, принципы организации SSD-памяти, принципы организации оптической памяти, назначение магнитных лент)." [level=2] [ref=e1028]
  - list [ref=e1029]:
    - listitem [ref=e1030]:
      - strong [ref=e1031]: НЖМД (HDD)
      - text: "— магнитные пластины, головки. Геометрия:"
      - strong [ref=e1032]: дорожки, секторы, цилиндры
      - text: ". Характеристики: ёмкость, скорость вращения (об/мин), время доступа (seek), интерфейс. Дёшево за ГБ, но механика — медленно."
    - listitem [ref=e1033]:
      - strong [ref=e1034]: SSD
      - text: "— флеш-память (NAND), нет механики. Быстрее, тише, надёжнее к ударам. Минус: ограниченный ресурс перезаписи ячеек →"
      - strong [ref=e1035]: контроллер с wear-leveling
      - text: (равномерный износ), TRIM. Чем больше параллельных каналов NAND, тем быстрее.
    - listitem [ref=e1036]:
      - strong [ref=e1037]: Оптика (CD/DVD/Blu-ray)
      - text: — данные = питы/лэнды на дорожке, читаются лазером. Спиральная дорожка от центра.
    - listitem [ref=e1038]:
      - strong [ref=e1039]: Магнитные ленты
      - text: — последовательный доступ, огромная ёмкость, дёшево →
      - strong [ref=e1040]: архивное резервное копирование
      - text: .
  - heading "25. Избыточные дисковые подсистемы (назначение, способы повышения производительности ЗУ, способы повышения надёжности ЗУ, схемы уровней RAID-массивов)." [level=2] [ref=e1041]
  - paragraph [ref=e1042]:
    - emphasis [ref=e1043]: Нужны
    - emphasis [ref=e1044]: схемы уровней RAID
    - emphasis [ref=e1045]: .
  - list [ref=e1046]:
    - listitem [ref=e1047]:
      - strong [ref=e1048]: Назначение RAID
      - text: — объединить диски для роста производительности и/или надёжности.
    - listitem [ref=e1049]:
      - strong [ref=e1050]: Производительность
      - text: —
      - strong [ref=e1051]: расслоение (stripe)
      - text: ": данные параллельно на несколько дисков."
    - listitem [ref=e1052]:
      - strong [ref=e1053]: Надёжность
      - text: —
      - strong [ref=e1054]: зеркалирование (mirror)
      - text: и
      - strong [ref=e1055]: контроль чётности (parity)
      - text: .
    - listitem [ref=e1056]:
      - strong [ref=e1057]: "Уровни:"
      - list [ref=e1058]:
        - listitem [ref=e1059]:
          - strong [ref=e1060]: RAID 0
          - text: — striping, без избыточности. Быстро, но смерть 1 диска = потеря всего.
        - listitem [ref=e1061]:
          - strong [ref=e1062]: RAID 1
          - text: — mirroring (зеркало). Надёжно, но 50% ёмкости.
        - listitem [ref=e1063]:
          - strong [ref=e1064]: RAID 5
          - text: — striping + чётность по всем дискам. Переживает отказ 1 диска. Баланс.
        - listitem [ref=e1065]:
          - strong [ref=e1066]: RAID 6
          - text: — две чётности, переживает 2 диска.
        - listitem [ref=e1067]:
          - strong [ref=e1068]: RAID 10 (1+0)
          - text: — зеркало + страйп. Скорость и надёжность, дорого.
  - img [ref=e1070]:
    - generic [ref=e1076]: RAID
    - generic [ref=e1078]: RAID 0страйп (скорость)
    - generic [ref=e1080]: RAID 1зеркало
    - generic [ref=e1082]: RAID 5страйп + чётность
    - generic [ref=e1084]: RAID 62 чётности
    - generic [ref=e1086]: RAID 10зеркало + страйп
  - heading "26. Основы построения компьютерных шин (типы шин, иерархия шин, ША, ШД, ШУ, состав линий в ШУ)." [level=2] [ref=e1087]
  - list [ref=e1088]:
    - listitem [ref=e1089]:
      - strong [ref=e1090]: Шина (bus)
      - text: — набор линий для обмена между функциональными блоками (ЦП↔память, ЦП↔ВВ, память↔ВВ); «двунаправленный универсальный коммутатор».
    - listitem [ref=e1091]:
      - strong [ref=e1092]: "Функциональные типы:"
      - list [ref=e1093]:
        - listitem [ref=e1094]:
          - strong [ref=e1095]: ША (адреса)
          - text: —
          - strong [ref=e1096]: однонаправленная
          - text: ", разрядность задаёт объём адресуемой памяти ("
          - code [ref=e1097]: N=2ⁱ
          - text: );
        - listitem [ref=e1098]:
          - strong [ref=e1099]: ШД (данных)
          - text: —
          - strong [ref=e1100]: двунаправленная
          - text: ", последовательная или параллельная, ширина = слово;"
        - listitem [ref=e1101]:
          - strong [ref=e1102]: ШУ (управления)
          - text: — линии управляющей информации и состояния.
    - listitem [ref=e1103]:
      - strong [ref=e1104]: "Иерархия шин:"
      - text: системная (ЦП–память) → шина расширения → шина ввода/вывода (через адаптеры); архитектура с «пристройкой» (mezzanine). Чем ближе к ЦП, тем быстрее.
    - listitem [ref=e1105]:
      - strong [ref=e1106]: "Состав линий ШУ (7 групп):"
      - text: сигналы управления транзакциями (тип операции, кол-во передаваемых байт, тип адреса, тип протокола), информация состояния (статуса), арбитраж, прерывания, последовательные локальные сети, позиционный код, тактирование и синхронизация.
  - heading "27. Организация арбитража шины (схемы приоритетов, схемы арбитража, способы организации опроса)." [level=2] [ref=e1107]
  - paragraph [ref=e1108]:
    - emphasis [ref=e1109]: Нужны
    - emphasis [ref=e1110]: схемы приоритетов и арбитража
    - emphasis [ref=e1111]: .
  - list [ref=e1112]:
    - listitem [ref=e1113]:
      - strong [ref=e1114]: Арбитраж
      - text: — процедура допуска к управлению шиной только одного из ведущих (master).
      - strong [ref=e1115]: Арбитр
      - text: распределяет доступ (обычно на северном мосту).
    - listitem [ref=e1116]:
      - strong [ref=e1117]: "Схемы приоритетов:"
      - strong [ref=e1118]: статические
      - text: (фиксированные) и
      - strong [ref=e1119]: динамические
      - text: ". Динамические алгоритмы: простая циклическая смена, циклическая с учётом последнего запроса, по случайному закону, равных приоритетов, LRU (наиболее давнее использование)."
    - listitem [ref=e1120]:
      - strong [ref=e1121]: "Схемы арбитража:"
      - list [ref=e1122]:
        - listitem [ref=e1123]:
          - strong [ref=e1124]: Централизованная
          - text: "(один арбитр):"
          - strong [ref=e1125]: параллельная
          - text: — у каждого ведущего своя линия запроса/предоставления;
          - strong [ref=e1126]: последовательная (цепочечная, daisy chain)
          - text: — сигнал разрешения идёт по цепочке, ближний к арбитру = высший приоритет.
        - listitem [ref=e1127]:
          - strong [ref=e1128]: Децентрализованная (распределённая)
          - text: — единого арбитра нет, у каждого ведущего свой контроллер шины.
    - listitem [ref=e1129]:
      - strong [ref=e1130]: "Способы организации опроса:"
      - strong [ref=e1131]: централизованный
      - text: (контроллер по очереди опрашивает ведущих, выставляя их адрес) и
      - strong [ref=e1132]: децентрализованный
      - text: (каждый ведущий сам формирует адрес следующего).
  - heading "28. Типы протоколов шин, синхронная и асинхронная передача данных (управление процессом передачи данных, схемы и принципы работы протоколов шин)." [level=2] [ref=e1133]
  - paragraph [ref=e1134]:
    - emphasis [ref=e1135]: Нужны
    - emphasis [ref=e1136]: схемы протоколов
    - emphasis [ref=e1137]: .
  - list [ref=e1138]:
    - listitem [ref=e1139]:
      - strong [ref=e1140]: Синхронная передача
      - text: — общий тактовый сигнал, события привязаны к фронтам такта. Быстро и просто, но все устройства на одной частоте, длина ограничена.
    - listitem [ref=e1141]:
      - strong [ref=e1142]: Асинхронная передача
      - text: — без общего такта, по
      - strong [ref=e1143]: квитированию (handshake)
      - text: ": запрос → готовность (request/acknowledge). Гибко (разные скорости устройств), но медленнее и сложнее."
  - code [ref=e1145]: "Синхронная: CLK ‾|_|‾|_|‾|_ данные привязаны к фронтам Асинхронная: REQ ──► устройство ──► ACK (рукопожатие)"
  - heading "29. Методы повышения эффективности шин, надёжность и отказоустойчивость шины (способы повышения эффективности шин, способы повышения надёжности шин)." [level=2] [ref=e1146]
  - list [ref=e1147]:
    - listitem [ref=e1148]:
      - strong [ref=e1149]: "Повышение эффективности (полосы):"
      - strong [ref=e1150]: отказ от мультиплексирования
      - text: ША/ШД, увеличение ширины ШД и тактовой частоты,
      - strong [ref=e1151]: блочные/пакетные транзакции (burst)
      - text: ","
      - strong [ref=e1152]: конвейеризация
      - text: и
      - strong [ref=e1153]: расщепление транзакций (split)
      - text: ", арбитраж с перекрытием и с удержанием шины, переход на"
      - strong [ref=e1154]: последовательные дифференциальные
      - text: линии (PCIe вместо PCI).
    - listitem [ref=e1155]:
      - strong [ref=e1156]: "Повышение надёжности:"
      - text: контроль чётности/ECC на шине, дублирование/резервные линии, экранирование, протоколы повтора при ошибке.
  - 'heading "30. Внутренние интерфейсы ЭВМ: EISA, LPC, PCI, PCI-E, AGP (основные характеристики)." [level=2] [ref=e1157]'
  - list [ref=e1158]:
    - listitem [ref=e1159]:
      - strong [ref=e1160]: EISA
      - text: — расширение ISA, 32-бит, для серверов (устаревший).
    - listitem [ref=e1161]:
      - strong [ref=e1162]: LPC (Low Pin Count)
      - text: — для низкоскоростной периферии (контроллеры клавиатуры, BIOS), заменил ISA.
    - listitem [ref=e1163]:
      - strong [ref=e1164]: PCI
      - text: — параллельная, 32/64-бит, 33/66 МГц, общая шина с арбитражем (устаревает).
    - listitem [ref=e1165]:
      - strong [ref=e1166]: PCI-E (PCI Express)
      - text: —
      - strong [ref=e1167]: последовательная
      - text: ", по «линиям» (lanes ×1…×16), независимые дифференциальные пары, point-to-point. Современный стандарт."
    - listitem [ref=e1168]:
      - strong [ref=e1169]: AGP
      - text: — выделенный интерфейс для видеокарт (между PCI и PCI-E исторически), вытеснен PCI-E.
  - 'heading "31. Внешние интерфейсы для ЗУ: IDE, SATA, SCSI, SAS (основные характеристики)." [level=2] [ref=e1170]'
  - list [ref=e1171]:
    - listitem [ref=e1172]:
      - strong [ref=e1173]: IDE/PATA
      - text: — параллельный, для HDD/CD, шлейф 40/80 жил (устарел).
    - listitem [ref=e1174]:
      - strong [ref=e1175]: SATA
      - text: —
      - strong [ref=e1176]: последовательный
      - text: наследник IDE, точка-точка, hot-swap, скорости до 6 Гбит/с. Массовый для дисков.
    - listitem [ref=e1177]:
      - strong [ref=e1178]: SCSI
      - text: — параллельный, шина для нескольких устройств, для серверов (надёжность, очередь команд).
    - listitem [ref=e1179]:
      - strong [ref=e1180]: SAS (Serial Attached SCSI)
      - text: — последовательный наследник SCSI, совместим с SATA-дисками, для серверов/СХД.
  - 'heading "32. Внешние интерфейсы для ввода/вывода: RS-232C, LPT (EPP, ECP), USB, SPI, I²C (основные характеристики)." [level=2] [ref=e1181]'
  - list [ref=e1182]:
    - listitem [ref=e1183]:
      - strong [ref=e1184]: RS-232C
      - text: — последовательный COM-порт, низкая скорость, для модемов/терминалов (устарел).
    - listitem [ref=e1185]:
      - strong [ref=e1186]: LPT
      - text: — параллельный порт для принтеров; режимы
      - strong [ref=e1187]: EPP
      - text: (двунаправленный) и
      - strong [ref=e1188]: ECP
      - text: (с DMA и сжатием).
    - listitem [ref=e1189]:
      - strong [ref=e1190]: USB
      - text: — последовательный, универсальный, hot-plug, питание, до USB4 (40 Гбит/с), топология «дерево» с хабами.
    - listitem [ref=e1191]:
      - strong [ref=e1192]: SPI
      - text: — синхронный, 4 линии (MOSI/MISO/SCLK/CS), быстрый, для микросхем на плате, full-duplex.
    - listitem [ref=e1193]:
      - strong [ref=e1194]: I²C
      - text: — синхронный,
      - strong [ref=e1195]: 2 линии
      - text: (SDA/SCL), адресация устройств, медленнее SPI, для датчиков.
  - heading "33. Система ввода-вывода, организация адресного пространства (способы подключения СВВ к ЦП и ОП, достоинства и недостатки совмещённого и выделенного адресного пространства)." [level=2] [ref=e1196]
  - list [ref=e1197]:
    - listitem [ref=e1198]:
      - strong [ref=e1199]: "Способы подключения СВВ:"
      - list [ref=e1200]:
        - listitem [ref=e1201]:
          - strong [ref=e1202]: Совмещённое адресное пространство (memory-mapped I/O)
          - text: "— порты ВВ в общем адресном пространстве с памятью. Плюс: любые команды работы с памятью годятся для ВВ. Минус: «съедает» адреса памяти."
        - listitem [ref=e1203]:
          - strong [ref=e1204]:
            - text: Выделенное адресное пространство (port-mapped, x86
            - code [ref=e1205]: IN
            - text: /
            - code [ref=e1206]: OUT
            - text: )
          - text: "— отдельное пространство портов. Плюс: не отнимает память, отдельные команды. Минус: нужны спец. команды, сложнее."
  - heading "34. Модуль ввода/вывода, абстрактное периферийное устройство (структура и функции МВВ, схема ПУ)." [level=2] [ref=e1207]
  - paragraph [ref=e1208]:
    - emphasis [ref=e1209]: Нужна
    - emphasis [ref=e1210]: схема ПУ
    - emphasis [ref=e1211]: .
  - list [ref=e1212]:
    - listitem [ref=e1213]:
      - strong [ref=e1214]: МВВ (модуль ввода-вывода)
      - text: — посредник между системной шиной и периферией.
      - strong [ref=e1215]: "5 функций (по лекции):"
      - text: локализация данных (дешифрация адреса ВУ/регистра, адресация данных на ПУ), управление и синхронизация, обмен информацией, буферизация (согласование скоростей ЦП и ПУ), обнаружение ошибок.
    - listitem [ref=e1216]:
      - strong [ref=e1217]: "Структура МВВ:"
      - text: регистры данных, регистры состояния/управления, дешифратор адреса, логика управления, интерфейс с ПУ.
  - img [ref=e1219]:
