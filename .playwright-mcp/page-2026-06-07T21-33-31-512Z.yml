      - strong [ref=e864]: триггер на 4–6 транзисторах
      - text: . Хранит бит, пока есть питание, регенерация не нужна. Быстрый, но дорогой и малой плотности → используется для
      - strong [ref=e865]: кэша
      - text: .
    - listitem [ref=e866]:
      - strong [ref=e867]: "Виды SRAM:"
      - text: асинхронные, синхронные (SSRAM), конвейерные (PB SRAM).
  - heading "18. Динамические ОЗУ (виды динамических ОЗУ, запоминающий элемент, методы ускорения микросхемы, способы регенерации данных)." [level=2] [ref=e868]
  - paragraph [ref=e869]:
