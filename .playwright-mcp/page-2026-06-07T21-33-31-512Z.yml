      - strong [ref=e451]: видимых и доступных программисту
      - text: ". Характеристики АСК: вид/формат данных, место хранения данных, методы доступа, операции над данными, число операндов, способ определения адреса следующей команды, способ кодирования."
    - listitem [ref=e452]: "Хронология АСК: аккумуляторная (1950) → стековая (1963–66) → регистровая (1964) → с выделенным доступом к памяти → CISC (1977–80) → RISC (1987) → VLIW (конец 1990-х) → ROSC (безоперандная, 2001)."
    - listitem [ref=e453]:
      - strong [ref=e454]: "Архитектуры (по способу хранения операндов):"
      - list [ref=e455]:
        - listitem [ref=e456]:
          - strong [ref=e457]: Стековая
          - text: — операнды берутся с вершины стека, безадресные команды. Просто, но медленно (всё через стек).
        - listitem [ref=e458]:
          - strong [ref=e459]: Аккумуляторная
          - text: — один операнд в аккумуляторе, второй в памяти; результат в аккумулятор. Короткие команды, но много обращений к памяти.
        - listitem [ref=e460]:
          - strong [ref=e461]: Регистровая
          - text: "— операнды в регистрах общего назначения (РОН). Быстро, основа RISC. Подвиды: регистр-регистр и регистр-память."
        - listitem [ref=e462]:
          - strong [ref=e463]: С выделенным доступом к памяти (load/store)
          - text: — с памятью работают только команды
          - code [ref=e464]: load
          - text: /
          - code [ref=e465]: store
          - text: ", арифметика только над регистрами. Чистая RISC-модель."
  - heading "9. Основы построения CISC-, RISC- и VLIW-архитектур системы команд (принципы построения основных архитектур, схема процессора, сравнение функций устройства управления в CISC и RISC процессорах)." [level=2] [ref=e466]
  - paragraph [ref=e467]:
    - emphasis [ref=e468]: Нужна
    - emphasis [ref=e469]: схема процессора
    - emphasis [ref=e470]: и
    - emphasis [ref=e471]: сравнение УУ в CISC и RISC
    - emphasis [ref=e472]: .
  - list [ref=e473]:
    - listitem [ref=e474]:
      - strong [ref=e475]: CISC (Complex Instruction Set)
      - text: — много сложных команд разной длины, развитая адресация, команда может делать несколько действий. УУ
      - strong [ref=e476]: микропрограммное
      - text: "(сложное, медленное). Пример: x86."
    - listitem [ref=e477]:
      - strong [ref=e478]: RISC (Reduced Instruction Set)
      - text: — мало простых команд фиксированной длины, выполнение за 1 такт, много регистров, load/store. УУ
      - strong [ref=e479]: аппаратное (схемное)
      - text: "— быстрое. Конвейеризация. Пример: ARM, MIPS."
    - listitem [ref=e480]:
      - strong [ref=e481]: VLIW (Very Long Instruction Word)
      - text: — в одной длинной команде несколько операций, распараллеливание задаёт
      - strong [ref=e482]: компилятор
      - text: "(не процессор). Простое железо, сложный компилятор. Пример: Itanium, Эльбрус."
