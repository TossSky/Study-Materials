  - heading "12. Технологии динамического исполнения (краткое описание средств динамического исполнения, технология многократного декодирование команд)." [level=2] [ref=e677]
  - list [ref=e678]:
    - listitem [ref=e679]:
      - strong [ref=e680]: Динамическое исполнение
      - text: "— процессор сам меняет порядок и условия выполнения команд для загрузки конвейера. Средства:"
      - list [ref=e681]:
        - listitem [ref=e682]:
          - strong [ref=e683]: Предсказание переходов (branch prediction)
          - text: — угадывает направление ветвления, заранее грузит команды.
        - listitem [ref=e684]:
          - strong [ref=e685]: Спекулятивное (упреждающее) исполнение
          - text: — выполняет команды до того, как известно, нужны ли они; результат отбрасывается, если предсказание неверно.
        - listitem [ref=e686]:
          - strong [ref=e687]: Внеочередное исполнение (out-of-order)
          - text: — команды исполняются по готовности данных, а не по порядку.
        - listitem [ref=e688]:
          - strong [ref=e689]: Переименование регистров
          - text: — устраняет ложные зависимости по регистрам.
    - listitem [ref=e690]:
      - strong [ref=e691]: Многократное (множественное) декодирование команд
      - text: — несколько декодеров параллельно разбирают команды, преобразуя сложные CISC-команды в простые микрооперации (μops) для конвейера.
  - heading "13. Основы микроархитектур процессоров (понятие микроархитектуры, технологические нормы, производительность, эксплуатационные характеристики МП, физические параметры МП, общая структура МП)." [level=2] [ref=e692]
  - list [ref=e693]:
    - listitem [ref=e694]:
      - strong [ref=e695]: Микроархитектура
      - text: "(по лекции) — аппаратная организация и логическая структура микропроцессора: регистры, управляющие схемы, АЛУ, запоминающие устройства, информационные магистрали. Противопоставляется"
      - strong [ref=e696]: макроархитектуре
      - text: = система команд, типы данных, режимы адресации, принципы работы МП.
    - listitem [ref=e697]:
      - strong [ref=e698]: Технологический процесс (техпроцесс/нормы)
      - text: — размер элементов на кристалле (нм). Чем меньше, тем больше транзисторов и ниже энергопотребление.
    - listitem [ref=e699]:
      - strong [ref=e700]: Степень интеграции
      - text: — число элементов на кристалле.
    - listitem [ref=e701]:
      - strong [ref=e702]: "Производительность:"
      - text: тактовая частота ядра, частота системной шины, объём кэша (L1/L2/L3).
    - listitem [ref=e703]:
      - strong [ref=e704]: "Эксплуатационные характеристики:"
      - text: напряжение питания, потребляемая мощность, тепловыделение (TDP), макс. температура.
    - listitem [ref=e705]:
      - strong [ref=e706]: "Физические параметры:"
      - text: тип и размер корпуса, размер кристалла, число и форма выводов.
    - listitem [ref=e707]:
      - strong [ref=e708]: "Общая структура МП:"
      - text: ядро (АЛУ, регистры, кэш L1/L2) + контроллер памяти + шина/интерконнект между ядрами + периферийные блоки (графика, контроллеры ВВ).
