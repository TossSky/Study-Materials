  - heading "20. Организация кэш-памяти, способы отображения основной памяти на кэш-память (назначение кэш-памяти, уровни кэш-памяти, факторы эффективности кэш-памяти, схемы вариантов отображения ОП на кэш-память и сравнение)." [level=2] [ref=e921]
  - paragraph [ref=e922]:
    - emphasis [ref=e923]: Нужны
    - emphasis [ref=e924]: схемы вариантов отображения
    - emphasis [ref=e925]: .
  - list [ref=e926]:
    - listitem [ref=e927]:
      - strong [ref=e928]: Назначение кэша
      - text: "— быстрая буферная память между ЦП и ОП, хранит часто используемые данные (принцип локальности: временна́я и пространственная)."
    - listitem [ref=e929]:
      - strong [ref=e930]: "Уровни:"
      - text: L1 (в ядре, самый быстрый, раздельный для команд/данных), L2, L3 (общий для ядер).
    - listitem [ref=e931]:
      - strong [ref=e932]: "Факторы эффективности:"
      - text: объём, скорость, процент попаданий (hit rate), стратегия отображения и замещения.
    - listitem [ref=e933]:
      - strong [ref=e934]: "Способы отображения ОП на кэш:"
      - list [ref=e935]:
        - listitem [ref=e936]:
          - strong [ref=e937]: Прямое (direct-mapped)
          - text: — блок ОП → строго в одну строку кэша (
          - code [ref=e938]: № = адрес mod N
          - text: ). Просто и быстро, но частые вытеснения (конфликты).
        - listitem [ref=e939]:
          - strong [ref=e940]: Полностью ассоциативное
          - text: — блок → в любую строку. Гибко, нет конфликтов, но дорогой поиск (сравнение всех тегов).
        - listitem [ref=e941]:
          - strong [ref=e942]: Множественно-ассоциативное (set-associative)
          - text: — кэш делится на наборы по K строк; блок → в любую строку своего набора.
          - strong [ref=e943]: Компромисс
          - text: ", применяется на практике (2-, 4-, 8-way)."
