  - heading "37. Каналы и процессоры ввода/вывода (принципы работы, схема, управляющие слова канала, БУВУ)." [level=2] [ref=e1303]
  - list [ref=e1304]:
    - listitem [ref=e1305]:
      - strong [ref=e1306]: Назначение
      - text: "— разгрузить ЦП: канал = специализированный процессор ВВ, выполняет"
      - strong [ref=e1307]: канальную программу
      - text: (управляющие слова канала, УСК).
    - listitem [ref=e1308]:
      - strong [ref=e1309]: "Режимы работы канала (по лекции):"
      - list [ref=e1310]:
        - listitem [ref=e1311]:
          - strong [ref=e1312]: Мультиплексный
          - text: — несколько ВУ разделяют канал во времени (много медленных устройств, короткими сеансами; байт-/блок-мультиплексный).
        - listitem [ref=e1313]:
          - strong [ref=e1314]: Монопольный
          - text: — одно (быстрое) ВУ монополизирует канал до завершения канальной программы (диски).
    - listitem [ref=e1315]:
      - strong [ref=e1316]: БУВУ (блок управления внешними устройствами)
      - text: — управляет конкретным ПУ под командой канала.
  - heading "38. Организации системы прерываний. (способы организации системы прерываний, виды прерываний, аппаратные и программные средства системы прерываний)." [level=2] [ref=e1317]
  - list [ref=e1318]:
    - listitem [ref=e1319]:
      - strong [ref=e1320]: Прерывание
      - text: — приостановка текущей программы для реакции на событие, с переходом на обработчик и возвратом.
    - listitem [ref=e1321]:
      - strong [ref=e1322]: "Виды прерываний:"
      - list [ref=e1323]:
        - listitem [ref=e1324]:
          - strong [ref=e1325]: Аппаратные внешние
          - text: — от устройств (IRQ).
        - listitem [ref=e1326]:
          - strong [ref=e1327]: Внутренние (исключения)
          - text: "— ошибки ЦП. Три типа:"
          - strong [ref=e1328]: отказ (fault)
          - text: — обнаруживается до инструкции, после обработки возврат на
          - strong [ref=e1329]: ту же
          - text: "инструкцию (отказ страницы #PF, деление на 0 #DE);"
          - strong [ref=e1330]: ловушка (trap)
          - text: — после инструкции, возврат на
          - strong [ref=e1331]: следующую
          - text: "(#BP, #OF);"
          - strong [ref=e1332]: аварийное завершение (abort)
          - text: — нельзя точно установить инструкцию (#DF двойной отказ).
        - listitem [ref=e1333]:
          - strong [ref=e1334]: Программные
          - text: — команда
          - code [ref=e1335]: INT n
          - text: (системные вызовы).
    - listitem [ref=e1336]:
      - text: Внешние делятся на
      - strong [ref=e1337]: немаскируемые (NMI)
      - text: и
      - strong [ref=e1338]: маскируемые (INTR)
      - text: (маскируются флагом IF).
    - listitem [ref=e1339]:
      - strong [ref=e1340]: "Способы организации:"
