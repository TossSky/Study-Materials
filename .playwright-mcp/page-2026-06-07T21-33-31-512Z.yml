  - heading "17. Основная память, статические ОЗУ (структура ОП, характеристики, блочная организация ОП, запоминающий элемент в статическом ОЗУ, виды статических ОЗУ)." [level=2] [ref=e851]
  - paragraph [ref=e852]:
