  - heading "10. Форматы команд и виды адресации (классификация команд процессора, примеры форматов команд x86, RISC-16, AVR)." [level=2] [ref=e526]
  - list [ref=e527]:
    - listitem [ref=e528]:
      - strong [ref=e529]: "Классификация команд:"
      - text: пересылки (load/store, mov), арифметико-логические, передачи управления (переходы, вызовы), ввода-вывода, системные.
    - listitem [ref=e530]:
      - strong [ref=e531]: Формат команды
      - text: "= код операции (КОП) + адресная часть. Число адресов: 0 (стек), 1 (аккумулятор), 2–3 (регистровые). Примеры:"
      - strong [ref=e532]: x86
      - text: — переменная длина;
      - strong [ref=e533]: RISC-16 / AVR
      - text: — фиксированная.
    - listitem [ref=e534]:
      - strong [ref=e535]: "Виды адресации:"
      - list [ref=e536]:
        - listitem [ref=e537]:
          - strong [ref=e538]: Прямая
          - text: — в команде сам адрес операнда.
        - listitem [ref=e539]:
          - strong [ref=e540]: Непосредственная
          - text: — операнд прямо в команде (константа).
        - listitem [ref=e541]:
          - strong [ref=e542]: Регистровая
          - text: — операнд в регистре.
        - listitem [ref=e543]:
          - strong [ref=e544]: Косвенная
          - text: — в команде адрес ячейки/регистра, где лежит адрес операнда.
        - listitem [ref=e545]:
          - strong [ref=e546]: Со смещением (базовая/индексная)
          - text: — адрес = базовый регистр + смещение.
        - listitem [ref=e547]:
          - strong [ref=e548]: Относительная
          - text: — адрес = PC + смещение (для переходов).
