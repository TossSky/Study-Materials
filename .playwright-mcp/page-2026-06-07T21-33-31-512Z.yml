  - 'heading "54. Методы поддержания когерентности кэш-памяти в ВС (перечень методов, общая схема, протокол MESI: состояния и граф переходов)." [level=2] [ref=e1864]'
  - paragraph [ref=e1865]:
    - emphasis [ref=e1866]: Нужны
    - emphasis [ref=e1867]: общая схема
    - emphasis [ref=e1868]: и
    - emphasis [ref=e1869]: граф переходов MESI
    - emphasis [ref=e1870]: .
  - list [ref=e1871]:
    - listitem [ref=e1872]:
      - strong [ref=e1873]: Проблема когерентности
      - text: — в SMP у каждого ЦП свой кэш; одна ячейка ОП может иметь разные копии → нужно согласование.
    - listitem [ref=e1874]:
      - strong [ref=e1875]: "Способы (по лекции):"
      - list [ref=e1876]:
        - listitem [ref=e1877]: программные (компилятор + ОС, некэшируемые данные);
        - listitem [ref=e1878]: протоколы сквозной / обратной записи;
        - listitem [ref=e1879]:
          - strong [ref=e1880]: запись с аннулированием (write invalidate)
          - text: — копии блока в других кэшах помечаются недостоверными (бит достоверности → 0);
        - listitem [ref=e1881]:
          - strong [ref=e1882]: запись с обновлением (write update)
          - text: — запись дублируется во все кэши с копией (широковещательно);
        - listitem [ref=e1883]: разделяемая кэш-память; стандарт SCI.
    - listitem [ref=e1884]:
      - strong [ref=e1885]: "Аппаратные механизмы реализации:"
      - list [ref=e1886]:
        - listitem [ref=e1887]:
          - strong [ref=e1888]: Снупинг (наблюдение, snooping)
          - text: — контроллер каждого кэша следит за шиной; процессоры широковещательно шлют запросы, локальный контроллер аннулирует/обновляет свою копию.
        - listitem [ref=e1889]:
          - strong [ref=e1890]: Справочниковый (directory)
          - text: — централизованный справочник в ОП хранит, у кого какие копии (для больших систем без общей шины).
    - listitem [ref=e1891]:
      - text: Предшественник MESI —
      - strong [ref=e1892]: протокол однократной записи (write-once)
      - text: ": состояния I (Invalid) / V (Valid) / R (Reserved, однократное изменение, учтено в ОЗУ) / D (Dirty)."
    - listitem [ref=e1893]:
      - strong [ref=e1894]: Протокол MESI
      - text: "— 4 состояния строки кэша:"
      - list [ref=e1895]:
        - listitem [ref=e1896]:
          - strong [ref=e1897]: M (Modified)
          - text: — изменена, только здесь, не совпадает с ОП («грязная»).
        - listitem [ref=e1898]:
          - strong [ref=e1899]: E (Exclusive)
          - text: — только здесь, совпадает с ОП (чистая).
        - listitem [ref=e1900]:
          - strong [ref=e1901]: S (Shared)
          - text: — есть копии в других кэшах, совпадает с ОП.
        - listitem [ref=e1902]:
          - strong [ref=e1903]: I (Invalid)
          - text: — недействительна.
