      - strong [ref=e395]: "Виды архитектур ЭВМ:"
      - text: централизованная, магистральная, иерархическая (с канальными процессорами); по организации памяти ЦУ —
      - strong [ref=e396]: фон-неймановская/принстонская
      - text: (общая память команд и данных) vs
      - strong [ref=e397]: гарвардская
      - text: (раздельные памяти и шины — быстрее, в DSP/МК).
  - heading "6. Функциональные блоки ЦП" [level=2] [ref=e398]
  - paragraph [ref=e399]:
    - emphasis [ref=e400]: Нужны
    - emphasis [ref=e401]: схема АЛУ
    - emphasis [ref=e402]: и
    - emphasis [ref=e403]: схема УУ
    - emphasis [ref=e404]: .
  - list [ref=e405]:
    - listitem [ref=e406]:
      - strong [ref=e407]: АЛУ (арифметико-логическое устройство)
      - text: — выполняет арифметические и логические операции над операндами; синхронизировано с остальными узлами.
  - document [ref=e409]:
    - generic [ref=e417]:
      - paragraph [ref=e424]: операнд A
      - paragraph [ref=e431]: "АЛУ: + − И ИЛИ, сдвиги"
      - paragraph [ref=e438]: операнд B
