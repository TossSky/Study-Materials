        - paragraph [ref=e2842]: Exclusive — чистая, только здесь
        - paragraph [ref=e2851]: Shared — есть копии
        - paragraph [ref=e2860]: Invalid — недействительна
  - list [ref=e2861]:
    - listitem [ref=e2862]:
      - strong [ref=e2863]: "Принцип:"
      - text: запись разрешена только из состояния M или E; перед записью в S — рассылается инвалидация другим кэшам (→ их строки в I), своя → M.
  - heading "55. Современные суперкомпьютеры" [level=2] [ref=e2864]
  - paragraph [ref=e2865]:
    - emphasis [ref=e2866]: По лекции 14 (рейтинг TOP500, top500.org). Метрика — производительность в
    - emphasis [ref=e2867]: PFlop/s
    - emphasis [ref=e2868]:
      - text: "на тесте LINPACK:"
      - code [ref=e2869]: Rmax
      - text: (реальная) и
      - code [ref=e2870]: Rpeak
      - text: (пиковая).
  - list [ref=e2871]:
    - listitem [ref=e2872]:
      - strong [ref=e2873]: Суперкомпьютер
      - text: — система максимальной производительности; современные —
      - strong [ref=e2874]: экзафлопсные
      - text: (≥ 10¹⁸ Flop/s),
      - strong [ref=e2875]: гибридные
      - text: узлы CPU + GPU-ускорители, быстрая сеть (Slingshot, InfiniBand).
    - listitem [ref=e2876]:
      - strong [ref=e2877]: "TOP500 (ноябрь 2023), первая тройка:"
      - list [ref=e2878]:
        - listitem [ref=e2879]:
          - strong [ref=e2880]: El Capitan
          - text: (США, HPE Cray,
          - strong [ref=e2881]: AMD EPYC 4-го пок. + AMD Instinct MI300A
          - text: ) —
          - strong [ref=e2882]: 1.809 EFlop/s
          - text: ", ~11.3 млн ядер, 29 МВт, 2024 г."
        - listitem [ref=e2883]:
          - strong [ref=e2884]: Frontier
          - text: (США, HPE Cray,
          - strong [ref=e2885]: AMD EPYC + Instinct MI250X
          - text: ) — ~1.35 EFlop/s, первый экзафлопсный (2022).
        - listitem [ref=e2886]:
          - strong [ref=e2887]: Aurora
          - text: (США, HPE Cray,
          - strong [ref=e2888]: Intel Xeon Max + Intel GPU Max
          - text: ") — ~1.0 EFlop/s. - Также:"
          - strong [ref=e2889]: Fugaku
          - text: (Япония, ARM
          - strong [ref=e2890]: A64FX
          - text: ", без GPU), Eagle (Microsoft, NVIDIA H100), JUPITER (Германия, NVIDIA GH200)."
    - listitem [ref=e2891]:
      - strong [ref=e2892]: "Российские (в TOP500):"
      - strong [ref=e2893]: Червоненкис
      - text: ", Галушкин, Ляпунов (Yandex, AMD EPYC + NVIDIA A100),"
      - strong [ref=e2894]: Christofari / Christofari Neo
      - text: (СберCloud, NVIDIA DGX).
    - listitem [ref=e2895]:
      - strong [ref=e2896]: "Пути развития:"
      - text: эволюция (экстраполяция);
      - strong [ref=e2897]: Grid-технологии и облака
      - text: ; параллелизм многих уровней;
      - strong [ref=e2898]: сопроцессоры-ускорители
      - text: (неоднородная структура); обработка на
      - strong [ref=e2899]: ПЛИС/FPGA
      - text: ; специализация на заказных микросхемах.
    - listitem [ref=e2900]:
      - strong [ref=e2901]: "Основные сложности:"
      - text: задержки и узкая полоса «процессор–память» и межпроцессорных связей; издержки ОС, растущие с числом процессоров; трудности распараллеливания; слабая поддержка параллелизма языками.
  - separator [ref=e2902]
  - heading "Шпаргалка-минимум (если совсем мало времени — выучи это)" [level=2] [ref=e2903]
  - list [ref=e2904]:
    - listitem [ref=e2905]:
      - strong [ref=e2906]: "Флинн:"
      - text: SISD / SIMD / MISD / MIMD (по потокам команд × данных).
    - listitem [ref=e2907]:
      - strong [ref=e2908]: "Амдал:"
      - code [ref=e2909]: S = 1/(f + (1−f)/n)
      - text: ", потолок"
      - code [ref=e2910]: 1/f
      - text: . Последовательная доля всё губит.
    - listitem [ref=e2911]:
      - strong [ref=e2912]: "Память ВС:"
      - text: UMA (общая, равный доступ, SMP) · NUMA (распределённая, общее адр., неравный доступ) · NORMA (только своя память + сообщения, кластеры/MPP).
    - listitem [ref=e2913]:
      - strong [ref=e2914]: SIMD
      - text: = векторные/матричные/ассоциативные/систолические.
      - strong [ref=e2915]: MIMD
      - text: = PVP/MPP/кластеры.
    - listitem [ref=e2916]:
      - strong [ref=e2917]: "MESI:"
      - text: Modified / Exclusive / Shared / Invalid — когерентность кэшей.
    - listitem [ref=e2918]:
      - strong [ref=e2919]: CISC
      - text: (микропрограммное УУ, сложные команды) vs
      - strong [ref=e2920]: RISC
      - text: (аппаратное УУ, простые, 1 такт, load/store) vs
      - strong [ref=e2921]: VLIW
      - text: (параллелизм задаёт компилятор).
    - listitem [ref=e2922]:
      - strong [ref=e2923]: "Фон Нейман:"
      - text: двоичное кодирование, программное управление, однородность памяти, адресуемость.
    - listitem [ref=e2924]:
      - strong [ref=e2925]: "Кэш-отображение:"
      - text: прямое / ассоциативное / множественно-ассоциативное.
    - listitem [ref=e2926]:
      - strong [ref=e2927]: DMA
      - text: — обмен ПУ↔память минуя ЦП.
    - listitem [ref=e2928]:
      - strong [ref=e2929]: "Intel vs AMD:"
      - text: AMD первой ввела 64-бит и встроенный контроллер памяти; сейчас Intel = гибрид P+E ядра, AMD = чиплеты + Infinity Fabric + 3D V-Cache.