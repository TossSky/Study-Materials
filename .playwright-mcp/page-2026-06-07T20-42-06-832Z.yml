      - paragraph [ref=e459]: флаги Z C S O
  - list [ref=e460]:
    - listitem [ref=e461]:
      - strong [ref=e462]: УУ (устройство управления)
      - text: — формирует управляющие сигналы, дешифрирует команды, задаёт последовательность работы узлов.
  - document [ref=e464]:
    - generic [ref=e470]:
      - paragraph [ref=e477]: команда
      - paragraph [ref=e484]: "УУ: дешифратор + автомат"
      - paragraph [ref=e491]: такты
      - paragraph [ref=e498]:
        - text: "управляющие сигналы:"
        - text: АЛУ, регистры, память, ВВ
  - list [ref=e499]:
    - listitem [ref=e500]:
      - strong [ref=e501]: "Два типа УУ:"
      - text: с
      - strong [ref=e502]: жёсткой (схемной)
      - text: логикой — быстрое, под конкретную систему команд (→ RISC);
      - strong [ref=e503]: микропрограммное
      - text: — гибкое (перенастройка заменой микропрограммы), но медленнее (→ CISC).
    - listitem [ref=e504]:
      - strong [ref=e505]: "Основные регистры ЦП:"
      - list [ref=e506]:
        - listitem [ref=e507]:
          - strong [ref=e508]: PC (Program Counter)
          - text: / счётчик команд — адрес следующей команды.
        - listitem [ref=e509]:
          - strong [ref=e510]: IR (Instruction Register)
          - text: — текущая выполняемая команда.
        - listitem [ref=e511]:
          - strong [ref=e512]: MAR (Memory Address Register)
          - text: — адрес ячейки памяти для обращения.
        - listitem [ref=e513]:
          - strong [ref=e514]: MDR/MBR (Memory Data Register)
          - text: — данные, читаемые/пишемые в память.
        - listitem [ref=e515]:
          - strong [ref=e516]: Аккумулятор
          - text: ", регистры общего назначения (РОН), регистр флагов."
  - heading "7. Командный цикл, регистр флагов" [level=2] [ref=e517]
  - list [ref=e518]:
    - listitem [ref=e519]:
      - strong [ref=e520]: Команда
      - text: — элементарное действие процессора (код операции + операнды/адреса).
    - listitem [ref=e521]:
      - strong [ref=e522]: Поток управления
      - text: — порядок выполнения команд (определяется PC и переходами).
    - listitem [ref=e523]:
      - strong [ref=e524]: Исполнительный адрес
      - text: — фактический адрес операнда в памяти (после применения адресации).
    - listitem [ref=e525]:
      - paragraph [ref=e526]:
        - strong [ref=e527]: "Командный цикл (7 шагов по лекции):"
      - list [ref=e528]:
        - listitem [ref=e529]:
          - strong [ref=e530]: "Чтение команды:"
          - code [ref=e531]: IR ← [PC]
          - text: (адрес берётся из счётчика команд).
        - listitem [ref=e532]:
          - strong [ref=e533]: Увеличение счётчика команд
          - text: "на 1:"
          - code [ref=e534]: PC ← PC + 1
          - text: .
        - listitem [ref=e535]:
          - strong [ref=e536]: Формирование адреса операндов
          - text: (по виду адресации).
        - listitem [ref=e537]:
          - strong [ref=e538]: Извлечение операндов
          - text: из памяти/регистров.
        - listitem [ref=e539]:
          - strong [ref=e540]: Выполнение
          - text: операции в АЛУ.
        - listitem [ref=e541]:
          - strong [ref=e542]: Размещение результата
          - text: в памяти/регистрах.
        - listitem [ref=e543]:
          - strong [ref=e544]: Переход к п. 1
          - text: (с проверкой прерываний).
          - emphasis [ref=e545]: "(Декодирование командой УУ — между шагами 1 и 3. Не «склеивай» шаги: на схеме их именно 7.)"
    - listitem [ref=e546]:
      - paragraph [ref=e547]:
        - text: Если вопрос привязан к лабам на
        - strong [ref=e548]: AVR (ATmega)
        - text: — там регистр флагов называется
        - strong [ref=e549]: SREG
        - text: (биты C, Z, N, V, S, H, T, I), а не EFLAGS.
    - listitem [ref=e550]:
      - strong [ref=e551]: Регистр флагов (FLAGS/EFLAGS)
      - text: "— биты состояния после операции:"
      - list [ref=e552]:
        - listitem [ref=e553]:
          - strong [ref=e554]: ZF
          - text: — нуль (результат = 0);
          - strong [ref=e555]: CF
          - text: — перенос/заём;
          - strong [ref=e556]: SF
          - text: — знак (старший бит);
          - strong [ref=e557]: OF
          - text: — переполнение;
          - strong [ref=e558]: PF
          - text: — чётность;
          - strong [ref=e559]: AF
          - text: — вспомогательный перенос.
        - listitem [ref=e560]:
          - text: "Управляющие флаги:"
          - strong [ref=e561]: IF
          - text: (разрешение прерываний),
          - strong [ref=e562]: DF
          - text: (направление),
          - strong [ref=e563]: TF
          - text: (трассировка).
  - heading "8. Основные архитектуры системы команд" [level=2] [ref=e564]
  - list [ref=e565]:
    - listitem [ref=e566]:
      - strong [ref=e567]: Система команд
      - text: — полный перечень команд, которые способна выполнять машина.
      - strong [ref=e568]: Архитектура системы команд (АСК)
      - text: — совокупность средств,
      - strong [ref=e569]: видимых и доступных программисту
      - text: ". Характеристики АСК: вид/формат данных, место хранения данных, методы доступа, операции над данными, число операндов, способ определения адреса следующей команды, способ кодирования."
    - listitem [ref=e570]: "Хронология АСК: аккумуляторная (1950) → стековая (1963–66) → регистровая (1964) → с выделенным доступом к памяти → CISC (1977–80) → RISC (1987) → VLIW (конец 1990-х) → ROSC (безоперандная, 2001)."
    - listitem [ref=e571]:
      - strong [ref=e572]: "Архитектуры (по способу хранения операндов):"
      - list [ref=e573]:
        - listitem [ref=e574]:
          - strong [ref=e575]: Стековая
          - text: — операнды берутся с вершины стека, безадресные команды. Просто, но медленно (всё через стек).
        - listitem [ref=e576]:
          - strong [ref=e577]: Аккумуляторная
          - text: — один операнд в аккумуляторе, второй в памяти; результат в аккумулятор. Короткие команды, но много обращений к памяти.
        - listitem [ref=e578]:
          - strong [ref=e579]: Регистровая
          - text: "— операнды в регистрах общего назначения (РОН). Быстро, основа RISC. Подвиды: регистр-регистр и регистр-память."
        - listitem [ref=e580]:
          - strong [ref=e581]: С выделенным доступом к памяти (load/store)
          - text: — с памятью работают только команды
          - code [ref=e582]: load
          - text: /
          - code [ref=e583]: store
          - text: ", арифметика только над регистрами. Чистая RISC-модель."
  - heading "9. CISC, RISC, VLIW" [level=2] [ref=e584]
  - paragraph [ref=e585]:
    - emphasis [ref=e586]: Нужна
    - emphasis [ref=e587]: схема процессора
    - emphasis [ref=e588]: и
    - emphasis [ref=e589]: сравнение УУ в CISC и RISC
    - emphasis [ref=e590]: .
  - list [ref=e591]:
    - listitem [ref=e592]:
      - strong [ref=e593]: CISC (Complex Instruction Set)
      - text: — много сложных команд разной длины, развитая адресация, команда может делать несколько действий. УУ
      - strong [ref=e594]: микропрограммное
      - text: "(сложное, медленное). Пример: x86."
    - listitem [ref=e595]:
      - strong [ref=e596]: RISC (Reduced Instruction Set)
      - text: — мало простых команд фиксированной длины, выполнение за 1 такт, много регистров, load/store. УУ
      - strong [ref=e597]: аппаратное (схемное)
      - text: "— быстрое. Конвейеризация. Пример: ARM, MIPS."
    - listitem [ref=e598]:
      - strong [ref=e599]: VLIW (Very Long Instruction Word)
      - text: — в одной длинной команде несколько операций, распараллеливание задаёт
      - strong [ref=e600]: компилятор
      - text: "(не процессор). Простое железо, сложный компилятор. Пример: Itanium, Эльбрус."
