  - heading "10. Форматы команд и виды адресации" [level=2] [ref=e683]
  - list [ref=e684]:
    - listitem [ref=e685]:
      - strong [ref=e686]: "Классификация команд:"
      - text: пересылки (load/store, mov), арифметико-логические, передачи управления (переходы, вызовы), ввода-вывода, системные.
    - listitem [ref=e687]:
      - strong [ref=e688]: Формат команды
      - text: "= код операции (КОП) + адресная часть. Число адресов: 0 (стек), 1 (аккумулятор), 2–3 (регистровые). Примеры:"
      - strong [ref=e689]: x86
      - text: — переменная длина;
      - strong [ref=e690]: RISC-16 / AVR
      - text: — фиксированная.
    - listitem [ref=e691]:
      - strong [ref=e692]: "Виды адресации:"
      - list [ref=e693]:
        - listitem [ref=e694]:
          - strong [ref=e695]: Прямая
          - text: — в команде сам адрес операнда.
        - listitem [ref=e696]:
          - strong [ref=e697]: Непосредственная
          - text: — операнд прямо в команде (константа).
        - listitem [ref=e698]:
          - strong [ref=e699]: Регистровая
          - text: — операнд в регистре.
        - listitem [ref=e700]:
          - strong [ref=e701]: Косвенная
          - text: — в команде адрес ячейки/регистра, где лежит адрес операнда.
        - listitem [ref=e702]:
          - strong [ref=e703]: Со смещением (базовая/индексная)
          - text: — адрес = базовый регистр + смещение.
        - listitem [ref=e704]:
          - strong [ref=e705]: Относительная
          - text: — адрес = PC + смещение (для переходов).
