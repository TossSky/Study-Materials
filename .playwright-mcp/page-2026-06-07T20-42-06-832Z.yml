  - heading "БЛОК 1. Начало курса (вопросы 1–18)" [level=1] [ref=e142]
  - heading "1. Представление информации в ЭВМ" [level=2] [ref=e143]
  - list [ref=e144]:
    - listitem [ref=e145]:
      - strong [ref=e146]: Информация
      - text: — сведения об объектах и явлениях, уменьшающие неопределённость знаний. В ЭВМ кодируется двоичными сигналами (0/1).
    - listitem [ref=e147]:
      - strong [ref=e148]: Система счисления (СС)
      - text: — способ записи чисел знаками.
      - strong [ref=e149]: Позиционная
      - text: "(вес цифры зависит от позиции: 2-, 8-, 10-, 16-ричная) и"
      - strong [ref=e150]: непозиционная
      - text: (вес не зависит от позиции, напр. римская).
    - listitem [ref=e151]:
      - strong [ref=e152]: Числа со знаком
      - text: "(n разрядов, старший — знаковый: 0 = «+», 1 = «−»):"
      - list [ref=e153]:
        - listitem [ref=e154]:
          - strong [ref=e155]: Прямой код
          - text: "— знак + модуль. Минус: два нуля (+0 и −0), сложно вычитать."
        - listitem [ref=e156]:
          - strong [ref=e157]: Обратный код
          - text: — для отрицательных инвертируются все разряды.
          - code [ref=e158]: a + (−a) = 2ⁿ − 1
          - text: .
        - listitem [ref=e159]:
          - strong [ref=e160]: Дополнительный код
          - text: — обратный + 1.
          - code [ref=e161]: a + (−a) = 2ⁿ
          - text: .
          - strong [ref=e162]: Главный
          - text: ": вычитание заменяется сложением, один ноль. Используется в АЛУ."
    - listitem [ref=e163]:
      - strong [ref=e164]: "Вещественные числа:"
      - list [ref=e165]:
        - listitem [ref=e166]:
          - strong [ref=e167]: С фиксированной точкой
          - text: — точка на заданном месте, простой, но малый диапазон.
        - listitem [ref=e168]:
          - strong [ref=e169]: С плавающей точкой
          - text: —
          - code [ref=e170]: ±M · qᵖ
          - text: (мантисса M, порядок p, основание q). Стандарт
          - strong [ref=e171]: IEEE 754
          - text: ": знак, порядок (смещённый), мантисса. Широкий диапазон."
    - listitem [ref=e172]:
      - strong [ref=e173]: "Кодирование:"
      - text: текст — таблицы кодировки (ASCII 8 бит,
      - strong [ref=e174]: Unicode/UTF-8
      - text: ); графика — растр (пиксели, RGB) и вектор; звук — дискретизация + квантование (АЦП, напр. PCM); видео — последовательность кадров + сжатие (кодеки).
