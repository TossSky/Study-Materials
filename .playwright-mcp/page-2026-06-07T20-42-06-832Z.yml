          - text: — блок ОП → строго в одну строку кэша (
          - code [ref=e1215]: № = адрес mod N
          - text: ). Просто и быстро, но частые вытеснения (конфликты).
        - listitem [ref=e1216]:
          - strong [ref=e1217]: Полностью ассоциативное
          - text: — блок → в любую строку. Гибко, нет конфликтов, но дорогой поиск (сравнение всех тегов).
        - listitem [ref=e1218]:
          - strong [ref=e1219]: Множественно-ассоциативное (set-associative)
          - text: — кэш делится на наборы по K строк; блок → в любую строку своего набора.
          - strong [ref=e1220]: Компромисс
          - text: ", применяется на практике (2-, 4-, 8-way)."
  - document [ref=e1222]:
    - generic [ref=e1228]:
      - paragraph [ref=e1235]: блок ОП
      - paragraph [ref=e1242]:
        - text: "Прямое:"
        - text: 1 строка (адрес mod N)
      - paragraph [ref=e1249]:
        - text: "Полностью ассоциативное:"
        - text: любая строка
      - paragraph [ref=e1256]:
        - text: "Множ.-ассоциативное:"
        - text: любая строка набора (K-way)
  - heading "21. Замещение строк, согласование ОП↔кэш, дисковый кэш" [level=2] [ref=e1257]
  - list [ref=e1258]:
    - listitem [ref=e1259]:
      - strong [ref=e1260]: "Алгоритмы замещения строки:"
      - list [ref=e1261]:
        - listitem [ref=e1262]:
          - strong [ref=e1263]: LRU
          - text: (Least Recently Used) — вытесняем дольше всех неиспользуемую.
        - listitem [ref=e1264]:
          - strong [ref=e1265]: LFU
          - text: (Least Frequently Used) — реже всех используемую.
        - listitem [ref=e1266]:
          - strong [ref=e1267]: FIFO
          - text: — первую вошедшую.
        - listitem [ref=e1268]:
          - strong [ref=e1269]: Random
          - text: — случайную.
        - listitem [ref=e1270]:
          - strong [ref=e1271]: ARC
          - text: (Adaptive Replacement Cache) — комбинирует LRU+LFU (патент IBM).
    - listitem [ref=e1272]:
      - strong [ref=e1273]: "Алгоритмы согласования ОП↔кэш (однопроцессорные ЭВМ, по лекции):"
      - list [ref=e1274]:
        - listitem [ref=e1275]:
          - strong [ref=e1276]: Сквозная запись (write-through)
          - text: — сразу в кэш и в ОП. Просто, но медленно.
        - listitem [ref=e1277]:
          - strong [ref=e1278]: Простой свопинг
          - text: — обратная запись блока в ОП при его вытеснении.
        - listitem [ref=e1279]:
          - strong [ref=e1280]: Свопинг с флагами
          - text: — в ОП переписывается только при установленном бите модификации (dirty). Быстрее.
        - listitem [ref=e1281]:
          - strong [ref=e1282]: Регистровый свопинг с флагами
          - text: — то же с буферным регистром для ускорения.
    - listitem [ref=e1283]:
      - strong [ref=e1284]: Дисковый кэш
      - text: — буфер в ОЗУ для часто запрашиваемых секторов диска; ускоряет дисковый ввод-вывод.
  - heading "22. Организация защиты памяти" [level=2] [ref=e1285]
  - list [ref=e1286]:
    - listitem [ref=e1287]:
      - strong [ref=e1288]: "Назначение:"
      - text: не дать программе обратиться к чужой/системной памяти (изоляция, надёжность, безопасность).
    - listitem [ref=e1289]:
      - strong [ref=e1290]: "Методы (4, по лекции):"
      - list [ref=e1291]:
        - listitem [ref=e1292]:
          - strong [ref=e1293]: Защита отдельных ячеек
          - text: — «разряд защиты» в ячейке запрещает запись в неё (для отладки программ).
        - listitem [ref=e1294]:
          - strong [ref=e1295]: Граничные регистры
          - text: — задают нижнюю и верхнюю границу области процесса.
        - listitem [ref=e1296]:
          - strong [ref=e1297]: Ключи защиты
          - text: — каждому блоку памяти и программе присвоен ключ; доступ при совпадении.
        - listitem [ref=e1298]:
          - strong [ref=e1299]: Кольца защиты (уровни привилегий 0–3)
          - text: — режим ядра vs пользователя; для страниц — биты доступа R/W/X.
  - heading "23. Концепция виртуальной памяти" [level=2] [ref=e1300]
  - paragraph [ref=e1301]:
    - emphasis [ref=e1302]: Нужны
    - emphasis [ref=e1303]: схемы страничного, сегментного, сегментно-страничного
    - emphasis [ref=e1304]: распределения.
  - list [ref=e1305]:
    - listitem [ref=e1306]:
      - strong [ref=e1307]: Виртуальная память
      - text: "— механизм: программа работает в логическом (виртуальном) адресном пространстве больше физического; трансляция вирт.→физ. адреса аппаратно (MMU), редко используемое выгружается на диск (swap)."
    - listitem [ref=e1308]:
      - strong [ref=e1309]: Страничное
      - text: — память делится на страницы фиксированного размера. Вирт. адрес = № страницы + смещение → через
      - strong [ref=e1310]: страничную таблицу
      - text: в физ. адрес.
    - listitem [ref=e1311]:
      - strong [ref=e1312]: Сегментное
      - text: "— деление на сегменты переменной длины (по смыслу: код, данные, стек). Адрес = № сегмента + смещение."
    - listitem [ref=e1313]:
      - strong [ref=e1314]: Сегментно-страничное
      - text: "— комбинация: сегменты делятся на страницы (x86). Гибкость сегментов + удобство страниц."
    - listitem [ref=e1315]:
      - strong [ref=e1316]: Страничная таблица
      - text: "— поля записи:"
      - strong [ref=e1317]: V
      - text: (присутствие страницы в ОП; V=0 →
      - strong [ref=e1318]: страничный сбой / page fault
      - text: ),
      - strong [ref=e1319]: R
      - text: (использование — для замещения),
      - strong [ref=e1320]: M
      - text: (модификация — для свопинга с флагами),
      - strong [ref=e1321]: A
      - text: "(права доступа: чтение/запись). Сокращение длины таблицы: многоуровневые таблицы, инвертированная таблица."
    - listitem [ref=e1322]:
      - text: "Характеристики:"
      - strong [ref=e1323]: страничная
      - text: → внутренняя фрагментация;
      - strong [ref=e1324]: сегментная
      - text: → внешняя фрагментация, но удобен разделяемый доступ к общим сегментам.
    - listitem [ref=e1325]:
      - strong [ref=e1326]: TLB (Translation Lookaside Buffer)
      - text: — кэш недавних трансляций адресов (8–4096 записей, полностью/множественно-ассоциативный), ускоряет MMU (без него — лишнее обращение к таблице на каждый доступ).
  - code [ref=e1328]: вирт. адрес ─► [TLB?] ─есть─► физ. адрес └─нет─► страничная таблица ─► физ. адрес (+ занести в TLB)
  - heading "24. НЖМД, SSD, оптика, магнитные ленты" [level=2] [ref=e1329]
  - list [ref=e1330]:
    - listitem [ref=e1331]:
      - strong [ref=e1332]: НЖМД (HDD)
      - text: "— магнитные пластины, головки. Геометрия:"
      - strong [ref=e1333]: дорожки, секторы, цилиндры
      - text: ". Характеристики: ёмкость, скорость вращения (об/мин), время доступа (seek), интерфейс. Дёшево за ГБ, но механика — медленно."
    - listitem [ref=e1334]:
      - strong [ref=e1335]: SSD
      - text: "— флеш-память (NAND), нет механики. Быстрее, тише, надёжнее к ударам. Минус: ограниченный ресурс перезаписи ячеек →"
      - strong [ref=e1336]: контроллер с wear-leveling
      - text: (равномерный износ), TRIM. Чем больше параллельных каналов NAND, тем быстрее.
    - listitem [ref=e1337]:
      - strong [ref=e1338]: Оптика (CD/DVD/Blu-ray)
      - text: — данные = питы/лэнды на дорожке, читаются лазером. Спиральная дорожка от центра.
    - listitem [ref=e1339]:
      - strong [ref=e1340]: Магнитные ленты
      - text: — последовательный доступ, огромная ёмкость, дёшево →
      - strong [ref=e1341]: архивное резервное копирование
      - text: .
  - heading "25. Избыточные дисковые подсистемы (RAID)" [level=2] [ref=e1342]
  - paragraph [ref=e1343]:
    - emphasis [ref=e1344]: Нужны
    - emphasis [ref=e1345]: схемы уровней RAID
    - emphasis [ref=e1346]: .
  - list [ref=e1347]:
    - listitem [ref=e1348]:
      - strong [ref=e1349]: Назначение RAID
      - text: — объединить диски для роста производительности и/или надёжности.
    - listitem [ref=e1350]:
      - strong [ref=e1351]: Производительность
      - text: —
      - strong [ref=e1352]: расслоение (stripe)
      - text: ": данные параллельно на несколько дисков."
    - listitem [ref=e1353]:
      - strong [ref=e1354]: Надёжность
      - text: —
      - strong [ref=e1355]: зеркалирование (mirror)
      - text: и
      - strong [ref=e1356]: контроль чётности (parity)
      - text: .
    - listitem [ref=e1357]:
      - strong [ref=e1358]: "Уровни:"
      - list [ref=e1359]:
        - listitem [ref=e1360]:
          - strong [ref=e1361]: RAID 0
          - text: — striping, без избыточности. Быстро, но смерть 1 диска = потеря всего.
        - listitem [ref=e1362]:
          - strong [ref=e1363]: RAID 1
          - text: — mirroring (зеркало). Надёжно, но 50% ёмкости.
        - listitem [ref=e1364]:
          - strong [ref=e1365]: RAID 5
          - text: — striping + чётность по всем дискам. Переживает отказ 1 диска. Баланс.
        - listitem [ref=e1366]:
          - strong [ref=e1367]: RAID 6
          - text: — две чётности, переживает 2 диска.
        - listitem [ref=e1368]:
          - strong [ref=e1369]: RAID 10 (1+0)
          - text: — зеркало + страйп. Скорость и надёжность, дорого.
  - document [ref=e1371]:
    - generic [ref=e1374]:
      - generic [ref=e1375]:
        - paragraph [ref=e1383]: RAID 5 — страйп + чётность
        - generic [ref=e1384]:
          - paragraph [ref=e1391]: A1
          - paragraph [ref=e1398]: A2
          - paragraph [ref=e1405]: Ap (чётность)
      - generic [ref=e1406]:
        - paragraph [ref=e1414]: RAID 1 — зеркало (надёжность)
        - generic [ref=e1415]:
          - paragraph [ref=e1422]: A1
          - paragraph [ref=e1429]: A1 копия
      - generic [ref=e1430]:
        - paragraph [ref=e1438]: RAID 0 — страйп (скорость)
        - generic [ref=e1439]:
