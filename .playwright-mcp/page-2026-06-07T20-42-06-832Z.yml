        - paragraph [ref=e299]: выходы f1..fm
  - list [ref=e300]:
    - listitem [ref=e301]:
      - strong [ref=e302]: FPGA
      - text: "— ПЛИС с программируемой логикой. Компоненты:"
      - strong [ref=e303]: логические блоки (CLB)
      - text: с LUT-таблицами и триггерами,
      - strong [ref=e304]: программируемые межсоединения
      - text: ","
      - strong [ref=e305]: блоки ввода-вывода (IOB)
      - text: ", блоки памяти, умножители."
    - listitem [ref=e306]:
      - strong [ref=e307]: "Программируемые элементы (как хранится конфигурация):"
      - list [ref=e308]:
        - listitem [ref=e309]:
          - strong [ref=e310]: SRAM-based
          - text: — конфигурация в статической памяти. Перепрограммируемые, но энергозависимые (теряют прошивку при выключении, нужна загрузка из ПЗУ). Самые распространённые.
        - listitem [ref=e311]:
          - strong [ref=e312]: Antifuse
          - text: — однократно программируемые (перемычка «прожигается»). Энергонезависимые, надёжные, но не перепрошиваются.
        - listitem [ref=e313]:
          - strong [ref=e314]: Flash
          - text: — на флеш-ячейках. Энергонезависимые и перепрограммируемые (компромисс).
  - heading "5. Архитектуры ЭВМ и принципы фон Неймана" [level=2] [ref=e315]
  - paragraph [ref=e316]:
    - emphasis [ref=e317]: Нужна
    - emphasis [ref=e318]: структура фон-неймановской ВМ
    - emphasis [ref=e319]: .
  - list [ref=e320]:
    - listitem [ref=e321]:
      - strong [ref=e322]: "Уровни детализации структуры ВМ (7, сверху вниз):"
      - text: языки высокого уровня → ассемблер → ОС → архитектура системы команд → микроархитектура → цифровой логический → физический (транзисторный).
    - listitem [ref=e323]:
      - strong [ref=e324]: "Принципы фон Неймана:"
      - list [ref=e325]:
        - listitem [ref=e326]:
          - strong [ref=e327]: Двоичное кодирование
          - text: данных и команд.
        - listitem [ref=e328]:
          - strong [ref=e329]: Программное управление
          - text: — программа из команд, выполняемых последовательно.
        - listitem [ref=e330]:
          - strong [ref=e331]: Однородность памяти
          - text: — команды и данные в одной памяти, неразличимы по виду (команду можно обрабатывать как данные).
        - listitem [ref=e332]:
          - strong [ref=e333]: Адресуемость памяти
          - text: — память из ячеек с адресами, доступ по адресу.
  - document [ref=e335]:
