      - text: ).
    - listitem [ref=e2049]:
      - strong [ref=e2050]: Индекс параллелизма
      - code [ref=e2051]: PI(n) = O(n) / T(n)
      - text: — средняя скорость (операций в единицу времени).
    - listitem [ref=e2052]:
      - strong [ref=e2053]: Ускорение
      - code [ref=e2054]: S(n) = T(1) / T(n)
      - text: — во сколько раз быстрее. Идеал
      - code [ref=e2055]: S = n
      - text: .
    - listitem [ref=e2056]:
      - strong [ref=e2057]: Эффективность
      - code [ref=e2058]: E(n) = S(n)/n = T(1) / (n·T(n))
      - text: — доля ускорения на один процессор (0…1).
    - listitem [ref=e2059]:
      - strong [ref=e2060]: Утилизация
      - code [ref=e2061]: U(n) = O(n) / (n·T(n))
      - text: (= R·E).
    - listitem [ref=e2062]:
      - strong [ref=e2063]: Избыточность
      - code [ref=e2064]: R(n) = O(n) / O(1)
      - text: — во сколько раз больше операций.
    - listitem [ref=e2065]:
      - strong [ref=e2066]: Сжатие
      - code [ref=e2067]: C(n) = O(1) / O(n)
      - text: (величина, обратная избыточности).
    - listitem [ref=e2068]:
      - strong [ref=e2069]: Качество
      - code [ref=e2070]: Q(n) = T³(1) / (n·T²(n)·O(n)) = S·E·C
      - text: — обобщённый показатель.
