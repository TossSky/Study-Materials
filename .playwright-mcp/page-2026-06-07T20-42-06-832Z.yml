      - paragraph [ref=e2671]: результат
  - list [ref=e2672]:
    - listitem [ref=e2673]:
      - strong [ref=e2674]: Редукционные (reduction)
      - text: —
      - strong [ref=e2675]: управление по запросу
      - text: ": вычисление запускается, когда его результат"
      - strong [ref=e2676]: затребован
      - text: другим (ленивые вычисления, demand-driven).
    - listitem [ref=e2677]:
      - strong [ref=e2678]: "Классификация потоковых:"
      - text: статические (1 токен на дуге) и динамические (с метками — несколько токенов).
  - heading "53. Перспективные процессоры" [level=2] [ref=e2679]
  - list [ref=e2680]:
    - listitem [ref=e2681]:
      - strong [ref=e2682]: Ассоциативные
      - text: — доступ к памяти по содержимому, параллельный поиск.
    - listitem [ref=e2683]:
      - strong [ref=e2684]: Клеточные (ДНК-процессоры)
      - text: — вычисления на молекулах ДНК, массовый параллелизм химических реакций.
    - listitem [ref=e2685]:
      - strong [ref=e2686]: Нейронные (нейропроцессоры/NPU)
      - text: — структура из нейронов, параллельная обработка, обучение, для ИИ/распознавания.
    - listitem [ref=e2687]:
      - strong [ref=e2688]: С многозначной логикой
      - text: — не 2, а больше состояний на сигнал (троичная и др.) → выше плотность информации.
    - listitem [ref=e2689]:
      - strong [ref=e2690]: Квантовые
      - text: — кубиты в
      - strong [ref=e2691]: суперпозиции
      - text: (0 и 1 одновременно) +
      - strong [ref=e2692]: запутанность
      - text: → экспоненциальный параллелизм для некоторых задач (факторизация, поиск).
  - heading "54. Когерентность кэша в ВС, протокол MESI" [level=2] [ref=e2693]
  - paragraph [ref=e2694]:
    - emphasis [ref=e2695]: Нужны
    - emphasis [ref=e2696]: общая схема
    - emphasis [ref=e2697]: и
    - emphasis [ref=e2698]: граф переходов MESI
    - emphasis [ref=e2699]: .
  - list [ref=e2700]:
    - listitem [ref=e2701]:
      - strong [ref=e2702]: Проблема когерентности
      - text: — в SMP у каждого ЦП свой кэш; одна ячейка ОП может иметь разные копии → нужно согласование.
    - listitem [ref=e2703]:
      - strong [ref=e2704]: "Способы (по лекции):"
      - text: программные (компилятор+ОС, некэшируемые данные); протоколы сквозной/обратной записи;
      - strong [ref=e2705]: запись с аннулированием (write invalidate)
      - text: — при записи в свой кэш копии блока в других кэшах помечаются недостоверными (бит достоверности → 0);
      - strong [ref=e2706]: запись с обновлением (write update)
      - text: — запись дублируется во все кэши с копией (широковещательно); разделяемая кэш-память; стандарт SCI.
    - listitem [ref=e2707]:
      - strong [ref=e2708]: "Аппаратные механизмы реализации:"
      - list [ref=e2709]:
        - listitem [ref=e2710]:
          - strong [ref=e2711]: Снупинг (наблюдение, snooping)
          - text: — контроллер каждого кэша следит за шиной; процессоры широковещательно шлют запросы, локальный контроллер аннулирует/обновляет свою копию.
        - listitem [ref=e2712]:
          - strong [ref=e2713]: Справочниковый (directory)
          - text: — централизованный справочник в ОП хранит, у кого какие копии (для больших систем без общей шины).
    - listitem [ref=e2714]:
      - text: Предшественник MESI —
      - strong [ref=e2715]: протокол однократной записи (write-once)
      - text: ": состояния I (Invalid) / V (Valid) / R (Reserved, однократное изменение, учтено в ОЗУ) / D (Dirty)."
    - listitem [ref=e2716]:
      - strong [ref=e2717]: Протокол MESI
      - text: "— 4 состояния строки кэша:"
      - list [ref=e2718]:
        - listitem [ref=e2719]:
          - strong [ref=e2720]: M (Modified)
          - text: — изменена, только здесь, не совпадает с ОП («грязная»).
        - listitem [ref=e2721]:
          - strong [ref=e2722]: E (Exclusive)
          - text: — только здесь, совпадает с ОП (чистая).
        - listitem [ref=e2723]:
          - strong [ref=e2724]: S (Shared)
          - text: — есть копии в других кэшах, совпадает с ОП.
        - listitem [ref=e2725]:
          - strong [ref=e2726]: I (Invalid)
          - text: — недействительна.
