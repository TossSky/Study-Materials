  - heading "26. Основы построения шин" [level=2] [ref=e1468]
  - list [ref=e1469]:
    - listitem [ref=e1470]:
      - strong [ref=e1471]: Шина (bus)
      - text: — набор линий для обмена между функциональными блоками (ЦП↔память, ЦП↔ВВ, память↔ВВ); «двунаправленный универсальный коммутатор».
    - listitem [ref=e1472]:
      - strong [ref=e1473]: "Функциональные типы:"
      - strong [ref=e1474]: ША (адреса)
      - text: —
      - strong [ref=e1475]: однонаправленная
      - text: ", разрядность задаёт объём адресуемой памяти ("
      - code [ref=e1476]: N=2ⁱ
      - text: );
      - strong [ref=e1477]: ШД (данных)
      - text: —
      - strong [ref=e1478]: двунаправленная
      - text: ", последовательная или параллельная, ширина = слово;"
      - strong [ref=e1479]: ШУ (управления)
      - text: — линии управляющей информации и состояния.
    - listitem [ref=e1480]:
      - strong [ref=e1481]: "Иерархия шин:"
      - text: системная (ЦП–память) → шина расширения → шина ввода/вывода (через адаптеры); архитектура с «пристройкой» (mezzanine). Чем ближе к ЦП, тем быстрее.
    - listitem [ref=e1482]:
      - strong [ref=e1483]: "Состав линий ШУ (7 групп):"
      - text: сигналы управления транзакциями (тип операции, кол-во передаваемых байт, тип адреса, тип протокола), информация состояния (статуса), арбитраж, прерывания, последовательные локальные сети, позиционный код, тактирование и синхронизация.
  - heading "27. Арбитраж шины" [level=2] [ref=e1484]
  - paragraph [ref=e1485]:
    - emphasis [ref=e1486]: Нужны
    - emphasis [ref=e1487]: схемы приоритетов и арбитража
    - emphasis [ref=e1488]: .
  - list [ref=e1489]:
    - listitem [ref=e1490]:
      - strong [ref=e1491]: Арбитраж
      - text: — процедура допуска к управлению шиной только одного из ведущих (master).
      - strong [ref=e1492]: Арбитр
      - text: распределяет доступ (обычно на северном мосту).
    - listitem [ref=e1493]:
      - strong [ref=e1494]: "Схемы приоритетов:"
      - strong [ref=e1495]: статические
      - text: (фиксированные) и
      - strong [ref=e1496]: динамические
      - text: ". Динамические алгоритмы: простая циклическая смена, циклическая с учётом последнего запроса, по случайному закону, равных приоритетов, LRU (наиболее давнее использование)."
    - listitem [ref=e1497]:
      - strong [ref=e1498]: "Схемы арбитража:"
      - list [ref=e1499]:
        - listitem [ref=e1500]:
          - strong [ref=e1501]: Централизованная
          - text: "(один арбитр):"
          - strong [ref=e1502]: параллельная
          - text: — у каждого ведущего своя линия запроса/предоставления;
          - strong [ref=e1503]: последовательная (цепочечная, daisy chain)
          - text: — сигнал разрешения идёт по цепочке, ближний к арбитру = высший приоритет.
        - listitem [ref=e1504]:
          - strong [ref=e1505]: Децентрализованная (распределённая)
          - text: — единого арбитра нет, у каждого ведущего свой контроллер шины.
    - listitem [ref=e1506]:
      - strong [ref=e1507]: "Способы организации опроса:"
      - strong [ref=e1508]: централизованный
      - text: (контроллер по очереди опрашивает ведущих, выставляя их адрес) и
      - strong [ref=e1509]: децентрализованный
      - text: (каждый ведущий сам формирует адрес следующего).
  - heading "28. Протоколы шин, синхронная/асинхронная передача" [level=2] [ref=e1510]
  - paragraph [ref=e1511]:
    - emphasis [ref=e1512]: Нужны
    - emphasis [ref=e1513]: схемы протоколов
    - emphasis [ref=e1514]: .
  - list [ref=e1515]:
    - listitem [ref=e1516]:
      - strong [ref=e1517]: Синхронная передача
      - text: — общий тактовый сигнал, события привязаны к фронтам такта. Быстро и просто, но все устройства на одной частоте, длина ограничена.
    - listitem [ref=e1518]:
      - strong [ref=e1519]: Асинхронная передача
      - text: — без общего такта, по
      - strong [ref=e1520]: квитированию (handshake)
      - text: ": запрос → готовность (request/acknowledge). Гибко (разные скорости устройств), но медленнее и сложнее."
  - code [ref=e1522]: "Синхронная: CLK ‾|_|‾|_|‾|_ данные привязаны к фронтам Асинхронная: REQ ──► устройство ──► ACK (рукопожатие)"
  - heading "29. Эффективность, надёжность, отказоустойчивость шин" [level=2] [ref=e1523]
  - list [ref=e1524]:
    - listitem [ref=e1525]:
      - strong [ref=e1526]: "Повышение эффективности (полосы):"
      - strong [ref=e1527]: отказ от мультиплексирования
      - text: ША/ШД, увеличение ширины ШД и тактовой частоты,
      - strong [ref=e1528]: блочные/пакетные транзакции (burst)
      - text: ","
      - strong [ref=e1529]: конвейеризация
      - text: и
      - strong [ref=e1530]: расщепление транзакций (split)
      - text: ", арбитраж с перекрытием и с удержанием шины, переход на"
      - strong [ref=e1531]: последовательные дифференциальные
      - text: линии (PCIe вместо PCI).
    - listitem [ref=e1532]:
      - strong [ref=e1533]: "Повышение надёжности:"
      - text: контроль чётности/ECC на шине, дублирование/резервные линии, экранирование, протоколы повтора при ошибке.
