      - paragraph [ref=e394]:
        - strong [ref=e395]: "Командный цикл (7 шагов по лекции):"
      - list [ref=e396]:
        - listitem [ref=e397]:
          - strong [ref=e398]: "Чтение команды:"
          - code [ref=e399]: IR ← [PC]
          - text: (адрес берётся из счётчика команд).
        - listitem [ref=e400]:
          - strong [ref=e401]: Увеличение счётчика команд
          - text: "на 1:"
          - code [ref=e402]: PC ← PC + 1
          - text: .
        - listitem [ref=e403]:
          - strong [ref=e404]: Формирование адреса операндов
