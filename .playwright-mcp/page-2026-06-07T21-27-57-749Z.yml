          - strong [ref=e430]: DF
          - text: (направление),
          - strong [ref=e431]: TF
          - text: (трассировка).
  - heading "8. Основные архитектуры системы команд (описание стековой, аккумуляторной, регистровой архитектуры системы команд и архитектура с выделенным доступом к памяти)." [level=2] [ref=e432]
  - list [ref=e433]:
    - listitem [ref=e434]:
      - strong [ref=e435]: Система команд
      - text: — полный перечень команд, которые способна выполнять машина.
      - strong [ref=e436]: Архитектура системы команд (АСК)
      - text: — совокупность средств,
      - strong [ref=e437]: видимых и доступных программисту
      - text: ". Характеристики АСК: вид/формат данных, место хранения данных, методы доступа, операции над данными, число операндов, способ определения адреса следующей команды, способ кодирования."
    - listitem [ref=e438]: "Хронология АСК: аккумуляторная (1950) → стековая (1963–66) → регистровая (1964) → с выделенным доступом к памяти → CISC (1977–80) → RISC (1987) → VLIW (конец 1990-х) → ROSC (безоперандная, 2001)."
    - listitem [ref=e439]:
      - strong [ref=e440]: "Архитектуры (по способу хранения операндов):"
      - list [ref=e441]:
        - listitem [ref=e442]:
          - strong [ref=e443]: Стековая
          - text: — операнды берутся с вершины стека, безадресные команды. Просто, но медленно (всё через стек).
        - listitem [ref=e444]:
          - strong [ref=e445]: Аккумуляторная
          - text: — один операнд в аккумуляторе, второй в памяти; результат в аккумулятор. Короткие команды, но много обращений к памяти.
        - listitem [ref=e446]:
          - strong [ref=e447]: Регистровая
          - text: "— операнды в регистрах общего назначения (РОН). Быстро, основа RISC. Подвиды: регистр-регистр и регистр-память."
        - listitem [ref=e448]:
          - strong [ref=e449]: С выделенным доступом к памяти (load/store)
          - text: — с памятью работают только команды
          - code [ref=e450]: load
          - text: /
          - code [ref=e451]: store
          - text: ", арифметика только над регистрами. Чистая RISC-модель."
  - heading "9. Основы построения CISC-, RISC- и VLIW-архитектур системы команд (принципы построения основных архитектур, схема процессора, сравнение функций устройства управления в CISC и RISC процессорах)." [level=2] [ref=e452]
  - paragraph [ref=e453]:
    - emphasis [ref=e454]: Нужна
    - emphasis [ref=e455]: схема процессора
    - emphasis [ref=e456]: и
    - emphasis [ref=e457]: сравнение УУ в CISC и RISC
    - emphasis [ref=e458]: .
  - list [ref=e459]:
    - listitem [ref=e460]:
      - strong [ref=e461]: CISC (Complex Instruction Set)
      - text: — много сложных команд разной длины, развитая адресация, команда может делать несколько действий. УУ
      - strong [ref=e462]: микропрограммное
      - text: "(сложное, медленное). Пример: x86."
    - listitem [ref=e463]:
      - strong [ref=e464]: RISC (Reduced Instruction Set)
      - text: — мало простых команд фиксированной длины, выполнение за 1 такт, много регистров, load/store. УУ
      - strong [ref=e465]: аппаратное (схемное)
      - text: "— быстрое. Конвейеризация. Пример: ARM, MIPS."
    - listitem [ref=e466]:
      - strong [ref=e467]: VLIW (Very Long Instruction Word)
      - text: — в одной длинной команде несколько операций, распараллеливание задаёт
      - strong [ref=e468]: компилятор
      - text: "(не процессор). Простое железо, сложный компилятор. Пример: Itanium, Эльбрус."
