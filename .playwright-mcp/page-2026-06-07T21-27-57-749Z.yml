        - listitem [ref=e1029]:
          - strong [ref=e1030]: RAID 0
          - text: — striping, без избыточности. Быстро, но смерть 1 диска = потеря всего.
        - listitem [ref=e1031]:
          - strong [ref=e1032]: RAID 1
          - text: — mirroring (зеркало). Надёжно, но 50% ёмкости.
        - listitem [ref=e1033]:
          - strong [ref=e1034]: RAID 5
          - text: — striping + чётность по всем дискам. Переживает отказ 1 диска. Баланс.
        - listitem [ref=e1035]:
          - strong [ref=e1036]: RAID 6
          - text: — две чётности, переживает 2 диска.
        - listitem [ref=e1037]:
          - strong [ref=e1038]: RAID 10 (1+0)
          - text: — зеркало + страйп. Скорость и надёжность, дорого.
  - img [ref=e1040]:
    - generic [ref=e1046]: RAID
    - generic [ref=e1048]: RAID 0страйп (скорость)
    - generic [ref=e1050]: RAID 1зеркало
    - generic [ref=e1052]: RAID 5страйп + чётность
    - generic [ref=e1054]: RAID 62 чётности
    - generic [ref=e1056]: RAID 10зеркало + страйп
  - heading "26. Основы построения компьютерных шин (типы шин, иерархия шин, ША, ШД, ШУ, состав линий в ШУ)." [level=2] [ref=e1057]
  - list [ref=e1058]:
    - listitem [ref=e1059]:
      - strong [ref=e1060]: Шина (bus)
      - text: — набор линий для обмена между функциональными блоками (ЦП↔память, ЦП↔ВВ, память↔ВВ); «двунаправленный универсальный коммутатор».
    - listitem [ref=e1061]:
      - strong [ref=e1062]: "Функциональные типы:"
      - strong [ref=e1063]: ША (адреса)
      - text: —
      - strong [ref=e1064]: однонаправленная
      - text: ", разрядность задаёт объём адресуемой памяти ("
      - code [ref=e1065]: N=2ⁱ
      - text: );
      - strong [ref=e1066]: ШД (данных)
      - text: —
      - strong [ref=e1067]: двунаправленная
      - text: ", последовательная или параллельная, ширина = слово;"
      - strong [ref=e1068]: ШУ (управления)
      - text: — линии управляющей информации и состояния.
    - listitem [ref=e1069]:
      - strong [ref=e1070]: "Иерархия шин:"
      - text: системная (ЦП–память) → шина расширения → шина ввода/вывода (через адаптеры); архитектура с «пристройкой» (mezzanine). Чем ближе к ЦП, тем быстрее.
    - listitem [ref=e1071]:
      - strong [ref=e1072]: "Состав линий ШУ (7 групп):"
      - text: сигналы управления транзакциями (тип операции, кол-во передаваемых байт, тип адреса, тип протокола), информация состояния (статуса), арбитраж, прерывания, последовательные локальные сети, позиционный код, тактирование и синхронизация.
  - heading "27. Организация арбитража шины (схемы приоритетов, схемы арбитража, способы организации опроса)." [level=2] [ref=e1073]
  - paragraph [ref=e1074]:
    - emphasis [ref=e1075]: Нужны
    - emphasis [ref=e1076]: схемы приоритетов и арбитража
    - emphasis [ref=e1077]: .
  - list [ref=e1078]:
    - listitem [ref=e1079]:
      - strong [ref=e1080]: Арбитраж
      - text: — процедура допуска к управлению шиной только одного из ведущих (master).
      - strong [ref=e1081]: Арбитр
      - text: распределяет доступ (обычно на северном мосту).
    - listitem [ref=e1082]:
      - strong [ref=e1083]: "Схемы приоритетов:"
      - strong [ref=e1084]: статические
      - text: (фиксированные) и
      - strong [ref=e1085]: динамические
      - text: ". Динамические алгоритмы: простая циклическая смена, циклическая с учётом последнего запроса, по случайному закону, равных приоритетов, LRU (наиболее давнее использование)."
    - listitem [ref=e1086]:
      - strong [ref=e1087]: "Схемы арбитража:"
      - list [ref=e1088]:
        - listitem [ref=e1089]:
          - strong [ref=e1090]: Централизованная
          - text: "(один арбитр):"
          - strong [ref=e1091]: параллельная
          - text: — у каждого ведущего своя линия запроса/предоставления;
          - strong [ref=e1092]: последовательная (цепочечная, daisy chain)
          - text: — сигнал разрешения идёт по цепочке, ближний к арбитру = высший приоритет.
        - listitem [ref=e1093]:
          - strong [ref=e1094]: Децентрализованная (распределённая)
          - text: — единого арбитра нет, у каждого ведущего свой контроллер шины.
    - listitem [ref=e1095]:
      - strong [ref=e1096]: "Способы организации опроса:"
      - strong [ref=e1097]: централизованный
      - text: (контроллер по очереди опрашивает ведущих, выставляя их адрес) и
      - strong [ref=e1098]: децентрализованный
      - text: (каждый ведущий сам формирует адрес следующего).
  - heading "28. Типы протоколов шин, синхронная и асинхронная передача данных (управление процессом передачи данных, схемы и принципы работы протоколов шин)." [level=2] [ref=e1099]
  - paragraph [ref=e1100]:
    - emphasis [ref=e1101]: Нужны
    - emphasis [ref=e1102]: схемы протоколов
    - emphasis [ref=e1103]: .
  - list [ref=e1104]:
    - listitem [ref=e1105]:
      - strong [ref=e1106]: Синхронная передача
      - text: — общий тактовый сигнал, события привязаны к фронтам такта. Быстро и просто, но все устройства на одной частоте, длина ограничена.
    - listitem [ref=e1107]:
      - strong [ref=e1108]: Асинхронная передача
      - text: — без общего такта, по
      - strong [ref=e1109]: квитированию (handshake)
      - text: ": запрос → готовность (request/acknowledge). Гибко (разные скорости устройств), но медленнее и сложнее."
  - code [ref=e1111]: "Синхронная: CLK ‾|_|‾|_|‾|_ данные привязаны к фронтам Асинхронная: REQ ──► устройство ──► ACK (рукопожатие)"
  - heading "29. Методы повышения эффективности шин, надёжность и отказоустойчивость шины (способы повышения эффективности шин, способы повышения надёжности шин)." [level=2] [ref=e1112]
  - list [ref=e1113]:
    - listitem [ref=e1114]:
      - strong [ref=e1115]: "Повышение эффективности (полосы):"
      - strong [ref=e1116]: отказ от мультиплексирования
      - text: ША/ШД, увеличение ширины ШД и тактовой частоты,
      - strong [ref=e1117]: блочные/пакетные транзакции (burst)
      - text: ","
      - strong [ref=e1118]: конвейеризация
      - text: и
      - strong [ref=e1119]: расщепление транзакций (split)
      - text: ", арбитраж с перекрытием и с удержанием шины, переход на"
      - strong [ref=e1120]: последовательные дифференциальные
      - text: линии (PCIe вместо PCI).
    - listitem [ref=e1121]:
      - strong [ref=e1122]: "Повышение надёжности:"
      - text: контроль чётности/ECC на шине, дублирование/резервные линии, экранирование, протоколы повтора при ошибке.
  - 'heading "30. Внутренние интерфейсы ЭВМ: EISA, LPC, PCI, PCI-E, AGP (основные характеристики)." [level=2] [ref=e1123]'
  - list [ref=e1124]:
    - listitem [ref=e1125]:
      - strong [ref=e1126]: EISA
      - text: — расширение ISA, 32-бит, для серверов (устаревший).
    - listitem [ref=e1127]:
      - strong [ref=e1128]: LPC (Low Pin Count)
      - text: — для низкоскоростной периферии (контроллеры клавиатуры, BIOS), заменил ISA.
    - listitem [ref=e1129]:
      - strong [ref=e1130]: PCI
      - text: — параллельная, 32/64-бит, 33/66 МГц, общая шина с арбитражем (устаревает).
    - listitem [ref=e1131]:
      - strong [ref=e1132]: PCI-E (PCI Express)
      - text: —
      - strong [ref=e1133]: последовательная
      - text: ", по «линиям» (lanes ×1…×16), независимые дифференциальные пары, point-to-point. Современный стандарт."
    - listitem [ref=e1134]:
      - strong [ref=e1135]: AGP
      - text: — выделенный интерфейс для видеокарт (между PCI и PCI-E исторически), вытеснен PCI-E.
  - 'heading "31. Внешние интерфейсы для ЗУ: IDE, SATA, SCSI, SAS (основные характеристики)." [level=2] [ref=e1136]'
  - list [ref=e1137]:
    - listitem [ref=e1138]:
      - strong [ref=e1139]: IDE/PATA
      - text: — параллельный, для HDD/CD, шлейф 40/80 жил (устарел).
    - listitem [ref=e1140]:
      - strong [ref=e1141]: SATA
      - text: —
      - strong [ref=e1142]: последовательный
      - text: наследник IDE, точка-точка, hot-swap, скорости до 6 Гбит/с. Массовый для дисков.
    - listitem [ref=e1143]:
      - strong [ref=e1144]: SCSI
      - text: — параллельный, шина для нескольких устройств, для серверов (надёжность, очередь команд).
    - listitem [ref=e1145]:
      - strong [ref=e1146]: SAS (Serial Attached SCSI)
      - text: — последовательный наследник SCSI, совместим с SATA-дисками, для серверов/СХД.
  - 'heading "32. Внешние интерфейсы для ввода/вывода: RS-232C, LPT (EPP, ECP), USB, SPI, I²C (основные характеристики)." [level=2] [ref=e1147]'
  - list [ref=e1148]:
    - listitem [ref=e1149]:
      - strong [ref=e1150]: RS-232C
      - text: — последовательный COM-порт, низкая скорость, для модемов/терминалов (устарел).
    - listitem [ref=e1151]:
      - strong [ref=e1152]: LPT
      - text: — параллельный порт для принтеров; режимы
      - strong [ref=e1153]: EPP
      - text: (двунаправленный) и
      - strong [ref=e1154]: ECP
      - text: (с DMA и сжатием).
    - listitem [ref=e1155]:
      - strong [ref=e1156]: USB
      - text: — последовательный, универсальный, hot-plug, питание, до USB4 (40 Гбит/с), топология «дерево» с хабами.
    - listitem [ref=e1157]:
      - strong [ref=e1158]: SPI
      - text: — синхронный, 4 линии (MOSI/MISO/SCLK/CS), быстрый, для микросхем на плате, full-duplex.
    - listitem [ref=e1159]:
      - strong [ref=e1160]: I²C
      - text: — синхронный,
      - strong [ref=e1161]: 2 линии
      - text: (SDA/SCL), адресация устройств, медленнее SPI, для датчиков.
  - heading "33. Система ввода-вывода, организация адресного пространства (способы подключения СВВ к ЦП и ОП, достоинства и недостатки совмещённого и выделенного адресного пространства)." [level=2] [ref=e1162]
  - list [ref=e1163]:
    - listitem [ref=e1164]:
      - strong [ref=e1165]: "Способы подключения СВВ:"
      - list [ref=e1166]:
        - listitem [ref=e1167]:
          - strong [ref=e1168]: Совмещённое адресное пространство (memory-mapped I/O)
          - text: "— порты ВВ в общем адресном пространстве с памятью. Плюс: любые команды работы с памятью годятся для ВВ. Минус: «съедает» адреса памяти."
        - listitem [ref=e1169]:
          - strong [ref=e1170]:
            - text: Выделенное адресное пространство (port-mapped, x86
            - code [ref=e1171]: IN
            - text: /
            - code [ref=e1172]: OUT
            - text: )
          - text: "— отдельное пространство портов. Плюс: не отнимает память, отдельные команды. Минус: нужны спец. команды, сложнее."
  - heading "34. Модуль ввода/вывода, абстрактное периферийное устройство (структура и функции МВВ, схема ПУ)." [level=2] [ref=e1173]
  - paragraph [ref=e1174]:
    - emphasis [ref=e1175]: Нужна
    - emphasis [ref=e1176]: схема ПУ
    - emphasis [ref=e1177]: .
  - list [ref=e1178]:
    - listitem [ref=e1179]:
      - strong [ref=e1180]: МВВ (модуль ввода-вывода)
      - text: — посредник между системной шиной и периферией.
      - strong [ref=e1181]: "5 функций (по лекции):"
      - text: локализация данных (дешифрация адреса ВУ/регистра, адресация данных на ПУ), управление и синхронизация, обмен информацией, буферизация (согласование скоростей ЦП и ПУ), обнаружение ошибок.
    - listitem [ref=e1182]:
      - strong [ref=e1183]: "Структура МВВ:"
      - text: регистры данных, регистры состояния/управления, дешифратор адреса, логика управления, интерфейс с ПУ.
  - img [ref=e1185]:
