  - heading "45. Метрики параллельных вычислений, закон Амдала (7 метрик с формулами и закон Амдала с выводами)." [level=2] [ref=e1455]
  - paragraph [ref=e1456]:
    - emphasis [ref=e1457]: Нужны
    - emphasis [ref=e1458]: 7 метрик с формулами
    - emphasis [ref=e1459]: и
    - emphasis [ref=e1460]: закон Амдала с выводами
    - emphasis [ref=e1461]: .
  - paragraph [ref=e1462]:
    - text: "Обозначения:"
    - code [ref=e1463]: T(1)=O(1)
    - text: — время/объём операций на 1 процессоре;
    - code [ref=e1464]: T(n)
    - text: ","
    - code [ref=e1465]: O(n)
    - text: — время и объём операций на n процессорах.
  - list [ref=e1466]:
    - listitem [ref=e1467]:
      - strong [ref=e1468]: Степень параллелизма
      - code [ref=e1469]: P(t)
      - text: — число процессоров, одновременно выполняющих программу в момент t (даёт
      - strong [ref=e1470]: профиль параллелизма
      - text: ).
    - listitem [ref=e1471]:
      - strong [ref=e1472]: Индекс параллелизма
      - code [ref=e1473]: PI(n) = O(n) / T(n)
      - text: — средняя скорость (операций в единицу времени).
    - listitem [ref=e1474]:
      - strong [ref=e1475]: Ускорение
      - code [ref=e1476]: S(n) = T(1) / T(n)
      - text: — во сколько раз быстрее. Идеал
      - code [ref=e1477]: S = n
      - text: .
    - listitem [ref=e1478]:
      - strong [ref=e1479]: Эффективность
      - code [ref=e1480]: E(n) = S(n)/n = T(1) / (n·T(n))
      - text: — доля ускорения на один процессор (0…1).
    - listitem [ref=e1481]:
      - strong [ref=e1482]: Утилизация
      - code [ref=e1483]: U(n) = O(n) / (n·T(n))
      - text: (= R·E).
    - listitem [ref=e1484]:
      - strong [ref=e1485]: Избыточность
      - code [ref=e1486]: R(n) = O(n) / O(1)
      - text: — во сколько раз больше операций.
    - listitem [ref=e1487]:
      - strong [ref=e1488]: Сжатие
      - code [ref=e1489]: C(n) = O(1) / O(n)
      - text: (величина, обратная избыточности).
    - listitem [ref=e1490]:
      - strong [ref=e1491]: Качество
      - code [ref=e1492]: Q(n) = T³(1) / (n·T²(n)·O(n)) = S·E·C
      - text: — обобщённый показатель.
  - paragraph [ref=e1493]:
    - strong [ref=e1494]: "Пример из лекции:"
    - code [ref=e1495]: n=8
    - text: ","
    - code [ref=e1496]: T(1)=O(1)=O(8)=93
    - text: ","
    - code [ref=e1497]: T(8)=25
    - text: →
    - code [ref=e1498]: S=PI=3.72
    - text: ;
    - code [ref=e1499]: E=U=0.465
    - text: ;
    - code [ref=e1500]: R=C=1
    - text: ;
    - code [ref=e1501]: Q=1.73
    - text: .
  - list [ref=e1502]:
    - listitem [ref=e1503]:
      - strong [ref=e1504]: Закон Амдала.
      - text: Если доля
      - strong [ref=e1505]: последовательного
      - text: кода
      - code [ref=e1506]: f
      - text: "(не распараллеливается), то максимальное ускорение:"
  - code [ref=e1508]: S(n) = 1 / ( f + (1 − f)/n ) ↓ при n → ∞ S_max = 1 / f
  - list [ref=e1509]:
    - listitem [ref=e1510]:
      - strong [ref=e1511]: "Вывод:"
      - text: ускорение ограничено последовательной частью. Если
      - code [ref=e1512]: f = 10%
      - text: ", то даже на ∞ процессорах"
      - code [ref=e1513]: S_max = 10
      - text: .
      - strong [ref=e1514]: "Главный смысл: распараллеливать бесполезно, пока велика последовательная доля"
      - text: — наращивание процессоров упирается в потолок
      - code [ref=e1515]: 1/f
      - text: .
