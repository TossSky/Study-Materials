  - heading "23. Концепция виртуальной памяти (схемы страничного, сегментного и сегментно-страничного распределения виртуальной памяти, страничная таблица, TLB)." [level=2] [ref=e969]
  - paragraph [ref=e970]:
    - emphasis [ref=e971]: Нужны
    - emphasis [ref=e972]: схемы страничного, сегментного, сегментно-страничного
    - emphasis [ref=e973]: распределения.
  - list [ref=e974]:
    - listitem [ref=e975]:
      - strong [ref=e976]: Виртуальная память
      - text: "— механизм: программа работает в логическом (виртуальном) адресном пространстве больше физического; трансляция вирт.→физ. адреса аппаратно (MMU), редко используемое выгружается на диск (swap)."
    - listitem [ref=e977]:
      - strong [ref=e978]: Страничное
      - text: — память делится на страницы фиксированного размера. Вирт. адрес = № страницы + смещение → через
      - strong [ref=e979]: страничную таблицу
      - text: в физ. адрес.
    - listitem [ref=e980]:
      - strong [ref=e981]: Сегментное
      - text: "— деление на сегменты переменной длины (по смыслу: код, данные, стек). Адрес = № сегмента + смещение."
    - listitem [ref=e982]:
      - strong [ref=e983]: Сегментно-страничное
      - text: "— комбинация: сегменты делятся на страницы (x86). Гибкость сегментов + удобство страниц."
    - listitem [ref=e984]:
      - strong [ref=e985]: Страничная таблица
      - text: "— поля записи:"
      - strong [ref=e986]: V
      - text: (присутствие страницы в ОП; V=0 →
      - strong [ref=e987]: страничный сбой / page fault
      - text: ),
      - strong [ref=e988]: R
      - text: (использование — для замещения),
      - strong [ref=e989]: M
      - text: (модификация — для свопинга с флагами),
      - strong [ref=e990]: A
      - text: "(права доступа: чтение/запись). Сокращение длины таблицы: многоуровневые таблицы, инвертированная таблица."
    - listitem [ref=e991]:
      - text: "Характеристики:"
      - strong [ref=e992]: страничная
      - text: → внутренняя фрагментация;
      - strong [ref=e993]: сегментная
      - text: → внешняя фрагментация, но удобен разделяемый доступ к общим сегментам.
    - listitem [ref=e994]:
      - strong [ref=e995]: TLB (Translation Lookaside Buffer)
      - text: — кэш недавних трансляций адресов (8–4096 записей, полностью/множественно-ассоциативный), ускоряет MMU (без него — лишнее обращение к таблице на каждый доступ).
  - code [ref=e997]: вирт. адрес ─► [TLB?] ─есть─► физ. адрес └─нет─► страничная таблица ─► физ. адрес (+ занести в TLB)
  - heading "24. Организация НЖМД, SSD, оптической памяти, магнитных лент (характеристики дисковой памяти, принципы организации SSD-памяти, принципы организации оптической памяти, назначение магнитных лент)." [level=2] [ref=e998]
  - list [ref=e999]:
