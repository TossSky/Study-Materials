  - heading "7. Командный цикл процессора, регистр флагов и состояния (понятия команды, потока управления и исполнительного адреса, описание командного цикла, описание флагов в регистре флагов и состояний)." [level=2] [ref=e385]
  - list [ref=e386]:
    - listitem [ref=e387]:
