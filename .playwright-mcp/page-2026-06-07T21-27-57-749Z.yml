  - heading "37. Каналы и процессоры ввода/вывода (принципы работы, схема, управляющие слова канала, БУВУ)." [level=2] [ref=e1269]
  - list [ref=e1270]:
    - listitem [ref=e1271]:
      - strong [ref=e1272]: Назначение
      - text: "— разгрузить ЦП: канал = специализированный процессор ВВ, выполняет"
      - strong [ref=e1273]: канальную программу
      - text: (управляющие слова канала, УСК).
    - listitem [ref=e1274]:
      - strong [ref=e1275]: "Режимы работы канала (по лекции):"
      - list [ref=e1276]:
        - listitem [ref=e1277]:
          - strong [ref=e1278]: Мультиплексный
          - text: — несколько ВУ разделяют канал во времени (много медленных устройств, короткими сеансами; байт-/блок-мультиплексный).
        - listitem [ref=e1279]:
          - strong [ref=e1280]: Монопольный
          - text: — одно (быстрое) ВУ монополизирует канал до завершения канальной программы (диски).
    - listitem [ref=e1281]:
      - strong [ref=e1282]: БУВУ (блок управления внешними устройствами)
      - text: — управляет конкретным ПУ под командой канала.
  - heading "38. Организации системы прерываний. (способы организации системы прерываний, виды прерываний, аппаратные и программные средства системы прерываний)." [level=2] [ref=e1283]
  - list [ref=e1284]:
    - listitem [ref=e1285]:
      - strong [ref=e1286]: Прерывание
      - text: — приостановка текущей программы для реакции на событие, с переходом на обработчик и возвратом.
    - listitem [ref=e1287]:
      - strong [ref=e1288]: "Виды прерываний:"
      - list [ref=e1289]:
        - listitem [ref=e1290]:
          - strong [ref=e1291]: Аппаратные внешние
          - text: — от устройств (IRQ).
        - listitem [ref=e1292]:
          - strong [ref=e1293]: Внутренние (исключения)
          - text: "— ошибки ЦП. Три типа:"
          - strong [ref=e1294]: отказ (fault)
          - text: — обнаруживается до инструкции, после обработки возврат на
          - strong [ref=e1295]: ту же
          - text: "инструкцию (отказ страницы #PF, деление на 0 #DE);"
          - strong [ref=e1296]: ловушка (trap)
          - text: — после инструкции, возврат на
          - strong [ref=e1297]: следующую
          - text: "(#BP, #OF);"
          - strong [ref=e1298]: аварийное завершение (abort)
          - text: — нельзя точно установить инструкцию (#DF двойной отказ).
        - listitem [ref=e1299]:
          - strong [ref=e1300]: Программные
          - text: — команда
          - code [ref=e1301]: INT n
          - text: (системные вызовы).
    - listitem [ref=e1302]:
      - text: Внешние делятся на
      - strong [ref=e1303]: немаскируемые (NMI)
      - text: и
