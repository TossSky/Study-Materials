  - heading "21. Порядок замещения строк в кэш-памяти, согласование ОП и кэш-памяти, дисковая кэш-память (перечень алгоритмов выбора замещаемой строки, краткое описание алгоритмов согласование содержимого ОП и кэш-памяти для однопроцессорных ЭВМ, характеристики дисковой кэш-памяти)." [level=2] [ref=e926]
  - list [ref=e927]:
    - listitem [ref=e928]:
      - strong [ref=e929]: "Алгоритмы замещения строки:"
      - list [ref=e930]:
        - listitem [ref=e931]:
          - strong [ref=e932]: LRU
          - text: (Least Recently Used) — вытесняем дольше всех неиспользуемую.
        - listitem [ref=e933]:
          - strong [ref=e934]: LFU
          - text: (Least Frequently Used) — реже всех используемую.
        - listitem [ref=e935]:
          - strong [ref=e936]: FIFO
          - text: — первую вошедшую.
        - listitem [ref=e937]:
          - strong [ref=e938]: Random
          - text: — случайную.
        - listitem [ref=e939]:
          - strong [ref=e940]: ARC
          - text: (Adaptive Replacement Cache) — комбинирует LRU+LFU (патент IBM).
    - listitem [ref=e941]:
      - strong [ref=e942]: "Алгоритмы согласования ОП↔кэш (однопроцессорные ЭВМ, по лекции):"
      - list [ref=e943]:
        - listitem [ref=e944]:
          - strong [ref=e945]: Сквозная запись (write-through)
          - text: — сразу в кэш и в ОП. Просто, но медленно.
        - listitem [ref=e946]:
          - strong [ref=e947]: Простой свопинг
          - text: — обратная запись блока в ОП при его вытеснении.
        - listitem [ref=e948]:
          - strong [ref=e949]: Свопинг с флагами
          - text: — в ОП переписывается только при установленном бите модификации (dirty). Быстрее.
        - listitem [ref=e950]:
          - strong [ref=e951]: Регистровый свопинг с флагами
          - text: — то же с буферным регистром для ускорения.
    - listitem [ref=e952]:
      - strong [ref=e953]: Дисковый кэш
      - text: — буфер в ОЗУ для часто запрашиваемых секторов диска; ускоряет дисковый ввод-вывод.
  - heading "22. Организация защиты памяти (назначение средств защиты памяти, краткое описание методов защиты памяти)." [level=2] [ref=e954]
