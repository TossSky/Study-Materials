  - list [ref=e320]:
    - listitem [ref=e321]:
      - strong [ref=e322]: "Виды архитектур ЭВМ:"
      - text: централизованная, магистральная, иерархическая (с канальными процессорами); по организации памяти ЦУ —
      - strong [ref=e323]: фон-неймановская/принстонская
      - text: (общая память команд и данных) vs
      - strong [ref=e324]: гарвардская
      - text: (раздельные памяти и шины — быстрее, в DSP/МК).
  - heading "6. Функциональные блоки ЦП (схема и назначение АЛУ, схема и назначение УУ, основные регистры ЦП)." [level=2] [ref=e325]
  - paragraph [ref=e326]:
