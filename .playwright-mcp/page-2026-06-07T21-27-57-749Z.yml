  - list [ref=e332]:
    - listitem [ref=e333]:
      - strong [ref=e334]: АЛУ (арифметико-логическое устройство)
      - text: — выполняет арифметические и логические операции над операндами; синхронизировано с остальными узлами.
  - img [ref=e336]:
    - generic [ref=e342]: операнд A
