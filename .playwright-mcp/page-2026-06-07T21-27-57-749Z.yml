          - strong [ref=e1249]: С захватом цикла (cycle stealing)
          - text: — КПДП «крадёт» отдельные циклы шины.
        - listitem [ref=e1250]:
          - strong [ref=e1251]: Блочный (burst)
          - text: — КПДП захватывает шину на весь блок.
        - listitem [ref=e1252]:
          - strong [ref=e1253]: Прозрачный
          - text: — КПДП работает, когда ЦП не использует шину.
