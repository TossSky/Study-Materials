  - heading "10. Форматы команд и виды адресации (классификация команд процессора, примеры форматов команд x86, RISC-16, AVR)." [level=2] [ref=e512]
  - list [ref=e513]:
    - listitem [ref=e514]:
      - strong [ref=e515]: "Классификация команд:"
      - text: пересылки (load/store, mov), арифметико-логические, передачи управления (переходы, вызовы), ввода-вывода, системные.
    - listitem [ref=e516]:
      - strong [ref=e517]: Формат команды
      - text: "= код операции (КОП) + адресная часть. Число адресов: 0 (стек), 1 (аккумулятор), 2–3 (регистровые). Примеры:"
      - strong [ref=e518]: x86
      - text: — переменная длина;
      - strong [ref=e519]: RISC-16 / AVR
      - text: — фиксированная.
    - listitem [ref=e520]:
      - strong [ref=e521]: "Виды адресации:"
      - list [ref=e522]:
        - listitem [ref=e523]:
          - strong [ref=e524]: Прямая
          - text: — в команде сам адрес операнда.
        - listitem [ref=e525]:
          - strong [ref=e526]: Непосредственная
          - text: — операнд прямо в команде (константа).
        - listitem [ref=e527]:
          - strong [ref=e528]: Регистровая
          - text: — операнд в регистре.
        - listitem [ref=e529]:
          - strong [ref=e530]: Косвенная
          - text: — в команде адрес ячейки/регистра, где лежит адрес операнда.
        - listitem [ref=e531]:
          - strong [ref=e532]: Со смещением (базовая/индексная)
          - text: — адрес = базовый регистр + смещение.
        - listitem [ref=e533]:
          - strong [ref=e534]: Относительная
          - text: — адрес = PC + смещение (для переходов).
  - heading "11. Понятия конвейерной, суперскалярной и векторной обработки (схема работы конвейера, показатели эффективности конвейера, схема суперскалярного ЦП, конфликты в конвейере, назначение MMX, 3DNow!, SSE, SSE2,…)." [level=2] [ref=e535]
