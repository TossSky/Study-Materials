  - 'heading "54. Методы поддержания когерентности кэш-памяти в ВС (перечень методов, общая схема, протокол MESI: состояния и граф переходов)." [level=2] [ref=e1819]'
  - paragraph [ref=e1820]:
    - emphasis [ref=e1821]: Нужны
    - emphasis [ref=e1822]: общая схема
    - emphasis [ref=e1823]: и
    - emphasis [ref=e1824]: граф переходов MESI
    - emphasis [ref=e1825]: .
  - list [ref=e1826]:
    - listitem [ref=e1827]:
      - strong [ref=e1828]: Проблема когерентности
      - text: — в SMP у каждого ЦП свой кэш; одна ячейка ОП может иметь разные копии → нужно согласование.
    - listitem [ref=e1829]:
      - strong [ref=e1830]: "Способы (по лекции):"
      - text: программные (компилятор+ОС, некэшируемые данные); протоколы сквозной/обратной записи;
      - strong [ref=e1831]: запись с аннулированием (write invalidate)
      - text: — при записи в свой кэш копии блока в других кэшах помечаются недостоверными (бит достоверности → 0);
      - strong [ref=e1832]: запись с обновлением (write update)
      - text: — запись дублируется во все кэши с копией (широковещательно); разделяемая кэш-память; стандарт SCI.
    - listitem [ref=e1833]:
      - strong [ref=e1834]: "Аппаратные механизмы реализации:"
      - list [ref=e1835]:
        - listitem [ref=e1836]:
          - strong [ref=e1837]: Снупинг (наблюдение, snooping)
          - text: — контроллер каждого кэша следит за шиной; процессоры широковещательно шлют запросы, локальный контроллер аннулирует/обновляет свою копию.
        - listitem [ref=e1838]:
          - strong [ref=e1839]: Справочниковый (directory)
          - text: — централизованный справочник в ОП хранит, у кого какие копии (для больших систем без общей шины).
    - listitem [ref=e1840]:
      - text: Предшественник MESI —
      - strong [ref=e1841]: протокол однократной записи (write-once)
      - text: ": состояния I (Invalid) / V (Valid) / R (Reserved, однократное изменение, учтено в ОЗУ) / D (Dirty)."
    - listitem [ref=e1842]:
      - strong [ref=e1843]: Протокол MESI
      - text: "— 4 состояния строки кэша:"
      - list [ref=e1844]:
        - listitem [ref=e1845]:
          - strong [ref=e1846]: M (Modified)
          - text: — изменена, только здесь, не совпадает с ОП («грязная»).
        - listitem [ref=e1847]:
          - strong [ref=e1848]: E (Exclusive)
          - text: — только здесь, совпадает с ОП (чистая).
        - listitem [ref=e1849]:
          - strong [ref=e1850]: S (Shared)
          - text: — есть копии в других кэшах, совпадает с ОП.
        - listitem [ref=e1851]:
          - strong [ref=e1852]: I (Invalid)
          - text: — недействительна.
