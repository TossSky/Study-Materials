  - heading "36. Прямой доступ к памяти (схема подключения КПДП, способы распределения системной шины между ЦП и КПДП, примеры схем конфигураций систем ПДП)." [level=2] [ref=e1233]
  - paragraph [ref=e1234]:
    - emphasis [ref=e1235]: Нужна
    - emphasis [ref=e1236]: схема КПДП
    - emphasis [ref=e1237]: и
    - emphasis [ref=e1238]: конфигурации
    - emphasis [ref=e1239]: .
  - list [ref=e1240]:
    - listitem [ref=e1241]:
      - strong [ref=e1242]: ПДП (DMA)
      - text: — обмен ПУ↔память
      - strong [ref=e1243]: без участия ЦП
      - text: ", через контроллер"
      - strong [ref=e1244]: КПДП (DMAC)
      - text: . ЦП освобождается, эффективно для больших блоков.
    - listitem [ref=e1245]:
      - strong [ref=e1246]: "Способы распределения шины между ЦП и КПДП:"
      - list [ref=e1247]:
