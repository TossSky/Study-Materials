  - heading "12. Технологии динамического исполнения (краткое описание средств динамического исполнения, технология многократного декодирование команд)." [level=2] [ref=e656]
  - list [ref=e657]:
    - listitem [ref=e658]:
      - strong [ref=e659]: Динамическое исполнение
      - text: "— процессор сам меняет порядок и условия выполнения команд для загрузки конвейера. Средства:"
      - list [ref=e660]:
        - listitem [ref=e661]:
          - strong [ref=e662]: Предсказание переходов (branch prediction)
          - text: — угадывает направление ветвления, заранее грузит команды.
        - listitem [ref=e663]:
          - strong [ref=e664]: Спекулятивное (упреждающее) исполнение
          - text: — выполняет команды до того, как известно, нужны ли они; результат отбрасывается, если предсказание неверно.
        - listitem [ref=e665]:
          - strong [ref=e666]: Внеочередное исполнение (out-of-order)
          - text: — команды исполняются по готовности данных, а не по порядку.
        - listitem [ref=e667]:
          - strong [ref=e668]: Переименование регистров
          - text: — устраняет ложные зависимости по регистрам.
    - listitem [ref=e669]:
      - strong [ref=e670]: Многократное (множественное) декодирование команд
      - text: — несколько декодеров параллельно разбирают команды, преобразуя сложные CISC-команды в простые микрооперации (μops) для конвейера.
  - heading "13. Основы микроархитектур процессоров (понятие микроархитектуры, технологические нормы, производительность, эксплуатационные характеристики МП, физические параметры МП, общая структура МП)." [level=2] [ref=e671]
  - list [ref=e672]:
    - listitem [ref=e673]:
      - strong [ref=e674]: Микроархитектура
      - text: "(по лекции) — аппаратная организация и логическая структура микропроцессора: регистры, управляющие схемы, АЛУ, запоминающие устройства, информационные магистрали. Противопоставляется"
      - strong [ref=e675]: макроархитектуре
      - text: = система команд, типы данных, режимы адресации, принципы работы МП.
    - listitem [ref=e676]:
      - strong [ref=e677]: Технологический процесс (техпроцесс/нормы)
      - text: — размер элементов на кристалле (нм). Чем меньше, тем больше транзисторов и ниже энергопотребление.
    - listitem [ref=e678]:
      - strong [ref=e679]: Степень интеграции
      - text: — число элементов на кристалле.
    - listitem [ref=e680]:
      - strong [ref=e681]: "Производительность:"
      - text: тактовая частота ядра, частота системной шины, объём кэша (L1/L2/L3).
    - listitem [ref=e682]:
      - strong [ref=e683]: "Эксплуатационные характеристики:"
      - text: напряжение питания, потребляемая мощность, тепловыделение (TDP), макс. температура.
    - listitem [ref=e684]:
      - strong [ref=e685]: "Физические параметры:"
      - text: тип и размер корпуса, размер кристалла, число и форма выводов.
    - listitem [ref=e686]:
      - strong [ref=e687]: "Общая структура МП:"
      - text: ядро (АЛУ, регистры, кэш L1/L2) + контроллер памяти + шина/интерконнект между ядрами + периферийные блоки (графика, контроллеры ВВ).
  - heading "14. Микроархитектуры процессоров Intel (перечень поколений и характерные черты микропроцессоров, схема и характеристики какого-нибудь из последних МП)." [level=2] [ref=e688]
