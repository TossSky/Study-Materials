  - heading "5. Архитектуры ЭВМ и принципы фон Неймана (уровни детализации структуры ВМ, принципы фон-неймановской концепции, структура фон-неймановской ВМ, виды архитектур ЭВМ)." [level=2] [ref=e287]
  - paragraph [ref=e288]:
    - emphasis [ref=e289]: Нужна
    - emphasis [ref=e290]: структура фон-неймановской ВМ
    - emphasis [ref=e291]: .
  - list [ref=e292]:
    - listitem [ref=e293]:
      - strong [ref=e294]: "Уровни детализации структуры ВМ (7, сверху вниз):"
      - text: языки высокого уровня → ассемблер → ОС → архитектура системы команд → микроархитектура → цифровой логический → физический (транзисторный).
    - listitem [ref=e295]:
      - strong [ref=e296]: "Принципы фон Неймана:"
      - list [ref=e297]:
        - listitem [ref=e298]:
          - strong [ref=e299]: Двоичное кодирование
          - text: данных и команд.
        - listitem [ref=e300]:
          - strong [ref=e301]: Программное управление
          - text: — программа из команд, выполняемых последовательно.
        - listitem [ref=e302]:
          - strong [ref=e303]: Однородность памяти
          - text: — команды и данные в одной памяти, неразличимы по виду (команду можно обрабатывать как данные).
        - listitem [ref=e304]:
          - strong [ref=e305]: Адресуемость памяти
          - text: — память из ячеек с адресами, доступ по адресу.
  - img [ref=e307]:
