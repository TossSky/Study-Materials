  - list [ref=e367]:
    - listitem [ref=e368]:
      - strong [ref=e369]: "Два типа УУ:"
      - text: с
      - strong [ref=e370]: жёсткой (схемной)
      - text: логикой — быстрое, под конкретную систему команд (→ RISC);
      - strong [ref=e371]: микропрограммное
      - text: — гибкое (перенастройка заменой микропрограммы), но медленнее (→ CISC).
    - listitem [ref=e372]:
      - strong [ref=e373]: "Основные регистры ЦП:"
      - list [ref=e374]:
        - listitem [ref=e375]:
