  - list [ref=e353]:
    - listitem [ref=e354]:
      - strong [ref=e355]: УУ (устройство управления)
      - text: — формирует управляющие сигналы, дешифрирует команды, задаёт последовательность работы узлов.
  - img [ref=e357]:
    - generic [ref=e360]: команда
