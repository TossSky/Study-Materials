      - strong [ref=e2961]: Квантовые
      - text: — кубиты в
      - strong [ref=e2962]: суперпозиции
      - text: (0 и 1 одновременно) +
      - strong [ref=e2963]: запутанность
      - text: → экспоненциальный параллелизм для некоторых задач (факторизация, поиск).
  - 'heading "54. Методы поддержания когерентности кэш-памяти в ВС (перечень методов, общая схема, протокол MESI: состояния и граф переходов)." [level=2] [ref=e2964]'
  - paragraph [ref=e2965]:
    - emphasis [ref=e2966]: Нужны
    - emphasis [ref=e2967]: общая схема
    - emphasis [ref=e2968]: и
    - emphasis [ref=e2969]: граф переходов MESI
    - emphasis [ref=e2970]: .
  - list [ref=e2971]:
    - listitem [ref=e2972]:
      - strong [ref=e2973]: Проблема когерентности
      - text: — в SMP у каждого ЦП свой кэш; одна ячейка ОП может иметь разные копии → нужно согласование.
    - listitem [ref=e2974]:
      - strong [ref=e2975]: "Способы (по лекции):"
      - text: программные (компилятор+ОС, некэшируемые данные); протоколы сквозной/обратной записи;
      - strong [ref=e2976]: запись с аннулированием (write invalidate)
      - text: — при записи в свой кэш копии блока в других кэшах помечаются недостоверными (бит достоверности → 0);
      - strong [ref=e2977]: запись с обновлением (write update)
      - text: — запись дублируется во все кэши с копией (широковещательно); разделяемая кэш-память; стандарт SCI.
    - listitem [ref=e2978]:
      - strong [ref=e2979]: "Аппаратные механизмы реализации:"
      - list [ref=e2980]:
        - listitem [ref=e2981]:
          - strong [ref=e2982]: Снупинг (наблюдение, snooping)
          - text: — контроллер каждого кэша следит за шиной; процессоры широковещательно шлют запросы, локальный контроллер аннулирует/обновляет свою копию.
        - listitem [ref=e2983]:
          - strong [ref=e2984]: Справочниковый (directory)
          - text: — централизованный справочник в ОП хранит, у кого какие копии (для больших систем без общей шины).
    - listitem [ref=e2985]:
      - text: Предшественник MESI —
      - strong [ref=e2986]: протокол однократной записи (write-once)
      - text: ": состояния I (Invalid) / V (Valid) / R (Reserved, однократное изменение, учтено в ОЗУ) / D (Dirty)."
    - listitem [ref=e2987]:
      - strong [ref=e2988]: Протокол MESI
      - text: "— 4 состояния строки кэша:"
      - list [ref=e2989]:
        - listitem [ref=e2990]:
          - strong [ref=e2991]: M (Modified)
          - text: — изменена, только здесь, не совпадает с ОП («грязная»).
        - listitem [ref=e2992]:
          - strong [ref=e2993]: E (Exclusive)
          - text: — только здесь, совпадает с ОП (чистая).
        - listitem [ref=e2994]:
          - strong [ref=e2995]: S (Shared)
          - text: — есть копии в других кэшах, совпадает с ОП.
        - listitem [ref=e2996]:
          - strong [ref=e2997]: I (Invalid)
          - text: — недействительна.
