      - text: — параллельный, шина для нескольких устройств, для серверов (надёжность, очередь команд).
    - listitem [ref=e1752]:
      - strong [ref=e1753]: SAS (Serial Attached SCSI)
      - text: — последовательный наследник SCSI, совместим с SATA-дисками, для серверов/СХД.
  - 'heading "32. Внешние интерфейсы для ввода/вывода: RS-232C, LPT (EPP, ECP), USB, SPI, I²C (основные характеристики)." [level=2] [ref=e1754]'
  - list [ref=e1755]:
