  - heading "26. Основы построения компьютерных шин (типы шин, иерархия шин, ША, ШД, ШУ, состав линий в ШУ)." [level=2] [ref=e1619]
  - list [ref=e1620]:
    - listitem [ref=e1621]:
      - strong [ref=e1622]: Шина (bus)
      - text: — набор линий для обмена между функциональными блоками (ЦП↔память, ЦП↔ВВ, память↔ВВ); «двунаправленный универсальный коммутатор».
    - listitem [ref=e1623]:
      - strong [ref=e1624]: "Функциональные типы:"
      - strong [ref=e1625]: ША (адреса)
      - text: —
      - strong [ref=e1626]: однонаправленная
      - text: ", разрядность задаёт объём адресуемой памяти ("
      - code [ref=e1627]: N=2ⁱ
      - text: );
      - strong [ref=e1628]: ШД (данных)
      - text: —
      - strong [ref=e1629]: двунаправленная
      - text: ", последовательная или параллельная, ширина = слово;"
      - strong [ref=e1630]: ШУ (управления)
      - text: — линии управляющей информации и состояния.
    - listitem [ref=e1631]:
      - strong [ref=e1632]: "Иерархия шин:"
      - text: системная (ЦП–память) → шина расширения → шина ввода/вывода (через адаптеры); архитектура с «пристройкой» (mezzanine). Чем ближе к ЦП, тем быстрее.
    - listitem [ref=e1633]:
      - strong [ref=e1634]: "Состав линий ШУ (7 групп):"
      - text: сигналы управления транзакциями (тип операции, кол-во передаваемых байт, тип адреса, тип протокола), информация состояния (статуса), арбитраж, прерывания, последовательные локальные сети, позиционный код, тактирование и синхронизация.
  - heading "27. Организация арбитража шины (схемы приоритетов, схемы арбитража, способы организации опроса)." [level=2] [ref=e1635]
  - paragraph [ref=e1636]:
    - emphasis [ref=e1637]: Нужны
    - emphasis [ref=e1638]: схемы приоритетов и арбитража
    - emphasis [ref=e1639]: .
  - list [ref=e1640]:
    - listitem [ref=e1641]:
      - strong [ref=e1642]: Арбитраж
      - text: — процедура допуска к управлению шиной только одного из ведущих (master).
      - strong [ref=e1643]: Арбитр
      - text: распределяет доступ (обычно на северном мосту).
    - listitem [ref=e1644]:
      - strong [ref=e1645]: "Схемы приоритетов:"
      - strong [ref=e1646]: статические
      - text: (фиксированные) и
      - strong [ref=e1647]: динамические
      - text: ". Динамические алгоритмы: простая циклическая смена, циклическая с учётом последнего запроса, по случайному закону, равных приоритетов, LRU (наиболее давнее использование)."
    - listitem [ref=e1648]:
      - strong [ref=e1649]: "Схемы арбитража:"
      - list [ref=e1650]:
        - listitem [ref=e1651]:
          - strong [ref=e1652]: Централизованная
          - text: "(один арбитр):"
          - strong [ref=e1653]: параллельная
          - text: — у каждого ведущего своя линия запроса/предоставления;
          - strong [ref=e1654]: последовательная (цепочечная, daisy chain)
          - text: — сигнал разрешения идёт по цепочке, ближний к арбитру = высший приоритет.
        - listitem [ref=e1655]:
          - strong [ref=e1656]: Децентрализованная (распределённая)
          - text: — единого арбитра нет, у каждого ведущего свой контроллер шины.
    - listitem [ref=e1657]:
      - strong [ref=e1658]: "Способы организации опроса:"
      - strong [ref=e1659]: централизованный
      - text: (контроллер по очереди опрашивает ведущих, выставляя их адрес) и
      - strong [ref=e1660]: децентрализованный
      - text: (каждый ведущий сам формирует адрес следующего).
  - document [ref=e1662]:
