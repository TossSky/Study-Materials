  - heading "17. Основная память, статические ОЗУ (структура ОП, характеристики, блочная организация ОП, запоминающий элемент в статическом ОЗУ, виды статических ОЗУ)." [level=2] [ref=e1218]
  - paragraph [ref=e1219]:
    - emphasis [ref=e1220]: Нужен
    - emphasis [ref=e1221]: запоминающий элемент SRAM
    - emphasis [ref=e1222]: .
  - list [ref=e1223]:
    - listitem [ref=e1224]:
      - strong [ref=e1225]: "Структура ОП:"
      - text: массив ячеек с адресами, дешифратор адреса, регистры данных, схемы чтения/записи.
      - strong [ref=e1226]: Блочная организация
      - text: — память делится на банки для параллельного доступа.
    - listitem [ref=e1227]:
      - strong [ref=e1228]: "Характеристики:"
      - text: объём, разрядность, время доступа, цикл обращения.
    - listitem [ref=e1229]:
      - strong [ref=e1230]: Запоминающий элемент SRAM
      - text: —
      - strong [ref=e1231]: триггер на 4–6 транзисторах
      - text: . Хранит бит, пока есть питание, регенерация не нужна. Быстрый, но дорогой и малой плотности → используется для
      - strong [ref=e1232]: кэша
      - text: .
    - listitem [ref=e1233]:
      - strong [ref=e1234]: "Виды SRAM:"
      - text: асинхронные, синхронные (SSRAM), конвейерные (PB SRAM).
  - heading "18. Динамические ОЗУ (виды динамических ОЗУ, запоминающий элемент, методы ускорения микросхемы, способы регенерации данных)." [level=2] [ref=e1235]
  - paragraph [ref=e1236]:
    - emphasis [ref=e1237]: Нужен
    - emphasis [ref=e1238]: запоминающий элемент DRAM
    - emphasis [ref=e1239]: .
  - list [ref=e1240]:
    - listitem [ref=e1241]:
      - strong [ref=e1242]: Запоминающий элемент DRAM
      - text: —
      - strong [ref=e1243]: 1 транзистор + 1 конденсатор
      - text: ". Бит = заряд конденсатора. Дёшево, высокая плотность → основная память. Минус: заряд утекает → нужна"
      - strong [ref=e1244]: регенерация
      - text: .
    - listitem [ref=e1245]:
      - strong [ref=e1246]: "Способы регенерации (3, по лекции):"
      - strong [ref=e1247]: ROR
      - text: (RAS Only Refresh — построчно),
      - strong [ref=e1248]: CBR
      - text: (CAS before RAS — по внутреннему счётчику строк),
      - strong [ref=e1249]: Self-Refresh
      - text: (авторегенерация в режиме энергосбережения).
    - listitem [ref=e1250]:
      - strong [ref=e1251]: "Методы ускорения:"
      - text: FPM, EDO,
      - strong [ref=e1252]: SDRAM
      - text: (синхронная),
      - strong [ref=e1253]: DDR/DDR2/3/4/5
      - text: (передача по обоим фронтам такта, удвоение/учетверение полосы).
  - separator [ref=e1254]
