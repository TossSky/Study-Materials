  - heading "20. Организация кэш-памяти, способы отображения основной памяти на кэш-память (назначение кэш-памяти, уровни кэш-памяти, факторы эффективности кэш-памяти, схемы вариантов отображения ОП на кэш-память и сравнение)." [level=2] [ref=e1349]
  - paragraph [ref=e1350]:
    - emphasis [ref=e1351]: Нужны
    - emphasis [ref=e1352]: схемы вариантов отображения
    - emphasis [ref=e1353]: .
  - list [ref=e1354]:
    - listitem [ref=e1355]:
      - strong [ref=e1356]: Назначение кэша
      - text: "— быстрая буферная память между ЦП и ОП, хранит часто используемые данные (принцип локальности: временна́я и пространственная)."
    - listitem [ref=e1357]:
      - strong [ref=e1358]: "Уровни:"
      - text: L1 (в ядре, самый быстрый, раздельный для команд/данных), L2, L3 (общий для ядер).
    - listitem [ref=e1359]:
      - strong [ref=e1360]: "Факторы эффективности:"
      - text: объём, скорость, процент попаданий (hit rate), стратегия отображения и замещения.
    - listitem [ref=e1361]:
      - strong [ref=e1362]: "Способы отображения ОП на кэш:"
      - list [ref=e1363]:
        - listitem [ref=e1364]:
          - strong [ref=e1365]: Прямое (direct-mapped)
          - text: — блок ОП → строго в одну строку кэша (
          - code [ref=e1366]: № = адрес mod N
          - text: ). Просто и быстро, но частые вытеснения (конфликты).
        - listitem [ref=e1367]:
          - strong [ref=e1368]: Полностью ассоциативное
          - text: — блок → в любую строку. Гибко, нет конфликтов, но дорогой поиск (сравнение всех тегов).
        - listitem [ref=e1369]:
          - strong [ref=e1370]: Множественно-ассоциативное (set-associative)
          - text: — кэш делится на наборы по K строк; блок → в любую строку своего набора.
          - strong [ref=e1371]: Компромисс
          - text: ", применяется на практике (2-, 4-, 8-way)."
  - document [ref=e1373]:
    - generic [ref=e1379]:
      - paragraph [ref=e1386]: блок ОП
      - paragraph [ref=e1393]:
        - text: "Прямое:"
        - text: 1 строка (адрес mod N)
      - paragraph [ref=e1400]:
        - text: "Полностью ассоциативное:"
        - text: любая строка
      - paragraph [ref=e1407]:
        - text: "Множ.-ассоциативное:"
        - text: любая строка набора (K-way)
  - heading "21. Порядок замещения строк в кэш-памяти, согласование ОП и кэш-памяти, дисковая кэш-память (перечень алгоритмов выбора замещаемой строки, краткое описание алгоритмов согласование содержимого ОП и кэш-памяти для однопроцессорных ЭВМ, характеристики дисковой кэш-памяти)." [level=2] [ref=e1408]
  - list [ref=e1409]:
    - listitem [ref=e1410]:
      - strong [ref=e1411]: "Алгоритмы замещения строки:"
      - list [ref=e1412]:
        - listitem [ref=e1413]:
          - strong [ref=e1414]: LRU
          - text: (Least Recently Used) — вытесняем дольше всех неиспользуемую.
        - listitem [ref=e1415]:
          - strong [ref=e1416]: LFU
          - text: (Least Frequently Used) — реже всех используемую.
        - listitem [ref=e1417]:
          - strong [ref=e1418]: FIFO
          - text: — первую вошедшую.
        - listitem [ref=e1419]:
          - strong [ref=e1420]: Random
          - text: — случайную.
        - listitem [ref=e1421]:
          - strong [ref=e1422]: ARC
          - text: (Adaptive Replacement Cache) — комбинирует LRU+LFU (патент IBM).
    - listitem [ref=e1423]:
      - strong [ref=e1424]: "Алгоритмы согласования ОП↔кэш (однопроцессорные ЭВМ, по лекции):"
      - list [ref=e1425]:
        - listitem [ref=e1426]:
          - strong [ref=e1427]: Сквозная запись (write-through)
          - text: — сразу в кэш и в ОП. Просто, но медленно.
        - listitem [ref=e1428]:
          - strong [ref=e1429]: Простой свопинг
          - text: — обратная запись блока в ОП при его вытеснении.
        - listitem [ref=e1430]:
          - strong [ref=e1431]: Свопинг с флагами
          - text: — в ОП переписывается только при установленном бите модификации (dirty). Быстрее.
        - listitem [ref=e1432]:
          - strong [ref=e1433]: Регистровый свопинг с флагами
          - text: — то же с буферным регистром для ускорения.
    - listitem [ref=e1434]:
      - strong [ref=e1435]: Дисковый кэш
      - text: — буфер в ОЗУ для часто запрашиваемых секторов диска; ускоряет дисковый ввод-вывод.
  - heading "22. Организация защиты памяти (назначение средств защиты памяти, краткое описание методов защиты памяти)." [level=2] [ref=e1436]
  - list [ref=e1437]:
    - listitem [ref=e1438]:
      - strong [ref=e1439]: "Назначение:"
      - text: не дать программе обратиться к чужой/системной памяти (изоляция, надёжность, безопасность).
    - listitem [ref=e1440]:
      - strong [ref=e1441]: "Методы (4, по лекции):"
      - list [ref=e1442]:
        - listitem [ref=e1443]:
          - strong [ref=e1444]: Защита отдельных ячеек
          - text: — «разряд защиты» в ячейке запрещает запись в неё (для отладки программ).
        - listitem [ref=e1445]:
          - strong [ref=e1446]: Граничные регистры
          - text: — задают нижнюю и верхнюю границу области процесса.
        - listitem [ref=e1447]:
          - strong [ref=e1448]: Ключи защиты
          - text: — каждому блоку памяти и программе присвоен ключ; доступ при совпадении.
        - listitem [ref=e1449]:
          - strong [ref=e1450]: Кольца защиты (уровни привилегий 0–3)
          - text: — режим ядра vs пользователя; для страниц — биты доступа R/W/X.
  - heading "23. Концепция виртуальной памяти (схемы страничного, сегментного и сегментно-страничного распределения виртуальной памяти, страничная таблица, TLB)." [level=2] [ref=e1451]
  - paragraph [ref=e1452]:
    - emphasis [ref=e1453]: Нужны
    - emphasis [ref=e1454]: схемы страничного, сегментного, сегментно-страничного
    - emphasis [ref=e1455]: распределения.
  - list [ref=e1456]:
    - listitem [ref=e1457]:
      - strong [ref=e1458]: Виртуальная память
      - text: "— механизм: программа работает в логическом (виртуальном) адресном пространстве больше физического; трансляция вирт.→физ. адреса аппаратно (MMU), редко используемое выгружается на диск (swap)."
    - listitem [ref=e1459]:
      - strong [ref=e1460]: Страничное
      - text: — память делится на страницы фиксированного размера. Вирт. адрес = № страницы + смещение → через
      - strong [ref=e1461]: страничную таблицу
      - text: в физ. адрес.
    - listitem [ref=e1462]:
      - strong [ref=e1463]: Сегментное
      - text: "— деление на сегменты переменной длины (по смыслу: код, данные, стек). Адрес = № сегмента + смещение."
    - listitem [ref=e1464]:
      - strong [ref=e1465]: Сегментно-страничное
      - text: "— комбинация: сегменты делятся на страницы (x86). Гибкость сегментов + удобство страниц."
    - listitem [ref=e1466]:
      - strong [ref=e1467]: Страничная таблица
      - text: "— поля записи:"
      - strong [ref=e1468]: V
      - text: (присутствие страницы в ОП; V=0 →
      - strong [ref=e1469]: страничный сбой / page fault
      - text: ),
      - strong [ref=e1470]: R
      - text: (использование — для замещения),
      - strong [ref=e1471]: M
      - text: (модификация — для свопинга с флагами),
      - strong [ref=e1472]: A
      - text: "(права доступа: чтение/запись). Сокращение длины таблицы: многоуровневые таблицы, инвертированная таблица."
    - listitem [ref=e1473]:
      - text: "Характеристики:"
      - strong [ref=e1474]: страничная
      - text: → внутренняя фрагментация;
      - strong [ref=e1475]: сегментная
      - text: → внешняя фрагментация, но удобен разделяемый доступ к общим сегментам.
    - listitem [ref=e1476]:
      - strong [ref=e1477]: TLB (Translation Lookaside Buffer)
      - text: — кэш недавних трансляций адресов (8–4096 записей, полностью/множественно-ассоциативный), ускоряет MMU (без него — лишнее обращение к таблице на каждый доступ).
  - code [ref=e1479]: вирт. адрес ─► [TLB?] ─есть─► физ. адрес └─нет─► страничная таблица ─► физ. адрес (+ занести в TLB)
  - heading "24. Организация НЖМД, SSD, оптической памяти, магнитных лент (характеристики дисковой памяти, принципы организации SSD-памяти, принципы организации оптической памяти, назначение магнитных лент)." [level=2] [ref=e1480]
  - list [ref=e1481]:
    - listitem [ref=e1482]:
      - strong [ref=e1483]: НЖМД (HDD)
      - text: "— магнитные пластины, головки. Геометрия:"
      - strong [ref=e1484]: дорожки, секторы, цилиндры
      - text: ". Характеристики: ёмкость, скорость вращения (об/мин), время доступа (seek), интерфейс. Дёшево за ГБ, но механика — медленно."
    - listitem [ref=e1485]:
      - strong [ref=e1486]: SSD
      - text: "— флеш-память (NAND), нет механики. Быстрее, тише, надёжнее к ударам. Минус: ограниченный ресурс перезаписи ячеек →"
      - strong [ref=e1487]: контроллер с wear-leveling
      - text: (равномерный износ), TRIM. Чем больше параллельных каналов NAND, тем быстрее.
    - listitem [ref=e1488]:
      - strong [ref=e1489]: Оптика (CD/DVD/Blu-ray)
      - text: — данные = питы/лэнды на дорожке, читаются лазером. Спиральная дорожка от центра.
    - listitem [ref=e1490]:
      - strong [ref=e1491]: Магнитные ленты
      - text: — последовательный доступ, огромная ёмкость, дёшево →
      - strong [ref=e1492]: архивное резервное копирование
      - text: .
  - heading "25. Избыточные дисковые подсистемы (назначение, способы повышения производительности ЗУ, способы повышения надёжности ЗУ, схемы уровней RAID-массивов)." [level=2] [ref=e1493]
  - paragraph [ref=e1494]:
    - emphasis [ref=e1495]: Нужны
    - emphasis [ref=e1496]: схемы уровней RAID
    - emphasis [ref=e1497]: .
  - list [ref=e1498]:
    - listitem [ref=e1499]:
      - strong [ref=e1500]: Назначение RAID
      - text: — объединить диски для роста производительности и/или надёжности.
    - listitem [ref=e1501]:
      - strong [ref=e1502]: Производительность
      - text: —
      - strong [ref=e1503]: расслоение (stripe)
      - text: ": данные параллельно на несколько дисков."
    - listitem [ref=e1504]:
      - strong [ref=e1505]: Надёжность
      - text: —
      - strong [ref=e1506]: зеркалирование (mirror)
      - text: и
      - strong [ref=e1507]: контроль чётности (parity)
      - text: .
    - listitem [ref=e1508]:
      - strong [ref=e1509]: "Уровни:"
      - list [ref=e1510]:
        - listitem [ref=e1511]:
          - strong [ref=e1512]: RAID 0
          - text: — striping, без избыточности. Быстро, но смерть 1 диска = потеря всего.
        - listitem [ref=e1513]:
          - strong [ref=e1514]: RAID 1
          - text: — mirroring (зеркало). Надёжно, но 50% ёмкости.
        - listitem [ref=e1515]:
          - strong [ref=e1516]: RAID 5
          - text: — striping + чётность по всем дискам. Переживает отказ 1 диска. Баланс.
        - listitem [ref=e1517]:
          - strong [ref=e1518]: RAID 6
          - text: — две чётности, переживает 2 диска.
        - listitem [ref=e1519]:
          - strong [ref=e1520]: RAID 10 (1+0)
          - text: — зеркало + страйп. Скорость и надёжность, дорого.
  - document [ref=e1522]:
    - generic [ref=e1525]:
