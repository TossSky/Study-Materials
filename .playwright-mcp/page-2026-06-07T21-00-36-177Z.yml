  - heading "28. Типы протоколов шин, синхронная и асинхронная передача данных (управление процессом передачи данных, схемы и принципы работы протоколов шин)." [level=2] [ref=e1706]
  - paragraph [ref=e1707]:
    - emphasis [ref=e1708]: Нужны
    - emphasis [ref=e1709]: схемы протоколов
    - emphasis [ref=e1710]: .
  - list [ref=e1711]:
    - listitem [ref=e1712]:
      - strong [ref=e1713]: Синхронная передача
      - text: — общий тактовый сигнал, события привязаны к фронтам такта. Быстро и просто, но все устройства на одной частоте, длина ограничена.
    - listitem [ref=e1714]:
      - strong [ref=e1715]: Асинхронная передача
      - text: — без общего такта, по
      - strong [ref=e1716]: квитированию (handshake)
      - text: ": запрос → готовность (request/acknowledge). Гибко (разные скорости устройств), но медленнее и сложнее."
  - code [ref=e1718]: "Синхронная: CLK ‾|_|‾|_|‾|_ данные привязаны к фронтам Асинхронная: REQ ──► устройство ──► ACK (рукопожатие)"
  - heading "29. Методы повышения эффективности шин, надёжность и отказоустойчивость шины (способы повышения эффективности шин, способы повышения надёжности шин)." [level=2] [ref=e1719]
  - list [ref=e1720]:
    - listitem [ref=e1721]:
      - strong [ref=e1722]: "Повышение эффективности (полосы):"
      - strong [ref=e1723]: отказ от мультиплексирования
      - text: ША/ШД, увеличение ширины ШД и тактовой частоты,
      - strong [ref=e1724]: блочные/пакетные транзакции (burst)
      - text: ","
      - strong [ref=e1725]: конвейеризация
      - text: и
      - strong [ref=e1726]: расщепление транзакций (split)
      - text: ", арбитраж с перекрытием и с удержанием шины, переход на"
      - strong [ref=e1727]: последовательные дифференциальные
      - text: линии (PCIe вместо PCI).
    - listitem [ref=e1728]:
      - strong [ref=e1729]: "Повышение надёжности:"
      - text: контроль чётности/ECC на шине, дублирование/резервные линии, экранирование, протоколы повтора при ошибке.
  - 'heading "30. Внутренние интерфейсы ЭВМ: EISA, LPC, PCI, PCI-E, AGP (основные характеристики)." [level=2] [ref=e1730]'
  - list [ref=e1731]:
    - listitem [ref=e1732]:
      - strong [ref=e1733]: EISA
      - text: — расширение ISA, 32-бит, для серверов (устаревший).
    - listitem [ref=e1734]:
      - strong [ref=e1735]: LPC (Low Pin Count)
      - text: — для низкоскоростной периферии (контроллеры клавиатуры, BIOS), заменил ISA.
    - listitem [ref=e1736]:
      - strong [ref=e1737]: PCI
      - text: — параллельная, 32/64-бит, 33/66 МГц, общая шина с арбитражем (устаревает).
    - listitem [ref=e1738]:
      - strong [ref=e1739]: PCI-E (PCI Express)
      - text: —
      - strong [ref=e1740]: последовательная
      - text: ", по «линиям» (lanes ×1…×16), независимые дифференциальные пары, point-to-point. Современный стандарт."
    - listitem [ref=e1741]:
      - strong [ref=e1742]: AGP
      - text: — выделенный интерфейс для видеокарт (между PCI и PCI-E исторически), вытеснен PCI-E.
  - 'heading "31. Внешние интерфейсы для ЗУ: IDE, SATA, SCSI, SAS (основные характеристики)." [level=2] [ref=e1743]'
  - list [ref=e1744]:
    - listitem [ref=e1745]:
      - strong [ref=e1746]: IDE/PATA
      - text: — параллельный, для HDD/CD, шлейф 40/80 жил (устарел).
    - listitem [ref=e1747]:
      - strong [ref=e1748]: SATA
      - text: —
      - strong [ref=e1749]: последовательный
