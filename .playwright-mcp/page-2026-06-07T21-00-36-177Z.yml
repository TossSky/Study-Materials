  - heading "3. Назначение и характеристики элементарных узлов ЭВМ (вентили, триггеры, сумматоры, счётчики, компараторы, шифраторы/дешифраторы, мультиплексоры/демультиплексоры, ЦАП/АЦП – назначение и краткое описание всех узлов)." [level=2] [ref=e232]
  - paragraph [ref=e233]:
    - emphasis [ref=e234]: Схему рисовать не требует — только назначение. Можно один пример (напр. вентиль).
  - list [ref=e235]:
    - listitem [ref=e236]:
      - strong [ref=e237]: Вентиль (логический элемент)
      - text: — реализует булеву функцию (И, ИЛИ, НЕ, И-НЕ, ИЛИ-НЕ, XOR). Базовый кирпич схемотехники.
    - listitem [ref=e238]:
      - strong [ref=e239]: Триггер
      - text: — элемент памяти на 1 бит, имеет 2 устойчивых состояния (RS, D, T, JK).
    - listitem [ref=e240]:
      - strong [ref=e241]: Сумматор
      - text: — сложение двоичных чисел (полусумматор, полный сумматор с переносом).
    - listitem [ref=e242]:
      - strong [ref=e243]: Счётчик
      - text: — подсчёт импульсов / хранение числа, +1 каждый такт (суммирующий, вычитающий, реверсивный).
    - listitem [ref=e244]:
      - strong [ref=e245]: Компаратор
      - text: — сравнение двух чисел (=, <, >).
    - listitem [ref=e246]:
      - strong [ref=e247]: Шифратор / дешифратор
      - text: "— преобразование кода: позиционный код ↔ двоичный (дешифратор активирует один выход по входному коду)."
    - listitem [ref=e248]:
      - strong [ref=e249]: Мультиплексор / демультиплексор
      - text: — MUX выбирает один из N входов на общий выход по адресу; DEMUX — наоборот, направляет вход на один из N выходов.
    - listitem [ref=e250]:
      - strong [ref=e251]: ЦАП / АЦП
      - text: "— преобразование цифра↔аналог: ЦАП цифровой код → напряжение, АЦП напряжение → цифровой код (дискретизация + квантование)."
