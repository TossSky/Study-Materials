  - heading "9. Основы построения CISC-, RISC- и VLIW-архитектур системы команд (принципы построения основных архитектур, схема процессора, сравнение функций устройства управления в CISC и RISC процессорах)." [level=2] [ref=e629]
  - paragraph [ref=e630]:
