    - listitem [ref=e730]:
      - strong [ref=e731]: "Классификация команд:"
      - text: пересылки (load/store, mov), арифметико-логические, передачи управления (переходы, вызовы), ввода-вывода, системные.
    - listitem [ref=e732]:
      - strong [ref=e733]: Формат команды
      - text: "= код операции (КОП) + адресная часть. Число адресов: 0 (стек), 1 (аккумулятор), 2–3 (регистровые). Примеры:"
      - strong [ref=e734]: x86
      - text: — переменная длина;
      - strong [ref=e735]: RISC-16 / AVR
      - text: — фиксированная.
    - listitem [ref=e736]:
      - strong [ref=e737]: "Виды адресации:"
      - list [ref=e738]:
        - listitem [ref=e739]:
          - strong [ref=e740]: Прямая
          - text: — в команде сам адрес операнда.
        - listitem [ref=e741]:
          - strong [ref=e742]: Непосредственная
          - text: — операнд прямо в команде (константа).
        - listitem [ref=e743]:
          - strong [ref=e744]: Регистровая
          - text: — операнд в регистре.
        - listitem [ref=e745]:
          - strong [ref=e746]: Косвенная
          - text: — в команде адрес ячейки/регистра, где лежит адрес операнда.
        - listitem [ref=e747]:
          - strong [ref=e748]: Со смещением (базовая/индексная)
          - text: — адрес = базовый регистр + смещение.
        - listitem [ref=e749]:
          - strong [ref=e750]: Относительная
          - text: — адрес = PC + смещение (для переходов).
