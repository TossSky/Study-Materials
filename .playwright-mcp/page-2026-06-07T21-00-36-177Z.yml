      - paragraph [ref=e1677]: Арбитраж шины
      - paragraph [ref=e1684]:
        - text: Централизованный
        - text: (один арбитр)
      - paragraph [ref=e1691]:
        - text: Децентрализованный
        - text: (у каждого свой контроллер шины)
