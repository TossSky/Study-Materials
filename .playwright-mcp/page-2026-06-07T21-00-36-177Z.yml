  - heading "12. Технологии динамического исполнения (краткое описание средств динамического исполнения, технология многократного декодирование команд)." [level=2] [ref=e901]
  - list [ref=e902]:
    - listitem [ref=e903]:
      - strong [ref=e904]: Динамическое исполнение
      - text: "— процессор сам меняет порядок и условия выполнения команд для загрузки конвейера. Средства:"
      - list [ref=e905]:
        - listitem [ref=e906]:
          - strong [ref=e907]: Предсказание переходов (branch prediction)
          - text: — угадывает направление ветвления, заранее грузит команды.
        - listitem [ref=e908]:
          - strong [ref=e909]: Спекулятивное (упреждающее) исполнение
          - text: — выполняет команды до того, как известно, нужны ли они; результат отбрасывается, если предсказание неверно.
        - listitem [ref=e910]:
          - strong [ref=e911]: Внеочередное исполнение (out-of-order)
          - text: — команды исполняются по готовности данных, а не по порядку.
        - listitem [ref=e912]:
          - strong [ref=e913]: Переименование регистров
          - text: — устраняет ложные зависимости по регистрам.
    - listitem [ref=e914]:
      - strong [ref=e915]: Многократное (множественное) декодирование команд
      - text: — несколько декодеров параллельно разбирают команды, преобразуя сложные CISC-команды в простые микрооперации (μops) для конвейера.
  - heading "13. Основы микроархитектур процессоров (понятие микроархитектуры, технологические нормы, производительность, эксплуатационные характеристики МП, физические параметры МП, общая структура МП)." [level=2] [ref=e916]
  - list [ref=e917]:
    - listitem [ref=e918]:
      - strong [ref=e919]: Микроархитектура
      - text: "(по лекции) — аппаратная организация и логическая структура микропроцессора: регистры, управляющие схемы, АЛУ, запоминающие устройства, информационные магистрали. Противопоставляется"
      - strong [ref=e920]: макроархитектуре
      - text: = система команд, типы данных, режимы адресации, принципы работы МП.
    - listitem [ref=e921]:
      - strong [ref=e922]: Технологический процесс (техпроцесс/нормы)
      - text: — размер элементов на кристалле (нм). Чем меньше, тем больше транзисторов и ниже энергопотребление.
    - listitem [ref=e923]:
      - strong [ref=e924]: Степень интеграции
      - text: — число элементов на кристалле.
    - listitem [ref=e925]:
      - strong [ref=e926]: "Производительность:"
      - text: тактовая частота ядра, частота системной шины, объём кэша (L1/L2/L3).
    - listitem [ref=e927]:
      - strong [ref=e928]: "Эксплуатационные характеристики:"
      - text: напряжение питания, потребляемая мощность, тепловыделение (TDP), макс. температура.
    - listitem [ref=e929]:
      - strong [ref=e930]: "Физические параметры:"
      - text: тип и размер корпуса, размер кристалла, число и форма выводов.
    - listitem [ref=e931]:
      - strong [ref=e932]: "Общая структура МП:"
      - text: ядро (АЛУ, регистры, кэш L1/L2) + контроллер памяти + шина/интерконнект между ядрами + периферийные блоки (графика, контроллеры ВВ).
